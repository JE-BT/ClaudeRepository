<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="766" viewBox="0 0 1180 766"><title>Anatomy of a decree</title><rect width="1180" height="766" fill="#F6F7F3"/><g transform="translate(30 30) scale(1.55)"><rect x="1.00" y="1.00" width="262.00" height="454.00" rx="10" fill="#E7EAE1" stroke="#1F2A33" stroke-width="2"/><path d="M1,50 V11 A10,10 0 0 1 11,1 H253 A10,10 0 0 1 263,11 V50 Z" fill="#edb1c1"/><line x1="1" y1="50" x2="263" y2="50" stroke="#1F2A33" stroke-width="2"/><rect x="12.00" y="9.00" width="84.70" height="13.00" rx="3" fill="#9A5B12" stroke="none" stroke-width="0"/><text x="17.00" y="18.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">DECREE · DISASTER</text><text x="213.00" y="19.50" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">Treasury: rich</text><circle cx="222" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><circle cx="234" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><circle cx="246" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><text x="12.00" y="41.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="16" fill="#1F2A33" text-anchor="start">The Emperor of Argaria</text><text x="252.00" y="41.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">No. 10</text><text x="12.00" y="72.25" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="16.75" fill="#1F2A33" text-anchor="start">Loststar Dearth</text><text x="12.00" y="85.03" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="8.75" font-style="italic" fill="#4A5560" text-anchor="start">Loststar Dearth strikes the affected area.</text><rect x="12.00" y="95.03" width="240.00" height="33.28" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.4"/><rect x="18.00" y="89.03" width="75.70" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="23.00" y="98.63" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">AFFECTED LINKS</text><text x="19.00" y="115.90" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9.25" fill="#1F2A33" text-anchor="start">Edwall – Fenpnolothim; Edwall – Bearcairn</text><rect x="12.00" y="140.32" width="240.00" height="55.86" rx="5" fill="#F6F7F3" stroke="#B23A2E" stroke-width="1.4"/><rect x="18.00" y="134.32" width="53.80" height="13.00" rx="3" fill="#B23A2E" stroke="none" stroke-width="0"/><text x="23.00" y="143.92" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">ON REVEAL</text><text x="19.00" y="161.18" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">Each player removes one land infrastructure from each</text><text x="19.00" y="172.47" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">of their stations at either end of an affected link (move</text><text x="19.00" y="183.75" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">your expense marker down as usual).</text><rect x="12.00" y="206.18" width="240.00" height="33.28" rx="5" fill="#F6F7F3" stroke="#9A5B12" stroke-width="1.4"/><rect x="18.00" y="200.18" width="32.70" height="13.00" rx="3" fill="#9A5B12" stroke="none" stroke-width="0"/><text x="23.00" y="209.78" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">EDICT</text><text x="19.00" y="227.04" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">The affected links cannot be used.</text><rect x="12.00" y="249.46" width="240.00" height="33.28" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 249.41) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="271.06" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">1</text><text x="46.00" y="264.46" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10.25" fill="#1F2A33" text-anchor="start">Relief convoy</text><text x="46.00" y="276.75" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">If you hold a Provisions commission, gain 3 gold.</text><rect x="12.00" y="288.75" width="240.00" height="44.57" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 288.69) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="310.35" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">3</text><text x="46.00" y="303.75" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10.25" fill="#1F2A33" text-anchor="start">Rebuild your own</text><text x="46.00" y="316.03" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">Your routes ignore the closure while this decree</text><text x="46.00" y="327.32" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">stands (put a token of yours on this card).</text><rect x="12.00" y="339.31" width="240.00" height="52.28" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 339.26) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="360.92" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">5</text><text x="46.00" y="354.31" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10.25" fill="#1F2A33" text-anchor="start">Restore the country</text><text x="46.00" y="366.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">The decree ends. Keep this card.</text><rect x="46.00" y="374.10" width="39.70" height="13.00" rx="3" fill="#9A5B12" stroke="none" stroke-width="0"/><text x="51.00" y="383.70" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8" fill="#FFFFFF" text-anchor="start">SHARED</text><circle cx="98.20" cy="380.10" r="7.00" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.3"/><text x="98.20" y="383.30" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="9" fill="#1F2A33" text-anchor="middle">g</text><text x="109.70" y="383.70" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="start">pay 2 gold</text><rect x="162.60" y="372.60" width="57.50" height="15.00" rx="7.5" fill="#F3E4B4" stroke="#D9AE45" stroke-width="1.5"/><text x="191.35" y="383.70" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="middle">+2 income</text><rect x="12.00" y="416.43" width="240.00" height="31.57" rx="5" fill="#E7EAE1" stroke="#6B7680" stroke-width="1" stroke-dasharray="3 2"/><text x="19.00" y="428.74" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="8.75" font-style="italic" fill="#4A5560" text-anchor="start">If it lapses: The damage is repaired: the decree ends with no</text><text x="19.00" y="439.53" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="8.75" font-style="italic" fill="#4A5560" text-anchor="start">further effect.</text></g><path d="M447.2,33.0 h8 V104.5 h-8" fill="none" stroke="#B23A2E" stroke-width="2"/><path d="M455.2,68.8 C477.2,68.8 479.2,66.8 503.2,66.8" fill="none" stroke="#B23A2E" stroke-width="1.5"/><circle cx="521.2" cy="66.75" r="12" fill="#B23A2E"/><text x="521.20" y="71.75" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text><text x="541.20" y="71.75" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="17" fill="#1F2A33" text-anchor="start">Issuer and treasury</text><text x="541.20" y="92.75" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">The ruler proclaiming the decree, with the state's colour. The treasury (rich, modest or poor) sets</text><text x="541.20" y="110.75" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">the gold price of shared petitions.</text><path d="M447.2,119.8 h8 V163.45425 h-8" fill="none" stroke="#B23A2E" stroke-width="2"/><path d="M455.2,141.6 C477.2,141.6 479.2,139.6 503.2,139.6" fill="none" stroke="#B23A2E" stroke-width="1.5"/><circle cx="521.2" cy="139.627125" r="12" fill="#B23A2E"/><text x="521.20" y="144.63" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">2</text><text x="541.20" y="144.63" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="17" fill="#1F2A33" text-anchor="start">Title and cause</text><text x="541.20" y="165.63" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">What happened in the world, and the map object it comes from: a war, a tariff, a zone, a marker or</text><text x="541.20" y="183.63" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">the slave trade.</text><path d="M447.2,171.00424999999998 h8 V225.896 h-8" fill="none" stroke="#B23A2E" stroke-width="2"/><path d="M455.2,198.5 C477.2,198.5 479.2,211.6 503.2,211.6" fill="none" stroke="#B23A2E" stroke-width="1.5"/><circle cx="521.2" cy="211.627125" r="12" fill="#B23A2E"/><text x="521.20" y="216.63" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">3</text><text x="541.20" y="216.63" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="17" fill="#1F2A33" text-anchor="start">Affected area</text><text x="541.20" y="237.63" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">A state, stops or links you can see on the board. A route is affected if it passes through them.</text><path d="M447.2,241.196 h8 V331.07125 h-8" fill="none" stroke="#B23A2E" stroke-width="2"/><path d="M455.2,286.1 C477.2,286.1 479.2,284.1 503.2,284.1" fill="none" stroke="#B23A2E" stroke-width="1.5"/><circle cx="521.2" cy="284.133625" r="12" fill="#B23A2E"/><text x="521.20" y="289.13" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">4</text><text x="541.20" y="289.13" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="17" fill="#1F2A33" text-anchor="start">On reveal</text><text x="541.20" y="310.13" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">Happens once, when the decree is drawn. Not every decree has one.</text><path d="M447.2,343.27125 h8 V398.163 h-8" fill="none" stroke="#B23A2E" stroke-width="2"/><path d="M455.2,370.7 C477.2,370.7 479.2,368.7 503.2,368.7" fill="none" stroke="#B23A2E" stroke-width="1.5"/><circle cx="521.2" cy="368.717125" r="12" fill="#B23A2E"/><text x="521.20" y="373.72" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">5</text><text x="541.20" y="373.72" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="17" fill="#1F2A33" text-anchor="start">Edict</text><text x="541.20" y="394.72" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">Applies every round while the decree is in the row. Gold in an edict is paid or gained when you settle</text><text x="541.20" y="412.72" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">accounts at the start of the round.</text><path d="M447.2,416.56300000000005 h8 V633.98 h-8" fill="none" stroke="#B23A2E" stroke-width="2"/><path d="M455.2,525.3 C477.2,525.3 479.2,523.3 503.2,523.3" fill="none" stroke="#B23A2E" stroke-width="1.5"/><circle cx="521.2" cy="523.2715000000001" r="12" fill="#B23A2E"/><text x="521.20" y="528.27" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">6</text><text x="541.20" y="528.27" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="17" fill="#1F2A33" text-anchor="start">Petitions</text><text x="541.20" y="549.27" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">Spend the stars you gained this turn, or lose them. One star: for you, this round. Three: for you,</text><text x="541.20" y="567.27" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">while the decree stands (leave a token on it). Five: the decree ends, and you keep the card. A</text><text x="541.20" y="585.27" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">SHARED petition helps every player, so it costs gold. A yellow chip moves your income track; a coin</text><text x="541.20" y="603.27" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">is gold, once.</text><path d="M447.2,678.4665 h8 V721.4 h-8" fill="none" stroke="#B23A2E" stroke-width="2"/><path d="M455.2,699.9 C477.2,699.9 479.2,697.9 503.2,697.9" fill="none" stroke="#B23A2E" stroke-width="1.5"/><circle cx="521.2" cy="697.93325" r="12" fill="#B23A2E"/><text x="521.20" y="702.93" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">7</text><text x="541.20" y="702.93" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="17" fill="#1F2A33" text-anchor="start">If it lapses</text><text x="541.20" y="723.93" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">A new decree arrives each round, five at most. When a sixth arrives, the oldest lapses and this line</text><text x="541.20" y="741.93" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="14" fill="#1F2A33" text-anchor="start">happens.</text></svg>