<svg xmlns="http://www.w3.org/2000/svg" width="264" height="456" viewBox="0 0 264 456"><title>Decree 13: The fair is proclaimed</title><rect x="1.00" y="1.00" width="262.00" height="454.00" rx="10" fill="#E7EAE1" stroke="#1F2A33" stroke-width="2"/><path d="M1,50 V11 A10,10 0 0 1 11,1 H253 A10,10 0 0 1 263,11 V50 Z" fill="#ffd92f"/><line x1="1" y1="50" x2="263" y2="50" stroke="#1F2A33" stroke-width="2"/><rect x="12.00" y="9.00" width="119.50" height="13.00" rx="3" fill="#8A6A12" stroke="none" stroke-width="0"/><text x="17.00" y="18.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">DECREE · COURT &amp; FESTIVAL</text><text x="213.00" y="19.50" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">Treasury: poor</text><circle cx="222" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><circle cx="234" cy="16" r="4.8" fill="#F6F7F3" stroke="#1F2A33" stroke-width="1.1"/><circle cx="246" cy="16" r="4.8" fill="#F6F7F3" stroke="#1F2A33" stroke-width="1.1"/><text x="12.00" y="41.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="16" fill="#1F2A33" text-anchor="start">The ruler of Taldung</text><text x="252.00" y="41.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">No. 13</text><text x="12.00" y="74.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="18.5" fill="#1F2A33" text-anchor="start">The fair is proclaimed</text><text x="12.00" y="88.92" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" font-style="italic" fill="#4A5560" text-anchor="start">Zizir Fair, near Khatho and Gluth.</text><rect x="12.00" y="98.92" width="240.00" height="35.42" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.4"/><rect x="18.00" y="92.92" width="78.30" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="23.00" y="102.52" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">AFFECTED STATE</text><text x="19.00" y="121.27" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11" fill="#1F2A33" text-anchor="start">Taldung: every stop in the state</text><rect x="12.00" y="146.34" width="240.00" height="48.84" rx="5" fill="#F6F7F3" stroke="#8A6A12" stroke-width="1.4"/><rect x="18.00" y="140.34" width="32.70" height="13.00" rx="3" fill="#8A6A12" stroke="none" stroke-width="0"/><text x="23.00" y="149.94" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">EDICT</text><text x="19.00" y="168.69" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">When you settle accounts, gain 1 gold for each</text><text x="19.00" y="182.11" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">of your Luxuries routes through Taldung.</text><rect x="12.00" y="205.18" width="240.00" height="35.42" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 205.13) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="226.78" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">1</text><text x="46.00" y="220.18" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#1F2A33" text-anchor="start">Sell at the fair</text><text x="46.00" y="234.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">Gain 2 gold.</text><rect x="12.00" y="246.60" width="240.00" height="75.68" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 246.55) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="268.20" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">3</text><text x="46.00" y="261.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#1F2A33" text-anchor="start">Supply the fair</text><text x="46.00" y="276.02" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">Your Luxuries routes through Taldung</text><text x="46.00" y="289.44" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">earn 2 gold each, not 1, while this decree</text><text x="46.00" y="302.86" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">stands (put a token of yours on this</text><text x="46.00" y="316.28" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">card).</text><rect x="12.00" y="328.28" width="240.00" height="54.42" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 328.23) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="349.88" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">5</text><text x="46.00" y="343.28" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#1F2A33" text-anchor="start">Patron of the fair</text><text x="46.00" y="357.70" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">The decree ends. Keep this card.</text><rect x="46.00" y="363.70" width="57.50" height="15.00" rx="7.5" fill="#F3E4B4" stroke="#D9AE45" stroke-width="1.5"/><text x="74.75" y="374.80" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="middle">+2 income</text><rect x="12.00" y="425.08" width="240.00" height="22.92" rx="5" fill="#E7EAE1" stroke="#6B7680" stroke-width="1" stroke-dasharray="3 2"/><text x="19.00" y="439.06" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" font-style="italic" fill="#4A5560" text-anchor="start">If it lapses: The fair ends: no effect.</text></svg>