fill="#4A5560" text-anchor="start">quarantine.</text><rect x="12.00" y="111.84" width="240.00" height="35.42" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.4"/><rect x="18.00" y="105.84" width="78.10" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="23.00" y="115.44" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">AFFECTED STOPS</text><text x="19.00" y="134.19" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11" fill="#1F2A33" text-anchor="start">Crowgbutumn, Knigh and Oxbreak</text><rect x="12.00" y="159.26" width="240.00" height="48.84" rx="5" fill="#F6F7F3" stroke="#9A5B12" stroke-width="1.4"/><rect x="18.00" y="153.26" width="32.70" height="13.00" rx="3" fill="#9A5B12" stroke="none" stroke-width="0"/><text x="23.00" y="162.86" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">EDICT</text><text x="19.00" y="181.61" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">No Provisions or Livestock route may pass</text><text x="19.00" y="195.03" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">through the affected area.</text><rect x="12.00" y="218.10" width="240.00" height="35.42" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 218.05) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="239.70" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">1</text><text x="46.00" y="233.10" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#1F2A33" text-anchor="start">Carry physicians</text><text x="46.00" y="247.52" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">Gain 2 gold.</text><rect x="12.00" y="259.52" width="240.00" height="62.26" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 259.47) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="281.12" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">3</text><text x="46.00" y="274.52" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#1F2A33" text-anchor="start">Clean papers</text><text x="46.00" y="288.94" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">Your routes ignore the quarantine while</text><text x="46.00" y="302.36" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">this decree stands (put a token of yours</text><text x="46.00" y="315.78" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">on this card).</text><rect x="12.00" y="327.78" width="240.00" height="54.42" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 327.73) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="349.38" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" 