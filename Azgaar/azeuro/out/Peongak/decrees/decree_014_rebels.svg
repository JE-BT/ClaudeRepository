<svg xmlns="http://www.w3.org/2000/svg" width="264" height="456" viewBox="0 0 264 456"><title>Decree 14: Hauls Rebels</title><rect x="1.00" y="1.00" width="262.00" height="454.00" rx="10" fill="#E7EAE1" stroke="#1F2A33" stroke-width="2"/><path d="M1,50 V11 A10,10 0 0 1 11,1 H253 A10,10 0 0 1 263,11 V50 Z" fill="#e6a983"/><line x1="1" y1="50" x2="263" y2="50" stroke="#1F2A33" stroke-width="2"/><rect x="12.00" y="9.00" width="84.70" height="13.00" rx="3" fill="#4F3A63" stroke="none" stroke-width="0"/><text x="17.00" y="18.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">DECREE · DISORDER</text><text x="213.00" y="19.50" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">Treasury: poor</text><circle cx="222" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><circle cx="234" cy="16" r="4.8" fill="#F6F7F3" stroke="#1F2A33" stroke-width="1.1"/><circle cx="246" cy="16" r="4.8" fill="#F6F7F3" stroke="#1F2A33" stroke-width="1.1"/><text x="12.00" y="41.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="16" fill="#1F2A33" text-anchor="start">The Council of Ladowia</text><text x="252.00" y="41.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">No. 14</text><text x="12.00" y="72.25" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="16.75" fill="#1F2A33" text-anchor="start">Hauls Rebels</text><text x="12.00" y="85.03" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="8.75" font-style="italic" fill="#4A5560" text-anchor="start">Hauls Rebels hold the roads of the affected area.</text><rect x="12.00" y="95.03" width="240.00" height="33.28" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.4"/><rect x="18.00" y="89.03" width="73.00" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="23.00" y="98.63" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">AFFECTED STOP</text><text x="19.00" y="115.90" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9.25" fill="#1F2A33" text-anchor="start">Dradow</text><rect x="12.00" y="140.32" width="240.00" height="44.57" rx="5" fill="#F6F7F3" stroke="#B23A2E" stroke-width="1.4"/><rect x="18.00" y="134.32" width="53.80" height="13.00" rx="3" fill="#B23A2E" stroke="none" stroke-width="0"/><text x="23.00" y="143.92" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">ON REVEAL</text><text x="19.00" y="161.18" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">Metals &amp; arms commissions routed through the affected</text><text x="19.00" y="172.47" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">area go to the bottom of their deck (not a breach).</text><rect x="12.00" y="194.89" width="240.00" height="44.57" rx="5" fill="#F6F7F3" stroke="#4F3A63" stroke-width="1.4"/><rect x="18.00" y="188.89" width="32.70" height="13.00" rx="3" fill="#4F3A63" stroke="none" stroke-width="0"/><text x="23.00" y="198.49" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">EDICT</text><text x="19.00" y="215.75" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">When you settle accounts, pay 1 gold for each of your</text><text x="19.00" y="227.04" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">routes through the affected area.</text><rect x="12.00" y="249.46" width="240.00" height="33.28" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 249.41) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="271.06" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">1</text><text x="46.00" y="264.46" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10.25" fill="#1F2A33" text-anchor="start">Pay them off</text><text x="46.00" y="276.75" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">Ignore this edict this round.</text><rect x="12.00" y="288.75" width="240.00" height="44.57" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 288.69) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="310.35" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">3</text><text x="46.00" y="303.75" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10.25" fill="#1F2A33" text-anchor="start">Hire guards</text><text x="46.00" y="316.03" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">Ignore this edict while this decree stands (put a</text><text x="46.00" y="327.32" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">token of yours on this card).</text><rect x="12.00" y="339.31" width="240.00" height="52.28" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 339.26) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="360.92" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">5</text><text x="46.00" y="354.31" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10.25" fill="#1F2A33" text-anchor="start">Put down the revolt</text><text x="46.00" y="366.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9.25" fill="#1F2A33" text-anchor="start">The decree ends. Keep this card.</text><rect x="46.00" y="374.10" width="39.70" height="13.00" rx="3" fill="#4F3A63" stroke="none" stroke-width="0"/><text x="51.00" y="383.70" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8" fill="#FFFFFF" text-anchor="start">SHARED</text><circle cx="98.20" cy="380.10" r="7.00" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.3"/><text x="98.20" y="383.30" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="9" fill="#1F2A33" text-anchor="middle">g</text><text x="109.70" y="383.70" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="start">pay 6 gold</text><rect x="162.40" y="372.60" width="57.50" height="15.00" rx="7.5" fill="#F3E4B4" stroke="#D9AE45" stroke-width="1.5"/><text x="191.15" y="383.70" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="middle">+2 income</text><rect x="12.00" y="405.64" width="240.00" height="42.36" rx="5" fill="#E7EAE1" stroke="#6B7680" stroke-width="1" stroke-dasharray="3 2"/><text x="19.00" y="417.96" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="8.75" font-style="italic" fill="#4A5560" text-anchor="start">If it lapses: The rebels take the roads: each player removes</text><text x="19.00" y="428.74" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="8.75" font-style="italic" fill="#4A5560" text-anchor="start">one land infrastructure from a station of theirs in the</text><text x="19.00" y="439.53" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="8.75" font-style="italic" fill="#4A5560" text-anchor="start">affected area.</text></svg>