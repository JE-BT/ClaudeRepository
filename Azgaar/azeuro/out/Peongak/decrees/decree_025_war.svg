<svg xmlns="http://www.w3.org/2000/svg" width="264" height="456" viewBox="0 0 264 456"><title>Decree 25: The Madas-Sushimimiusian War</title><rect x="1.00" y="1.00" width="262.00" height="454.00" rx="10" fill="#E7EAE1" stroke="#1F2A33" stroke-width="2"/><path d="M1,50 V11 A10,10 0 0 1 11,1 H253 A10,10 0 0 1 263,11 V50 Z" fill="#ff8b7f"/><line x1="1" y1="50" x2="263" y2="50" stroke="#1F2A33" stroke-width="2"/><rect x="12.00" y="9.00" width="64.50" height="13.00" rx="3" fill="#8E2F25" stroke="none" stroke-width="0"/><text x="17.00" y="18.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">DECREE · WAR</text><text x="213.00" y="19.50" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">Treasury: poor</text><circle cx="222" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><circle cx="234" cy="16" r="4.8" fill="#F6F7F3" stroke="#1F2A33" stroke-width="1.1"/><circle cx="246" cy="16" r="4.8" fill="#F6F7F3" stroke="#1F2A33" stroke-width="1.1"/><text x="12.00" y="41.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="16" fill="#1F2A33" text-anchor="start">The Grand Duke of Sushimimius</text><text x="252.00" y="41.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">No. 25</text><text x="12.00" y="73.50" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="18" fill="#1F2A33" text-anchor="start">The Madas-Sushimimiusian</text><text x="12.00" y="93.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="18" fill="#1F2A33" text-anchor="start">War</text><text x="12.00" y="107.31" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" font-style="italic" fill="#4A5560" text-anchor="start">Madas-Sushimimiusian War, begun 1034 PE:</text><text x="12.00" y="119.62" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" font-style="italic" fill="#4A5560" text-anchor="start">Sushimimius defends against Madas.</text><rect x="12.00" y="129.62" width="240.00" height="34.81" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.4"/><rect x="18.00" y="123.62" width="78.30" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="23.00" y="133.22" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">AFFECTED STATE</text><text x="19.00" y="151.55" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10.5" fill="#1F2A33" text-anchor="start">Sushimimius: every stop in the state</text><rect x="12.00" y="176.43" width="240.00" height="73.24" rx="5" fill="#F6F7F3" stroke="#8E2F25" stroke-width="1.4"/><rect x="18.00" y="170.43" width="32.70" height="13.00" rx="3" fill="#8E2F25" stroke="none" stroke-width="0"/><text x="23.00" y="180.03" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">EDICT</text><text x="19.00" y="198.36" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">When you settle accounts, pay 1 gold for each of</text><text x="19.00" y="211.17" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">your routes through Sushimimius, and gain 2 gold</text><text x="19.00" y="223.98" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">for each of your Metals &amp; arms routes through</text><text x="19.00" y="236.79" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">Sushimimius.</text><rect x="12.00" y="259.67" width="240.00" height="34.81" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 259.62) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="281.27" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">1</text><text x="46.00" y="274.67" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11.5" fill="#1F2A33" text-anchor="start">Safe-conduct</text><text x="46.00" y="288.48" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">Ignore this edict this round.</text><rect x="12.00" y="300.48" width="240.00" height="47.62" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 300.43) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="322.08" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">3</text><text x="46.00" y="315.48" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11.5" fill="#1F2A33" text-anchor="start">Army contractor</text><text x="46.00" y="329.29" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">Ignore the payment while this decree</text><text x="46.00" y="342.10" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">stands (put a token of yours on this card).</text><rect x="12.00" y="354.10" width="240.00" height="53.81" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 354.05) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="375.70" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">5</text><text x="46.00" y="369.10" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11.5" fill="#1F2A33" text-anchor="start">Broker the peace</text><text x="46.00" y="382.91" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">The decree ends. Keep this card.</text><rect x="46.00" y="390.41" width="39.70" height="13.00" rx="3" fill="#8E2F25" stroke="none" stroke-width="0"/><text x="51.00" y="400.01" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8" fill="#FFFFFF" text-anchor="start">SHARED</text><circle cx="98.20" cy="396.41" r="7.00" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.3"/><text x="98.20" y="399.61" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="9" fill="#1F2A33" text-anchor="middle">g</text><text x="109.70" y="400.01" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="start">pay 6 gold</text><rect x="162.40" y="388.91" width="57.30" height="15.00" rx="7.5" fill="#F3E4B4" stroke="#D9AE45" stroke-width="1.5"/><text x="191.05" y="400.01" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="middle">+3 income</text><rect x="12.00" y="415.91" width="240.00" height="34.62" rx="5" fill="#E7EAE1" stroke="#6B7680" stroke-width="1" stroke-dasharray="3 2"/><text x="19.00" y="429.41" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" font-style="italic" fill="#4A5560" text-anchor="start">If it lapses: The war drags on: each player pays 1 gold</text><text x="19.00" y="441.72" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" font-style="italic" fill="#4A5560" text-anchor="start">for each of their routes through Sushimimius.</text></svg>