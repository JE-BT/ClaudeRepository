<svg xmlns="http://www.w3.org/2000/svg" width="264" height="456" viewBox="0 0 264 456"><title>Decree 23: The Mornhe-Thornterian War</title><rect x="1.00" y="1.00" width="262.00" height="454.00" rx="10" fill="#E7EAE1" stroke="#1F2A33" stroke-width="2"/><path d="M1,50 V11 A10,10 0 0 1 11,1 H253 A10,10 0 0 1 263,11 V50 Z" fill="#eef746"/><line x1="1" y1="50" x2="263" y2="50" stroke="#1F2A33" stroke-width="2"/><rect x="12.00" y="9.00" width="64.50" height="13.00" rx="3" fill="#8E2F25" stroke="none" stroke-width="0"/><text x="17.00" y="18.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">DECREE · WAR</text><text x="213.00" y="19.50" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">Treasury: rich</text><circle cx="222" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><circle cx="234" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><circle cx="246" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><text x="12.00" y="41.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="16" fill="#1F2A33" text-anchor="start">The King of Thornter</text><text x="252.00" y="41.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">No. 23</text><text x="12.00" y="73.75" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="18.25" fill="#1F2A33" text-anchor="start">The Mornhe-Thornterian War</text><text x="12.00" y="88.36" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.25" font-style="italic" fill="#4A5560" text-anchor="start">Mornhe-Thornterian War, begun 1035 PE: Thornter</text><text x="12.00" y="100.98" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.25" font-style="italic" fill="#4A5560" text-anchor="start">defends against Mornhe.</text><rect x="12.00" y="110.98" width="240.00" height="35.12" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.4"/><rect x="18.00" y="104.98" width="78.30" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="23.00" y="114.58" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">AFFECTED STATE</text><text x="19.00" y="133.12" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10.75" fill="#1F2A33" text-anchor="start">Thornter: every stop in the state</text><rect x="12.00" y="158.09" width="240.00" height="74.46" rx="5" fill="#F6F7F3" stroke="#8E2F25" stroke-width="1.4"/><rect x="18.00" y="152.09" width="32.70" height="13.00" rx="3" fill="#8E2F25" stroke="none" stroke-width="0"/><text x="23.00" y="161.69" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">EDICT</text><text x="19.00" y="180.23" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.75" fill="#1F2A33" text-anchor="start">When you settle accounts, pay 1 gold for each of</text><text x="19.00" y="193.35" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.75" fill="#1F2A33" text-anchor="start">your routes through Thornter, and gain 2 gold</text><text x="19.00" y="206.46" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.75" fill="#1F2A33" text-anchor="start">for each of your Metals &amp; arms routes through</text><text x="19.00" y="219.58" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.75" fill="#1F2A33" text-anchor="start">Thornter.</text><rect x="12.00" y="242.56" width="240.00" height="35.12" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 242.50) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="264.16" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">1</text><text x="46.00" y="257.56" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11.75" fill="#1F2A33" text-anchor="start">Safe-conduct</text><text x="46.00" y="271.67" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.75" fill="#1F2A33" text-anchor="start">Ignore this edict this round.</text><rect x="12.00" y="283.67" width="240.00" height="48.23" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 283.62) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="305.27" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">3</text><text x="46.00" y="298.67" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11.75" fill="#1F2A33" text-anchor="start">Army contractor</text><text x="46.00" y="312.79" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.75" fill="#1F2A33" text-anchor="start">Ignore the payment while this decree</text><text x="46.00" y="325.90" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.75" fill="#1F2A33" text-anchor="start">stands (put a token of yours on this card).</text><rect x="12.00" y="337.90" width="240.00" height="54.12" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 337.85) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="359.50" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">5</text><text x="46.00" y="352.90" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11.75" fill="#1F2A33" text-anchor="start">Broker the peace</text><text x="46.00" y="367.02" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.75" fill="#1F2A33" text-anchor="start">The decree ends. Keep this card.</text><rect x="46.00" y="374.52" width="39.70" height="13.00" rx="3" fill="#8E2F25" stroke="none" stroke-width="0"/><text x="51.00" y="384.12" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8" fill="#FFFFFF" text-anchor="start">SHARED</text><circle cx="98.20" cy="380.52" r="7.00" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.3"/><text x="98.20" y="383.72" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="9" fill="#1F2A33" text-anchor="middle">g</text><text x="109.70" y="384.12" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="start">pay 2 gold</text><rect x="162.60" y="373.02" width="57.30" height="15.00" rx="7.5" fill="#F3E4B4" stroke="#D9AE45" stroke-width="1.5"/><text x="191.25" y="384.12" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="middle">+3 income</text><rect x="12.00" y="412.77" width="240.00" height="35.23" rx="5" fill="#E7EAE1" stroke="#6B7680" stroke-width="1" stroke-dasharray="3 2"/><text x="19.00" y="426.51" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.25" font-style="italic" fill="#4A5560" text-anchor="start">If it lapses: The war drags on: each player pays 1</text><text x="19.00" y="439.12" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.25" font-style="italic" fill="#4A5560" text-anchor="start">gold for each of their routes through Thornter.</text></svg>