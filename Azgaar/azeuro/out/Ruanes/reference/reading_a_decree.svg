<svg xmlns="http://www.w3.org/2000/svg" width="264" height="456" viewBox="0 0 264 456"><title>Reference: reading a decree</title><rect x="1.00" y="1.00" width="262.00" height="454.00" rx="10" fill="#E7EAE1" stroke="#1F2A33" stroke-width="2"/><path d="M1,44 V11 A10,10 0 0 1 11,1 H253 A10,10 0 0 1 263,11 V44 Z" fill="#1F2A33"/><line x1="1" y1="44" x2="263" y2="44" stroke="#1F2A33" stroke-width="2"/><text x="14.00" y="29.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="21" fill="#E7EAE1" text-anchor="start">Reading a decree</text><rect x="14.00" y="52.00" width="37.90" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="19.00" y="61.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#E7EAE1" text-anchor="start">ISSUER</text><text x="14.00" y="77.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">The ruler and the state's treasury. A shared petition</text><text x="14.00" y="90.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">costs rich 2, modest 4, poor 6 gold at five stars.</text><rect x="14.00" y="102.00" width="50.80" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="19.00" y="111.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#E7EAE1" text-anchor="start">AFFECTED</text><text x="14.00" y="127.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">A state, stops or links on the board. A route is</text><text x="14.00" y="140.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">affected if it passes through them.</text><rect x="14.00" y="152.00" width="85.30" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="19.00" y="161.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#E7EAE1" text-anchor="start">ON REVEAL  ·  EDICT</text><text x="14.00" y="177.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">On reveal: once, when drawn. Edict: every round</text><text x="14.00" y="190.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">while the decree is in the row.</text><rect x="14.00" y="202.00" width="50.60" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="19.00" y="211.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#E7EAE1" text-anchor="start">PETITIONS</text><text x="14.00" y="227.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">Spend stars gained this turn or lose them. 1: you,</text><text x="14.00" y="240.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">this round. 3: you, while it stands. 5: it ends, and you</text><text x="14.00" y="253.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">keep the card.</text><rect x="14.00" y="265.00" width="35.80" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="19.00" y="274.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#E7EAE1" text-anchor="start">LAPSE</text><text x="14.00" y="290.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">A new decree each round, five at most. A sixth</text><text x="14.00" y="303.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">pushes out the oldest, which lapses.</text><line x1="14" y1="321" x2="250" y2="321" stroke="#6B7680" stroke-width="1"/><text x="14.00" y="337.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="15" fill="#1F2A33" text-anchor="start">Money marks</text><circle cx="22.00" cy="354.00" r="7.50" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.3"/><text x="22.00" y="357.20" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="9" fill="#1F2A33" text-anchor="middle">g</text><text x="34.00" y="357.78" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10.5" fill="#1F2A33" text-anchor="start">pay 2 gold</text><text x="112.00" y="358.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">gold, once</text><rect x="14.00" y="366.00" width="59.40" height="16.00" rx="8.0" fill="#F3E4B4" stroke="#D9AE45" stroke-width="1.5"/><text x="43.70" y="377.78" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10.5" fill="#1F2A33" text-anchor="middle">+2 income</text><text x="112.00" y="378.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">the income track</text><rect x="14.00" y="386.00" width="64.60" height="16.00" rx="8.0" fill="#F2D2CB" stroke="#D98C80" stroke-width="1.5"/><text x="46.30" y="397.78" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10.5" fill="#1F2A33" text-anchor="middle">+3 expense</text><text x="112.00" y="398.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" fill="#1F2A33" text-anchor="start">the expense track</text><text x="14.00" y="416.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" font-style="italic" fill="#4A5560" text-anchor="start">A petition costs gold only when its benefit is shared by</text><text x="14.00" y="428.50" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" font-style="italic" fill="#4A5560" text-anchor="start">every player. Edict gold is paid or gained when you</text><text x="14.00" y="441.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10" font-style="italic" fill="#4A5560" text-anchor="start">settle accounts.</text></svg>