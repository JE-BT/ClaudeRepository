<svg xmlns="http://www.w3.org/2000/svg" width="264" height="456" viewBox="0 0 264 456"><title>Decree 12: The Kilkleighia league against slavers</title><rect x="1.00" y="1.00" width="262.00" height="454.00" rx="10" fill="#E7EAE1" stroke="#1F2A33" stroke-width="2"/><path d="M1,50 V11 A10,10 0 0 1 11,1 H253 A10,10 0 0 1 263,11 V50 Z" fill="#e48cd8"/><line x1="1" y1="50" x2="263" y2="50" stroke="#1F2A33" stroke-width="2"/><rect x="12.00" y="9.00" width="64.20" height="13.00" rx="3" fill="#3C4650" stroke="none" stroke-width="0"/><text x="17.00" y="18.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">DECREE · LAW</text><text x="213.00" y="19.50" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">Treasury: modest</text><circle cx="222" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><circle cx="234" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><circle cx="246" cy="16" r="4.8" fill="#F6F7F3" stroke="#1F2A33" stroke-width="1.1"/><text x="12.00" y="41.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="16" fill="#1F2A33" text-anchor="start">The King of Kilkleighia</text><text x="252.00" y="41.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">No. 12</text><text x="12.00" y="72.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="16.5" fill="#1F2A33" text-anchor="start">The Kilkleighia league against</text><text x="12.00" y="90.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="16.5" fill="#1F2A33" text-anchor="start">slavers</text><text x="12.00" y="102.48" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="8.5" font-style="italic" fill="#4A5560" text-anchor="start">Kilkleighia trades no slaves and presses its allies to close their</text><text x="12.00" y="112.96" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="8.5" font-style="italic" fill="#4A5560" text-anchor="start">roads to slavers.</text><rect x="12.00" y="122.96" width="240.00" height="32.98" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.4"/><rect x="18.00" y="116.96" width="83.40" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="23.00" y="126.56" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">AFFECTED STATES</text><text x="19.00" y="143.61" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="start">Kilkleighia, Syhamar and Nash: every stop in these states</text><rect x="12.00" y="167.94" width="240.00" height="54.94" rx="5" fill="#F6F7F3" stroke="#3C4650" stroke-width="1.4"/><rect x="18.00" y="161.94" width="32.70" height="13.00" rx="3" fill="#3C4650" stroke="none" stroke-width="0"/><text x="23.00" y="171.54" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">EDICT</text><text x="19.00" y="188.59" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9" fill="#1F2A33" text-anchor="start">When you settle accounts, discard each Slaves</text><text x="19.00" y="199.57" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9" fill="#1F2A33" text-anchor="start">commission whose route passes through the affected</text><text x="19.00" y="210.55" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9" fill="#1F2A33" text-anchor="start">area. This is a breach.</text><rect x="12.00" y="232.88" width="240.00" height="32.98" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 232.83) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="254.48" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">1</text><text x="46.00" y="247.88" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="start">Look away</text><text x="46.00" y="259.86" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9" fill="#1F2A33" text-anchor="start">One of your Slaves routes is spared this round.</text><rect x="12.00" y="271.86" width="240.00" height="43.96" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 271.81) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="293.46" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">3</text><text x="46.00" y="286.86" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="start">Manumission</text><text x="46.00" y="298.84" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9" fill="#1F2A33" text-anchor="start">Discard one of your Slaves commissions and gain</text><text x="46.00" y="309.82" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9" fill="#1F2A33" text-anchor="start">gold equal to its income. This is not a breach.</text><rect x="12.00" y="321.82" width="240.00" height="84.92" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 321.77) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="343.42" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">5</text><text x="46.00" y="336.82" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="start">Oath of abolition</text><text x="46.00" y="348.80" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9" fill="#1F2A33" text-anchor="start">Close your Slaves trade for good and open</text><text x="46.00" y="359.78" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9" fill="#1F2A33" text-anchor="start">another trade with no overhead. The league</text><text x="46.00" y="370.76" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9" fill="#1F2A33" text-anchor="start">becomes law: keep this card face up; its edict</text><text x="46.00" y="381.74" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="9" fill="#1F2A33" text-anchor="start">lasts the rest of the game.</text><rect x="46.00" y="387.74" width="55.40" height="15.00" rx="7.5" fill="#F3E4B4" stroke="#D9AE45" stroke-width="1.5"/><text x="73.70" y="398.84" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="middle">+1 income</text><rect x="12.00" y="427.52" width="240.00" height="20.48" rx="5" fill="#E7EAE1" stroke="#6B7680" stroke-width="1" stroke-dasharray="3 2"/><text x="19.00" y="439.59" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="8.5" font-style="italic" fill="#4A5560" text-anchor="start">If it lapses: The league breaks up: no effect.</text></svg>