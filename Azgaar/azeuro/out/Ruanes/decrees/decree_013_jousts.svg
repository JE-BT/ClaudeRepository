<svg xmlns="http://www.w3.org/2000/svg" width="264" height="456" viewBox="0 0 264 456"><title>Decree 13: The joust is proclaimed</title><rect x="1.00" y="1.00" width="262.00" height="454.00" rx="10" fill="#E7EAE1" stroke="#1F2A33" stroke-width="2"/><path d="M1,50 V11 A10,10 0 0 1 11,1 H253 A10,10 0 0 1 263,11 V50 Z" fill="#a6d854"/><line x1="1" y1="50" x2="263" y2="50" stroke="#1F2A33" stroke-width="2"/><rect x="12.00" y="9.00" width="119.50" height="13.00" rx="3" fill="#8A6A12" stroke="none" stroke-width="0"/><text x="17.00" y="18.60" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">DECREE · COURT &amp; FESTIVAL</text><text x="213.00" y="19.50" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">Treasury: poor</text><circle cx="222" cy="16" r="4.8" fill="#D3A23A" stroke="#1F2A33" stroke-width="1.1"/><circle cx="234" cy="16" r="4.8" fill="#F6F7F3" stroke="#1F2A33" stroke-width="1.1"/><circle cx="246" cy="16" r="4.8" fill="#F6F7F3" stroke="#1F2A33" stroke-width="1.1"/><text x="12.00" y="41.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="16" fill="#1F2A33" text-anchor="start">The Bishop of Nelahlidia</text><text x="252.00" y="41.00" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#1F2A33" text-anchor="end">No. 13</text><text x="12.00" y="74.00" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="18.5" fill="#1F2A33" text-anchor="start">The joust is proclaimed</text><text x="12.00" y="88.92" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" font-style="italic" fill="#4A5560" text-anchor="start">Joust: Hoyavikka Melee, near Grenekurvo and</text><text x="12.00" y="101.84" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" font-style="italic" fill="#4A5560" text-anchor="start">Hoyavikka.</text><rect x="12.00" y="111.84" width="240.00" height="35.42" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.4"/><rect x="18.00" y="105.84" width="78.30" height="13.00" rx="3" fill="#1F2A33" stroke="none" stroke-width="0"/><text x="23.00" y="115.44" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">AFFECTED STATE</text><text x="19.00" y="134.19" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11" fill="#1F2A33" text-anchor="start">Nelahlidia: every stop in the state</text><rect x="12.00" y="159.26" width="240.00" height="48.84" rx="5" fill="#F6F7F3" stroke="#8A6A12" stroke-width="1.4"/><rect x="18.00" y="153.26" width="32.70" height="13.00" rx="3" fill="#8A6A12" stroke="none" stroke-width="0"/><text x="23.00" y="162.86" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="start">EDICT</text><text x="19.00" y="181.61" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">When you settle accounts, gain 1 gold for each</text><text x="19.00" y="195.03" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">of your Livestock routes through Nelahlidia.</text><rect x="12.00" y="218.10" width="240.00" height="35.42" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 218.05) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="239.70" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">1</text><text x="46.00" y="233.10" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#1F2A33" text-anchor="start">Sell at the joust</text><text x="46.00" y="247.52" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">Gain 2 gold.</text><rect x="12.00" y="259.52" width="240.00" height="75.68" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 259.47) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="281.12" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">3</text><text x="46.00" y="274.52" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#1F2A33" text-anchor="start">Supply the joust</text><text x="46.00" y="288.94" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">Your Livestock routes through</text><text x="46.00" y="302.36" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">Nelahlidia earn 2 gold each, not 1, while</text><text x="46.00" y="315.78" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">this decree stands (put a token of yours</text><text x="46.00" y="329.20" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">on this card).</text><rect x="12.00" y="341.20" width="240.00" height="54.42" rx="5" fill="#FFFFFF" stroke="#1F2A33" stroke-width="1.2"/><polygon transform="translate(10.95 341.15) scale(1.4211)" points="12,2.5 14.9,8.9 21.8,9.3 16.4,13.7 18.2,20.5 12,16.8 5.8,20.5 7.6,13.7 2.2,9.3 9.1,8.9" fill="#D3A23A" stroke="#1F2A33" stroke-width="0.91" stroke-linejoin="round"/><text x="28.00" y="362.80" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" fill="#1F2A33" text-anchor="middle">5</text><text x="46.00" y="356.20" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#1F2A33" text-anchor="start">Patron of the joust</text><text x="46.00" y="370.62" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="11" fill="#1F2A33" text-anchor="start">The decree ends. Keep this card.</text><rect x="46.00" y="376.62" width="57.50" height="15.00" rx="7.5" fill="#F3E4B4" stroke="#D9AE45" stroke-width="1.5"/><text x="74.75" y="387.72" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#1F2A33" text-anchor="middle">+2 income</text><rect x="12.00" y="425.08" width="240.00" height="22.92" rx="5" fill="#E7EAE1" stroke="#6B7680" stroke-width="1" stroke-dasharray="3 2"/><text x="19.00" y="439.06" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="10.5" font-style="italic" fill="#4A5560" text-anchor="start">If it lapses: The joust ends: no effect.</text></svg>