// ---------------------------------------------------------------------------------------------
// Navigation, weather and prices.
//   Water is navigable; a river is navigable when its discharge (data) is large enough for the
//   vessel: boats from 40 m³/s, ships from 400 m³/s (mixed rule). Each port gets a harbour: the
//   nearest navigable tile within a few tiles of the town, reached overland. Courses run only on
//   navigable tiles, following the plan's track where it is on water and joining the gaps by
//   search, so no vessel crosses land.
//   Weather is rolled per day and per region from the map's precipitation, the season and the
//   latitude. Prices come from the town's market (cheapest food, sales tax of the state).
// ---------------------------------------------------------------------------------------------
AZ.NAV = { boat: 40, ship: 400 };
AZ.vesselClass = kind => (/ship|steam|modern/i.test(kind || "") ? "ship" : "boat");

Object.assign(AZ.World.prototype, {
  navigable(c, r, cls = "boat") {
    if (!this.inb(c, r)) return false;
    if (!this.isLand(c, r)) return true;
    if (!(this.R.cwater[r * this.cols + c] >> 4)) return false;
    const rv = this.river(c, r);
    return (rv?.discharge || 0) >= AZ.NAV[cls];
  },
  harbour(b, cls = "boat") {
    this._harb = this._harb || new Map();
    const key = `${b.i}:${cls}`;
    if (this._harb.has(key)) return this._harb.get(key);
    let found = null;
    const seen = new Set([this.idx(b.t[0], b.t[1])]), q = [[b.t[0], b.t[1], 0]];
    while (q.length && !found) {
      const [c, r, d] = q.shift();
      for (const [dc, dr] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
        const a = c + dc, e = r + dr, k = this.idx(a, e);
        if (!this.inb(a, e) || seen.has(k)) continue;
        seen.add(k);
        if (this.navigable(a, e, cls)) { found = { t: [a, e], walk: d + 1 }; break; }
        if (d < 3 && this.isLand(a, e)) q.push([a, e, d + 1]); // a harbour is within a short walk of the town, never a distant coast
      }
    }
    this._harb.set(key, found);
    return found;
  },
  // A* on the tile grid; ok(c, r) says whether a tile may be entered; cost(c, r) >= 1
  path(from, to, ok, opts = {}) {
    const N = this.cols * this.rows, cols = this.cols;
    if (!this._astar || this._astar.g.length !== N) this._astar = { g: new Float32Array(N), from: new Int32Array(N), stamp: new Uint32Array(N), gen: 0 };
    const A = this._astar; A.gen++;
    const start = this.idx(from[0], from[1]), goal = this.idx(to[0], to[1]);
    const limit = opts.limit || 400000, cost = opts.cost || (() => 1);
    const heap = [], push = (f, i) => { heap.push([f, i]); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };
    const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m; } } return top; };
    const h = i => Math.abs((i % cols) - to[0]) + Math.abs(Math.floor(i / cols) - to[1]);
    A.stamp[start] = A.gen; A.g[start] = 0; A.from[start] = -1; push(h(start), start);
    let n = 0;
    while (heap.length && n++ < limit) {
      const [, i] = pop();
      if (i === goal) {
        const out = []; for (let k = i; k !== -1; k = A.from[k]) out.push([k % cols, Math.floor(k / cols)]);
        return out.reverse();
      }
      const c = i % cols, r = Math.floor(i / cols), gi = A.g[i];
      for (const [dc, dr] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
        const a = c + dc, e = r + dr;
        if (a < 0 || e < 0 || a >= cols || e >= this.rows) continue;
        const j = e * cols + a;
        if (j !== goal && !ok(a, e)) continue;
        const ng = gi + cost(a, e);
        if (A.stamp[j] === A.gen && A.g[j] <= ng) continue;
        A.stamp[j] = A.gen; A.g[j] = ng; A.from[j] = i;
        push(ng + h(j) * (opts.greed || 1), j);
      }
    }
    return null;
  },
  // are two tiles on the same connected body of navigable water? (components labelled once per class)
  sameWater(a, b, cls = "boat") {
    if (!a || !b) return false;
    this._comp = this._comp || {};
    let lab = this._comp[cls];
    if (!lab) {
      const N = this.cols * this.rows, cols = this.cols;
      lab = this._comp[cls] = new Int32Array(N);
      let next = 0;
      const q = new Int32Array(N);
      for (let i = 0; i < N; i++) {
        if (lab[i] || !this.navigable(i % cols, (i / cols) | 0, cls)) continue;
        next++; let h = 0, t = 0; q[t++] = i; lab[i] = next;
        while (h < t) {
          const j = q[h++], c = j % cols, r = (j / cols) | 0;
          for (const [dc, dr] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
            const a2 = c + dc, b2 = r + dr;
            if (a2 < 0 || b2 < 0 || a2 >= cols || b2 >= this.rows) continue;
            const k = b2 * cols + a2;
            if (!lab[k] && this.navigable(a2, b2, cls)) { lab[k] = next; q[t++] = k; }
          }
        }
      }
    }
    const la = lab[this.idx(a[0], a[1])], lb = lab[this.idx(b[0], b[1])];
    return la > 0 && la === lb;
  },
  waterPath(from, to, cls) { return this.withMiles(this.path(from, to, (c, r) => this.navigable(c, r, cls), { limit: 600000, greed: 1.2 })); },
  // a 4-connected path zigzags on diagonals; its true length is the chord length sampled along it
  withMiles(p) {
    if (!p || p.length < 2) return p;
    let L = 0;
    for (let i = 0; i < p.length - 1; i += 8) { const j = Math.min(p.length - 1, i + 8); L += Math.hypot(p[j][0] - p[i][0], p[j][1] - p[i][1]); }
    p.mps = Math.max(0.7, L / (p.length - 1)) * this.miles;
    return p;
  },
});

// The plan's courses, moved onto navigable tiles and run harbour to harbour
AZ.Journey.prototype.fixCourses = function () {
  const w = this.w;
  this.course = new Set();
  for (const seg of this.segs) {
    if (!seg.moving) continue;
    const cls = AZ.vesselClass(seg.transport);
    seg.cls = cls;
    const fromB = w.P.burgs[w.C.burg[seg.from]], toB = seg.place.at ? seg.place.burg : null;
    const fromH = fromB && fromB.port ? w.harbour(fromB, cls) : null, toH = toB && toB.port ? w.harbour(toB, cls) : null;
    seg.fromHarbour = fromH ? fromH.t : null; seg.toHarbour = toH ? toH.t : null;
    const raw = seg.chain;
    const anchors = raw.filter(([c, r]) => w.navigable(c, r, cls));
    if (fromH) anchors.unshift(fromH.t);
    if (toH) anchors.push(toH.t);
    const out = [];
    for (let k = 0; k < anchors.length; k++) {
      const t = anchors[k], last = out[out.length - 1];
      if (!last) { out.push(t); continue; }
      if (last[0] === t[0] && last[1] === t[1]) continue;
      if (Math.abs(last[0] - t[0]) + Math.abs(last[1] - t[1]) === 1) { out.push(t); continue; }
      const p = w.path(last, t, (c, r) => w.navigable(c, r, cls), { limit: 60000 });
      if (p) out.push(...p.slice(1));
    }
    // loop erasure: where the plan's track doubles back over its own water, cut the loop out
    const pos = new Map(), clean = [];
    for (const t of out) {
      const k = w.idx(t[0], t[1]);
      if (pos.has(k)) { for (const u of clean.splice(pos.get(k) + 1)) pos.delete(w.idx(u[0], u[1])); }
      else { pos.set(k, clean.length); clean.push(t); }
    }
    seg.chain = clean.length ? clean : raw;
    seg.chainPos = new Map(seg.chain.map(([c, r], i) => [w.idx(c, r), i]));
    seg.endTile = seg.toHarbour || seg.chain[seg.chain.length - 1];
    seg.chain.forEach(([c, r]) => this.course.add(w.idx(c, r)));
  }
  // checkpoints: the stops, in order, each with its par times and the stays that make it up
  this.cps = [];
  const at = (seg) => (seg.place.burg && seg.place.at ? `b${seg.place.burg.i}` : `t${seg.place.tile.join(",")}`);
  const first = { place: this.origin, key: `b${this.origin.burg?.i}`, stays: [], legIn: null };
  this.cps.push(first);
  for (const seg of this.segs) {
    let cp = this.cps[this.cps.length - 1];
    if (seg.moving) {
      cp.legOut = seg;
      const next = { place: seg.place, key: at(seg), stays: [], legIn: seg, parArrive: seg.planEnd };
      this.cps.push(next);
    } else cp.stays.push(seg);
  }
  this.cps.forEach((cp, i) => {
    cp.i = i;
    if (cp.parArrive == null) cp.parArrive = this.t0;
    cp.parLeave = cp.legOut ? cp.legOut.planStart : cp.stays.length ? cp.stays[cp.stays.length - 1].planEnd : cp.parArrive;
    cp.tile = cp.place.burg && cp.place.at ? cp.place.burg.t : cp.place.tile;
    cp.acts = cp.stays.flatMap(st => AZ.stayActs(st, cp));
  });
  // the plan's own nights at anchor on legs that sail less than a full day (par, mixed)
  for (const seg of this.segs) {
    if (!seg.moving || seg.hoursPerDay >= 24) { if (seg.moving) seg.nights = []; continue; }
    seg.nights = [];
    const lat = w.latlon(...seg.startTile)[0];
    let t = seg.planStart, sailed = 0;
    for (let guard = 0; guard < 400 && sailed < seg.travelHours - 1e-6; guard++) {
      const sun = AZ.Clock.sun(t, lat), dawn = sun.day * 24 + Math.max(0, sun.rise);
      if (t < dawn) t = dawn;
      const use = Math.min(dawn + seg.hoursPerDay - t, seg.travelHours - sailed);
      if (use <= 0) { t = (sun.day + 1) * 24 + Math.max(0, AZ.Clock.sun((sun.day + 1) * 24, lat).rise); continue; }
      t += use; sailed += use;
      if (sailed < seg.travelHours - 1e-6) {
        const k = Math.round((sailed / seg.travelHours) * (seg.chain.length - 1));
        seg.nights.push({ t, tile: seg.chain[k], frac: sailed / seg.travelHours });
      }
    }
  }
};

// activities that make up a stay; the plan's hours are par, the player does the work
AZ.stayActs = function (st, cp) {
  const n = st.name, acts = [];
  if (/book|passage|hire/i.test(n)) acts.push({ id: "book", label: "Book passage or hire a boat at the harbour", stay: st.k });
  if (/alms/i.test(n)) acts.push({ id: "alms", label: "Give alms at the temple", stay: st.k });
  if (/rest|shelter|inn|lodg/i.test(n)) acts.push({ id: "rest", label: `Rest a night${/ at (.+)$/i.test(n) ? " at " + n.match(/ at (.+)$/i)[1] : " ashore"}`, stay: st.k });
  if (/anchor|stopp|night/i.test(n)) acts.push({ id: "anchor", label: `Spend the night at anchor ${cp.place.name}`, stay: st.k });
  if (!acts.length) acts.push({ id: "wait", label: n, stay: st.k });
  return acts;
};

// ------------------------------------------------------------------ weather
AZ.Weather = {
  KINDS: { clear: { label: "clear", walk: 1, sail: 1 }, cloudy: { label: "overcast", walk: 1, sail: 1 }, rain: { label: "rain", walk: 1.15, sail: 1.05 },
           snow: { label: "snow", walk: 1.4, sail: 1.15 }, fog: { label: "fog", walk: 1.1, sail: 1.3 }, storm: { label: "storm", walk: 1.5, sail: 2.2 } },
  at(w, c, r, t) {
    const day = Math.floor(t / 24), half = Math.floor((t % 24) / 12);
    const rx = c >> 5, ry = r >> 5, seed = AZ.U.strSeed(String(w.P.world.seed));
    const roll = AZ.U.rnd2(rx * 7919 + day * 3, ry * 104729 + half, seed);
    const roll2 = AZ.U.rnd2(rx + day * 31, ry + half * 17, seed ^ 0x5bd1e995);
    const lat = w.latlon(c, r)[0], season = AZ.Clock.season(lat, t), sea = !w.isLand(c, r);
    const prec = w.precMM(c, r);
    let pRain = AZ.U.clamp(prec / 2600, 0.06, 0.8);
    if (season === "winter") pRain *= 1.25; else if (season === "summer") pRain *= 0.8;
    else if (season === "wet season") pRain *= 1.5; else if (season === "dry season") pRain *= 0.4;
    let pStorm = sea ? 0.02 + (Math.abs(lat) > 30 && season === "winter" ? 0.06 : 0) + (Math.abs(lat) > 45 ? 0.03 : 0) + (season === "wet season" ? 0.04 : 0) : pRain * 0.08;
    const today = AZ.Clock.today(w.tempC(c, r), lat, t, sea);
    let kind = "clear";
    if (roll < pStorm) kind = "storm";
    else if (roll < pStorm + pRain) kind = today < 0 ? "snow" : "rain";
    else if (roll2 < (sea && today < 8 ? 0.08 : 0.03)) kind = "fog";
    else if (roll2 < 0.4) kind = "cloudy";
    return { kind, ...this.KINDS[kind], key: `${day}:${half}:${rx}:${ry}` };
  },
};

// ------------------------------------------------------------------ prices (🟡, Azgaar's money)
AZ.Prices = {
  tax(w, b) { const s = b && w.P.states[b.state]; return s ? +s.salesTax || 0 : 0; },
  market(w, b) { return b ? w.P.markets.find(m => m.i === b.market) : null; },
  food(w, b) { // cheapest food good on the town's market, with the state's sales tax
    const mk = this.market(w, b);
    let best = 1;
    if (mk) {
      const prices = w.P.goods.filter(g => (g.tags || []).includes("food") && mk.goods[g.i]).map(g => mk.goods[g.i][1]).filter(p => p > 0);
      if (prices.length) best = Math.min(...prices);
    }
    return best * (1 + this.tax(w, b));
  },
  ration(w, b) { return AZ.U.rn(Math.max(0.05, this.food(w, b) * 0.1), 2); },        // one person, one day
  water(w, b) { return AZ.U.rn(0.02 * (1 + this.tax(w, b)), 2); },                    // one cask-day
  inn(w, b) { return AZ.U.rn(0.3 * (1 + this.tax(w, b)) + this.ration(w, b) * 2, 1); },
  alms(w, b) { return AZ.U.rn(0.5 + (b?.population || 1) * 0.01, 1); },
  fare(w, b, miles) { return AZ.U.rn(Math.max(1, miles * 0.004) * (1 + this.tax(w, b)), 1); },
  wage(w, b) { return AZ.U.rn(0.15 * (1 + this.tax(w, b)), 2); },                    // one crew member, one day
  hire(w, b) { return AZ.U.rn(0.1 * (1 + this.tax(w, b)), 2); },                     // the boat, one day
  heal(w, b) { return AZ.U.rn(1 + this.ration(w, b) * 5, 1); },
  repair(w, b) {
    const mk = this.market(w, b), s = w.P.goods.find(g => /sail/i.test(g.name)), rp = w.P.goods.find(g => /rope/i.test(g.name));
    const p = (s && mk?.goods[s.i]?.[1] || 6) * 0.3 + (rp && mk?.goods[rp.i]?.[1] || 3) * 0.3;
    return AZ.U.rn(p * (1 + this.tax(w, b)), 1);
  },
  goodPrice(w, b, gid) { const mk = this.market(w, b); return mk && mk.goods[gid] ? mk.goods[gid][1] * (1 + this.tax(w, b)) : null; },
};

// ---------------------------------------------------------------------------------------------
// Travel, supplies and money.
//   Booked ship: a captain with his own itinerary (a cargo to land, ports to call at); a fixed
//   departure; the passenger cannot steer and the ship does not wait.
//   Hired or owned boat: the traveller steers; the crew eats from the traveller's stores, draws
//   daily wages, calls for anchor at dusk and for shelter in storms, and can be overruled at a
//   cost to morale. Low morale ends in mutiny.
//   Days: everyone eats once a day (water is not tracked for now). Hunger slows you;
//   in the end you collapse and wake somewhere else, poorer and later.
// ---------------------------------------------------------------------------------------------
Object.assign(AZ.COND, {
  hungry: { on: "you are hungry", off: "you have eaten", slow: 1.2, label: "hungry" },
  starving: { on: "you are starving", off: "you have eaten", slow: 1.5, label: "starving" },
  thirsty: { on: "you are thirsty", off: "you have drunk", slow: 1.4, label: "thirsty" },
});

Object.assign(AZ.Game.prototype, {
  eaters() { const v = this.s.vessel; return 1 + (v && v.crew && (v.mode === "hired" || v.mode === "owned") && !this.s.voyage ? v.crew : 0); },
  capacity() { const s = this.s; return { food: s.vessel && !s.voyage ? 220 : s.voyage ? 60 : 20, goods: s.vessel && !s.voyage ? 30 : s.voyage ? 10 : 6 }; },
  refill() { /* water is not tracked for now */ },
  tick() {
    const s = this.s, w = this.w, U = AZ.U;
    if (!s || this.ui.busy()) return;
    const day = Math.floor(s.clock / 24);
    if (day > s.lastDay) {
      const n = Math.min(day - s.lastDay, 60); s.lastDay = day;
      for (let i = 0; i < n; i++) if (this.newDay()) return;
      if (s.voyage && s.aboard && s.voyage.state === "sea" && this.shipEvent && U.rnd2(day, s.seed % 100003, 41) < AZ.SHIP_EVENTS.rate) return this.shipEvent();
    }
    if (s.voyage && s.voyage.state === "port" && s.clock >= s.voyage.departAt) return this.depart();
    const wx = this.weather();
    if (wx.key !== s.wxKey) {
      s.wxKey = wx.key;
      if (wx.kind === "storm" && s.aboard && !w.isLand(s.c, s.r)) return this.stormCall();
      if (wx.kind !== s.wxKind && ["storm", "snow", "fog", "rain"].includes(wx.kind)) this.ui.toast(`Weather: ${wx.label} ${AZ.T("mixed")}`);
      s.wxKind = wx.kind;
    }
    const v = s.vessel;
    if (v && s.aboard && !s.voyage && v.crew && !this.harbourAt.has(w.idx(s.c, s.r)) && !w.isLand(s.c, s.r)) {
      const sun = AZ.Clock.sun(s.clock, this.lat()), key = Math.floor((s.clock + 12) / 24);
      if (sun.dl < 24 && (sun.hour >= sun.set + 0.75 || sun.hour < sun.rise) && v.nightKey !== key) { v.nightKey = key; return this.crewCall(); }
    }
    void U;
  },
  newDay() {
    const s = this.s, U = AZ.U, v = s.vessel;
    const eat = this.eaters();
    s.sup.food -= eat;
    if (s.voyage && s.aboard) { if (s.voyage.role === "crew") s.sup.food += eat; this.slept(); } // the ship feeds its crew; passengers sleep aboard
    if (s.sup.food < 0) { s.sup.food = 0; s.hunger++; if (v && v.crew) v.morale -= 15; } else s.hunger = 0;
    delete s.cond.hungry; delete s.cond.starving; delete s.cond.thirsty;
    if (s.hunger >= 3) s.cond.starving = true; else if (s.hunger >= 1) s.cond.hungry = true;
    if (v && v.crew && (v.mode === "hired" || v.mode === "owned")) {
      const due = U.rn(v.crew * v.wage + (v.hire || 0), 2);
      if (s.purse >= due) { s.purse = U.rn(s.purse - due, 2); v.morale = Math.min(100, v.morale + 1); }
      else { v.morale -= 20; v.owed = U.rn((v.owed || 0) + due, 2); this.ui.toast(`You cannot pay the crew (🟡 ${due} due). They mutter.`); this.log(`Wages unpaid (🟡 ${due}).`); }
      if (v.promise && s.clock > v.promise.by) { v.morale -= 10; this.ui.toast(`You promised the crew ${U.esc(v.promise.name)} and have not made it.`); v.promise = null; }
      if ((v.strikes || 0) > 0 && v.morale > 60) { v.calm = (v.calm || 0) + 1; if (v.calm >= 10) { v.strikes--; v.calm = 0; this.ui.toast("The crew's grievances fade. One strike forgiven."); } } else v.calm = 0;
    }
    if (s.voyage && s.voyage.role === "crew") s.voyage.earned = U.rn((s.voyage.earned || 0) + AZ.Prices.wage(this.w, null), 2);
    // fever runs its course unless treated: gravely ill on the third day, collapse on the sixth
    if (s.cond.fever || s.cond.gravely) {
      s.feverDays = (s.feverDays || 0) + 1;
      if (s.feverDays === 3) { delete s.cond.fever; s.cond.gravely = true; this.ui.toast("The fever is worse. You are gravely ill: find a priest, a healing spring, or rest two days."); }
      if (s.feverDays >= 6) { this.collapse("fever"); return true; }
    } else s.feverDays = 0;
    for (const [g0, rec] of Object.entries(s.mk || {})) for (const r of Object.values(rec)) { r.f = 1 + (r.f - 1) * 0.92; r.taken = Math.max(0, (r.taken || 0) * 0.85); void g0; }
    const left = s.sup.food / eat;
    if (left < 3 && left > 0) { const p = this.nearestPort(v?.cls); this.ui.toast(`Food low: about ${Math.floor(left)} day${left >= 2 ? "s" : ""} left${p && s.aboard ? `. Nearest harbour: ${U.esc(p.name)}, ${this.know.dirDist(s.c, s.r, p.t).txt}` : ""}.`); }
    if (s.hunger === 1) this.ui.toast("Your food is gone. Buy more at a market, fish, or forage.");
    if (v && v.crew && v.morale < 20 && s.aboard && !s.voyage) { this._ultimatum = true; }
    if (s.hunger >= 7) { this.collapse("hunger"); return true; }
    this.dirty = true;
    return false;
  },
  // ------------------------------------------------------------------ sleep
  awakeTick(h) {
    const s = this.s;
    s.awake = (s.awake || 0) + h;
    if (s.awake >= 44 && !this.ui.busy()) {
      this.ui.toast("You fall asleep where you stand, and wake ten hours later.");
      s.clock += 10; this.slept();
      if (s.vessel && s.aboard && s.vessel.crew) s.vessel.morale -= 5;
      this.log("Fell asleep from exhaustion.");
      return;
    }
    if (s.awake >= 30) { delete s.cond.tired; if (!s.cond.exhausted) this.ui.toast("You are exhausted. Sleep (R, or a room at an inn)."); s.cond.exhausted = true; }
    else if (s.awake >= 18) { if (!s.cond.tired) this.ui.toast("You are tired."); s.cond.tired = true; }
  },
  slept() { const s = this.s; s.awake = 0; delete s.cond.tired; delete s.cond.exhausted; },
  nearestPort(cls) {
    const s = this.s, w = this.w;
    let best = null, bd = 1e9;
    for (const b of w.P.burgs) if (b && b.port) { const h = w.harbour(b, cls || "boat"); if (!h) continue; const d = Math.hypot(h.t[0] - s.c, h.t[1] - s.r); if (d < bd) { bd = d; best = b; } }
    return best;
  },
  async collapse(cause) {
    const s = this.s, w = this.w, U = AZ.U;
    const b = w.near(s.c, s.r, 200).find(n => n.kind === "burg")?.o || this.nearestPort("boat");
    const lost = U.rn(s.purse / 2, 2);
    s.purse = U.rn(s.purse - lost, 2); s.clock += 72; s.hunger = 0; s.feverDays = 0; s.sup.food = Math.max(s.sup.food, 1);
    for (const k of ["hungry", "starving", "thirsty", "fever", "gravely"]) delete s.cond[k];
    this.slept();
    s.voyage = null; s.aboard = false; s.auto = false;
    if (s.vessel && s.vessel.mode === "hired") s.vessel = null;
    s.c = b.t[0]; s.r = b.t[1]; this.anim = null;
    this.log(`Collapsed from ${cause || "hunger"}; woke in ${U.esc(b.name)}.`, "hook");
    await this.ui.say([`You collapse${cause === "fever" ? " in the fever" : ""}. Days later you wake in ${U.esc(b.name)}, in a stranger's bed. Someone has been paid for your keep: 🟡 ${lost} is gone from your purse ${AZ.T("mixed")}.`]);
    this.afterStep();
  },
  async mutiny() {
    const s = this.s, w = this.w, U = AZ.U, v = s.vessel;
    const b = this.nearestPort(v.cls) || w.P.burgs.find(x => x && x.port);
    const h = w.harbour(b, v.cls);
    const miles = Math.hypot(h.t[0] - s.c, h.t[1] - s.r) * w.miles;
    s.clock += miles / v.speed;
    s.c = h.t[0]; s.r = h.t[1]; s.auto = false; this.anim = null;
    this.log(`Mutiny: the crew took the boat into ${U.esc(b.name)}.`, "hook");
    if (v.mode === "hired") { s.vessel = null; s.aboard = false; s.c = b.t[0]; s.r = b.t[1]; }
    else { v.crew = 0; v.strikes = 0; v.c = h.t[0]; v.r = h.t[1]; }
    await this.ui.say([`<b class="hook">Mutiny.</b> Third strike: the crew turns the ${U.esc(v.kind.toLowerCase())} for ${U.esc(b.name)} and will not hear another word ${AZ.T("mixed")}.`,
      v.mode === "hired" ? "In harbour they walk off with the boat's owner, and your deposit goes with them. You are ashore." : "In harbour they take their wages in silence and leave. Your boat has no crew; hire one at the harbour."]);
    this.afterStep();
  },
  async crewCall() {
    const s = this.s, v = s.vessel, U = AZ.U, w = this.w;
    if (v.morale < 20) return this.ultimatum();
    const port = this.nearestPort(v.cls), h = port && w.harbour(port, v.cls), mi = h ? Math.round(Math.hypot(h.t[0] - s.c, h.t[1] - s.r) * w.miles) : null;
    const nearLand = w.near(s.c, s.r, 3).length > 0 || [[0, 2], [2, 0], [0, -2], [-2, 0]].some(([a, b]) => w.isLand(s.c + a, s.r + b));
    const k = await this.ui.choose(`<b>The crew calls for anchor.</b> Sunset, ${AZ.Clock.fmt(s.clock)}. They have sailed their hours (${v.hpd} a day by custom ${AZ.T("data")}). Morale ${Math.round(v.morale)}${v.strikes ? `, strikes ${v.strikes}/3` : ""}.`,
      [{ label: "Anchor here until dawn" }, { label: `Sail on through the night (morale −12${nearLand ? ", and reefs near" : ""})` }, { label: port ? `Make for ${U.esc(port.name)} harbour (${U.num(mi)} mi)` : "No harbour near", disabled: !port }], { cancel: 0 });
    if (k === 0) {
      const t0 = s.clock; s.clock = AZ.Clock.nextDawn(s.clock, this.lat()); v.anchored = true; v.morale = Math.min(100, v.morale + 4); this.slept();
      const act = this.doAct("anchor");
      this.ui.toast(`At anchor ${AZ.Clock.span(s.clock - t0)}. ${act ? `<span class="hook">★ ${U.esc(act.label)}</span>` : ""}`, act ? "gold" : "");
    } else if (k === 1) {
      v.morale -= 12;
      if (nearLand && AZ.U.rnd2(s.c, s.r, Math.floor(s.clock)) < 0.15) { this.events.fx({ cond: "damaged", time: 3 }, "Struck a reef at night."); this.ui.toast("In the dark you touch a reef. The hull is damaged."); }
      else this.ui.toast(`The crew sails on, sullen. Morale ${Math.round(v.morale)}.`);
    } else { s.waypoint = h.t; v.morale -= 2; this.setAuto(true); }
    this.dirty = true;
  },
  // three strikes: each time morale breaks, the crew states its terms; the third time they take the boat
  async ultimatum() {
    const s = this.s, v = s.vessel, U = AZ.U, w = this.w, P = AZ.Prices;
    s.auto = false;
    v.strikes = (v.strikes || 0) + 1;
    this.log(`The crew's ultimatum (strike ${v.strikes}).`, "hook");
    if (v.strikes >= 3) return this.mutiny();
    const port = this.nearestPort(v.cls), h = port && w.harbour(port, v.cls);
    const days = h ? Math.ceil((Math.hypot(h.t[0] - s.c, h.t[1] - s.r) * w.miles) / (v.speed * v.hpd)) + 2 : 0;
    const bonus = U.rn(v.crew * (v.wage || 0.2) * 5, 2);
    const k = await this.ui.choose(`<b>The crew has had enough</b> (strike ${v.strikes} of 3). The mate speaks for them: better pay, or a port, or they will take matters into their own hands ${AZ.T("mixed")}.`,
      [{ label: `Pay a bonus of 🟡 ${bonus} (morale +30)`, disabled: s.purse < bonus }, { label: port ? `Promise ${U.esc(port.name)} within ${days} days (morale +15)` : "No port to promise", disabled: !port }, { label: "Refuse, and face them down" }], { cancel: 2 });
    if (k === 0) { s.purse = U.rn(s.purse - bonus, 2); v.morale = Math.min(100, v.morale + 30); this.ui.toast("The money goes round the forecastle. They go back to work."); }
    else if (k === 1) { v.morale += 15; v.promise = { name: port.name, b: port.i, by: s.clock + days * 24 }; s.waypoint = h.t; this.setAuto(true); this.ui.toast(`You give your word: ${U.esc(port.name)}.`); }
    else { v.morale += 5; this.ui.toast("They back down, for now. Nobody meets your eye."); }
    this.dirty = true;
    void P;
  },
  async stormCall() {
    const s = this.s, U = AZ.U, w = this.w;
    const until = (Math.floor(s.clock / 12) + 1) * 12;
    if (s.voyage) {
      const h = Math.max(2, until - s.clock);
      s.clock = until;
      this.log(`Storm: ${U.esc(s.voyage.ship)} hove to for ${Math.round(h)} h.`);
      return this.ui.say(`<b>Storm.</b> The captain of the ${U.esc(s.voyage.ship)} heaves to and rides it out: ${Math.round(h)} hours lost ${AZ.T("mixed")}.`);
    }
    const v = s.vessel;
    if (!v) return;
    const port = this.nearestPort(v.cls), h = port && w.harbour(port, v.cls);
    const k = await this.ui.choose(`<b>A storm is coming up.</b> ${v.crew ? `The crew wants to run for shelter. Morale ${Math.round(v.morale)}.` : ""}`,
      [{ label: `Heave to until it passes (${Math.round(until - s.clock)} h)` }, { label: port ? `Run for ${U.esc(port.name)} harbour` : "No harbour near", disabled: !port }, { label: "Ride it out under sail (morale −10, risk of damage)" }], { cancel: 0 });
    if (k === 0) { s.clock = until; this.ui.toast("The storm blows itself out."); }
    else if (k === 1) { s.waypoint = h.t; this.setAuto(true); }
    else { v.morale -= 10; if (AZ.U.rnd2(s.c, s.r, Math.floor(s.clock) + 5) < 0.3) this.events.fx({ cond: "damaged" }, "Storm damage."), this.ui.toast("A spar carries away. The boat is damaged."); }
    this.dirty = true;
  },
  // ------------------------------------------------------------------ harbour
  canCrew() { return /deck|net|sail|fish|cook|supercargo|shipmaster/i.test(this.tv.trade) || this.tv.kind === "shipmaster"; },
  shipOffers(b) {
    const s = this.s, w = this.w, U = AZ.U, P = w.P, day = Math.floor(s.clock / 24);
    s.taken = s.taken || [];
    const rnd = U.rng(`${s.seed}:ships:${b.i}:${Math.floor(day / 3)}`);
    const out = [];
    const flagOf = st => P.states[st]?.name || "no flag";
    const mk = (dest, stops, departAt, planned, cargo) => {
      const bh = w.harbour(b, "ship");
      if (!bh) return null;
      const legs = [b, ...stops, dest];
      let miles = 0;
      for (let i = 0; i < legs.length - 1; i++) miles += Math.hypot(legs[i + 1].t[0] - legs[i].t[0], legs[i + 1].t[1] - legs[i].t[1]) * w.miles * 1.15;
      const id = `${b.i}:${dest.i}:${Math.round(departAt)}`;
      const captain = this.know.person(`cap:${id}`, b.culture);
      const ship = `the ${U.cap(w.names.get(P.cultures[b.culture].base, U.rng(`ship:${id}`), 4, 9))}`;
      if (!legs.every(x => w.harbour(x, "ship") && w.sameWater(bh.t, w.harbour(x, "ship").t, "ship"))) return null;
      return { id, planned, dest, stops, departAt, miles: Math.round(miles), fare: AZ.Prices.fare(w, b, miles), captain, ship, flag: b.state, cargo,
        why: cargo ? `${captain} carries ${cargo.toLowerCase()} for the markets of ${[...stops, dest].map(x => x.name).join(" and ")} ${AZ.T("data")}` : `${captain} has a cargo for ${dest.name}` };
    };
    const cp = this.cpHere();
    if (cp && cp.place.burg === b && cp.legOut && AZ.vesselClass(cp.legOut.transport) === "ship" && cp.legOut.place.burg) {
      const arrive = s.cpRec[cp.i]?.arrive ?? cp.parArrive;
      const departAt = arrive + (cp.parLeave - cp.parArrive);
      const o = mk(cp.legOut.place.burg, [], departAt, true, null);
      if (o && departAt > s.clock) { o.miles = Math.round(cp.legOut.miles); o.fare = AZ.Prices.fare(w, b, cp.legOut.miles); o.why = `the plan's ship: ${o.captain} sails direct ${AZ.T("data")}`; out.push(o); }
      // a slower ship to the same port, calling on the way where the trade takes it
      const dest = cp.legOut.place.burg;
      const between = P.burgs.filter(x => x && x.port && x !== b && x !== dest && w.harbour(x, "ship") && w.sameWater(w.harbour(b, "ship")?.t, w.harbour(x, "ship").t, "ship")).map(x => ({ x, off: AZ.U.clamp(this.offLine(b.t, dest.t, x.t), 0, 1e9) })).filter(o2 => o2.off < 60).sort((a2, b2) => a2.off - b2.off).slice(0, 3).map(o2 => o2.x);
      if (between.length) { const o2 = mk(dest, [rnd.pick(between)], s.clock + 30 + rnd() * 40, false, this.cargoFor(b)); if (o2) { o2.fare = AZ.U.rn(o2.fare * 0.8, 1); out.push(o2); } }
    }
    const sells = Object.keys(P.trade.sell[b.i] || {});
    const ports = P.burgs.filter(x => x && x.port && x !== b && w.harbour(x, "ship") && w.sameWater(w.harbour(b, "ship")?.t, w.harbour(x, "ship").t, "ship"));
    const buyers = ports.filter(x => sells.some(g => (P.trade.buy[x.i] || {})[g])).sort((a, c) => Math.hypot(a.t[0] - b.t[0], a.t[1] - b.t[1]) - Math.hypot(c.t[0] - b.t[0], c.t[1] - b.t[1]));
    for (const dest of [...buyers.slice(0, 2), ...ports.filter(x => x.capital).sort(() => rnd() - 0.5).slice(0, 1)]) {
      const g = sells.find(gg => (P.trade.buy[dest.i] || {})[gg]);
      const o = mk(dest, [], s.clock + 6 + rnd() * 60, false, g ? P.goods.find(x => x.i === +g)?.name : null);
      if (o && !out.some(x => x.dest === dest)) out.push(o);
    }
    return out.filter(o => !s.taken.includes(o.id) && o.departAt > s.clock).slice(0, 5);
  },
  offLine(a, b, p) { // distance (tiles) from p to segment ab, infinite beyond the ends
    const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
    const t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (L || 1);
    if (t < 0.1 || t > 0.9) return 1e9;
    return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
  },
  cargoFor(b) { const g = Object.keys(this.w.P.trade.sell[b.i] || {})[0]; return g ? this.w.P.goods.find(x => x.i === +g)?.name : null; },
  async harbour(b) {
    const s = this.s, w = this.w, U = AZ.U, P = AZ.Prices;
    if (s.vessel && s.vessel.crew && this.vesselHere(b) && this.doAct("book")) this.ui.toast(`<span class="hook">★ Your ${U.esc(s.vessel.kind.toLowerCase())} and crew are ready: passage arranged.</span>`, "gold");
    for (;;) {
      const offers = this.shipOffers(b);
      const opts = [];
      for (const o of offers) {
        const crew = this.canCrew();
        opts.push({ label: `${o.planned ? "★ " : ""}${U.esc(o.ship)} (${U.esc(w.P.states[o.flag]?.name || "")}) to ${U.esc(o.dest.name)}${o.stops.length ? ` via ${o.stops.map(x => U.esc(x.name)).join(", ")}` : ", direct"} · sails ${AZ.Clock.fmt(o.departAt)} (in ${AZ.Clock.span(o.departAt - s.clock)}) · fare 🟡 ${o.fare}`, cls: o.planned ? "hook" : "", act: "book", o, disabled: s.purse < o.fare || !!s.voyage });
        if (crew) opts.push({ label: `   … or sign on as crew aboard ${U.esc(o.ship)} (no fare; work the passage)`, act: "crew", o, disabled: !!s.voyage });
      }
      const boatH = w.harbour(b, "boat");
      if (boatH && !s.vessel) {
        const crew = 3, day = U.rn(crew * (P.wage(w, b) + P.ration(w, b)) + P.hire(w, b), 2);
        opts.push({ label: `Hire a sailing boat with a crew of ${crew}: 🟡 ${U.rn(P.hire(w, b) + crew * P.wage(w, b), 2)} a day in wages and hire, three days paid now; you feed the crew (about 🟡 ${day} a day in all)`, act: "hire", disabled: s.purse < 3 * (P.hire(w, b) + crew * P.wage(w, b)) });
      }
      if (s.vessel && s.vessel.mode === "owned" && !s.vessel.crew) opts.push({ label: `Hire a crew of 3 for your boat (🟡 ${U.rn(3 * P.wage(w, b) * 3, 2)} for three days)`, act: "crewup", disabled: s.purse < 3 * P.wage(w, b) * 3 });
      if (s.vessel && s.vessel.mode === "hired" && this.vesselHere(b)) opts.push({ label: `Pay off the crew and return the boat${s.vessel.owed ? ` (owed 🟡 ${s.vessel.owed})` : ""}`, act: "payoff" });
      if (!opts.length) opts.push({ label: "No ships are taking passengers this week", act: "none", disabled: true });
      opts.push({ label: "Back", act: "back" });
      const k = await this.ui.choose(`<b>${U.esc(b.name)} harbour</b> · 🟡 ${U.rn(s.purse, 1)}${this.voyageLine()}`, opts, { cancel: opts.length - 1 });
      const o = opts[k];
      if (o.act === "back" || o.act === "none") return;
      if (o.act === "book" || o.act === "crew") {
        const crew = o.act === "crew";
        if (!crew) s.purse = U.rn(s.purse - o.o.fare, 2);
        s.taken.push(o.o.id);
        const h = w.harbour(b, "ship").t;
        s.voyage = { ship: o.o.ship, captain: o.o.captain, flag: o.o.flag, role: crew ? "crew" : "passenger", fare: crew ? 0 : o.o.fare, cls: "ship", speed: 10, hpd: 24,
          stops: [...o.o.stops, o.o.dest].map((x, i, a) => ({ b: x.i, name: x.name, stay: i === a.length - 1 ? 0 : 8 + Math.round(AZ.U.rnd2(x.i, b.i, 3) * 16) })),
          leg: 0, state: "port", at: h, portBurg: b.i, departAt: o.o.departAt, planned: o.o.planned, from: b.i, why: o.o.why, course: null, pos: 0 };
        this.doAct("book");
        this.log(`${crew ? "Signed on" : "Booked passage"} aboard ${U.esc(o.o.ship)} to ${U.esc(o.o.dest.name)}, sailing ${AZ.Clock.fmt(o.o.departAt)}.`, "hook");
        await this.ui.say([`${crew ? "You sign the ship's articles" : `🟡 ${o.o.fare} buys a berth`} aboard ${U.esc(o.o.ship)}, ${U.esc(o.o.captain)} master. ${U.cap(o.o.why)}.`,
          `She sails <b>${AZ.Clock.fmt(o.o.departAt)}</b>, in ${AZ.Clock.span(o.o.departAt - s.clock)}, and will not wait. Bring your own food: you have ${s.sup.food} days' worth. Board from town (Space) before she sails.`]);
        return;
      }
      if (o.act === "hire") {
        const crew = 3, h = boatH.t;
        const first = U.rn(3 * (P.hire(w, b) + crew * P.wage(w, b)), 2);
        s.purse = U.rn(s.purse - first, 2);
        s.vessel = { mode: "hired", kind: "Sailing boat", cls: "boat", speed: 6, hpd: 12, crew, morale: 70, c: h[0], r: h[1], wage: P.wage(w, b), hire: P.hire(w, b), home: b.i, prepaid: 2 };
        this.doAct("book");
        this.log(`Hired a sailing boat in ${U.esc(b.name)}.`, "hook");
        await this.ui.say([`The boat is yours to command, with ${crew} hands: a mate, a deckhand and a boy ${AZ.T("new")}. You pay 🟡 ${first} now; after that, wages and hire come due each dawn.`,
          `They expect to sail from dawn for twelve hours and anchor at night, as boats do ${AZ.T("data")}. Feed them: they eat from your stores. Buy food at the market before you sail; fishing helps.`, `Board from town (Space), then steer or press F.`]);
        continue;
      }
      if (o.act === "crewup") { const cost = U.rn(3 * P.wage(w, b) * 3, 2); s.purse = U.rn(s.purse - cost, 2); s.vessel.crew = 3; s.vessel.morale = 70; this.ui.toast("Three hands sign on."); continue; }
      if (o.act === "payoff") {
        const owed = s.vessel.owed || 0;
        s.purse = U.rn(Math.max(0, s.purse - owed), 2);
        this.log(`Returned the hired boat in ${U.esc(b.name)}.`);
        s.vessel = null; s.aboard = false; s.c = b.t[0]; s.r = b.t[1];
        this.ui.toast("The crew is paid off and the boat returned."); this.dirty = true; return;
      }
    }
  },
  vesselHere(b) { const v = this.s.vessel; if (!v) return false; return ["boat", "ship"].some(cls => { const h = this.w.harbour(b, cls); return h && h.t[0] === v.c && h.t[1] === v.r; }); },
  boardOptions(b) {
    const s = this.s, U = AZ.U, opts = [];
    const v = s.voyage;
    if (v && v.state === "port" && v.portBurg === b.i) {
      if (!s.aboard) opts.push({ label: `Board ${U.esc(v.ship)} (sails ${AZ.Clock.fmt(v.departAt)}, in ${AZ.Clock.span(v.departAt - s.clock)})`, cls: "hook", act: { go: async () => { s.aboard = true; s.c = v.at[0]; s.r = v.at[1]; this.ui.toast(`Aboard ${U.esc(v.ship)}.`); this.afterStep(); } } });
      opts.push({ label: `Wait aboard until ${U.esc(v.ship)} sails (${AZ.Clock.span(v.departAt - s.clock)})`, act: { go: async () => { s.aboard = true; s.c = v.at[0]; s.r = v.at[1]; s.clock = v.departAt; this.afterStep(); } } });
      if (s.aboard) opts.push({ label: "Go ashore and walk (mind the sailing time)", act: { go: async () => { s.aboard = false; s.c = b.t[0]; s.r = b.t[1]; this.afterStep(); } } });
    }
    if (s.vessel && !s.voyage && this.vesselHere(b)) {
      if (!s.aboard) opts.push({ label: `Board your ${U.esc(s.vessel.kind.toLowerCase())}${s.vessel.crew ? "" : " (no crew!)"}`, act: { go: async () => { s.aboard = true; s.c = s.vessel.c; s.r = s.vessel.r; this.afterStep(); } } });
      else opts.push({ label: `Go ashore and walk (the ${U.esc(s.vessel.kind.toLowerCase())} waits in harbour)`, act: { go: async () => { s.aboard = false; s.c = b.t[0]; s.r = b.t[1]; this.afterStep(); } } });
    }
    return opts;
  },
  shipWarn() { const v = this.s.voyage; return v && v.state === "port" && v.departAt < AZ.Clock.nextDawn(this.s.clock, this.lat()) ? " — the ship sails before morning!" : ""; },
  voyageLine() { const v = this.s.voyage; return v && v.state === "port" ? ` · <span class="hook">${AZ.U.esc(v.ship)} sails ${AZ.Clock.fmt(v.departAt)} (in ${AZ.Clock.span(v.departAt - this.s.clock)})</span>` : ""; },
  // ------------------------------------------------------------------ voyages
  depart() {
    const s = this.s, v = s.voyage, U = AZ.U, w = this.w;
    if (!s.aboard) {
      this.log(`Missed ${U.esc(v.ship)}: she sailed ${AZ.Clock.fmt(v.departAt)} without you.`, "hook");
      s.voyage = null; this.dirty = true;
      return this.ui.say(`<b class="hook">${U.esc(v.ship)} has sailed without you.</b> The fare is gone. Book another ship at the harbour.`);
    }
    const stop = v.stops[v.leg], tb = w.P.burgs[stop.b], th = w.harbour(tb, "ship");
    let course = null;
    const plan = v.planned && this.jr && this.jr.segs.find(sg => sg.moving && sg.fromHarbour && sg.fromHarbour[0] === v.at[0] && sg.fromHarbour[1] === v.at[1] && sg.place.burg === tb);
    if (plan) { course = plan.chain; v.milesPerStep = plan.miles / Math.max(1, plan.chain.length - 1); }
    else { course = th ? w.waterPath(v.at, th.t, "ship") : null; v.milesPerStep = course ? course.mps : w.miles; }
    if (!course) {
      const port = w.P.burgs[v.portBurg];
      this.log(`${U.esc(v.ship)} could not find a way to ${U.esc(tb.name)}.`);
      s.voyage = null; s.aboard = false; s.purse = U.rn(s.purse + (v.leg === 0 ? v.fare : 0), 2);
      if (port) { s.c = port.t[0]; s.r = port.t[1]; }
      this.anim = null; this.afterStep();
      return this.ui.say(`The captain will not risk it: there is no way by sea to ${U.esc(tb.name)} from here. The voyage is off${v.leg === 0 ? " and your fare is returned" : ""}; you are put ashore.`);
    }
    v.course = course; v.pos = 0; v.state = "sea"; v.to = th.t;
    s.c = course[0][0]; s.r = course[0][1];
    this.log(`${U.esc(v.ship)} cast off for ${U.esc(tb.name)}.`);
    this.ui.toast(`${U.esc(v.ship)} casts off for ${U.esc(tb.name)}. You are a passenger: Space for the ship, F for faster days, P to pause.`);
    this.dirty = true;
  },
  voyageStep() {
    const s = this.s, v = s.voyage, U = AZ.U, w = this.w;
    const next = v.course[v.pos + 1];
    if (!next) return this.dock();
    const dc = next[0] - s.c, dr = next[1] - s.r;
    s.dir = dc < 0 ? "left" : dc > 0 ? "right" : s.dir;
    const hours = this.stepHours(next[0], next[1], dc, dr);
    this.anim = { from: [s.c, s.r], to: [next[0], next[1]], t0: performance.now(), dur: this.fast ? 22 : 70 };
    s.c = next[0]; s.r = next[1]; s.clock += hours; v.pos++;
    this.afterStep();
    void U; void w;
  },
  async dock() {
    const s = this.s, v = s.voyage, U = AZ.U, w = this.w;
    const stop = v.stops[v.leg], b = w.P.burgs[stop.b];
    v.state = "port"; v.at = [s.c, s.r]; v.portBurg = b.i; v.course = null;
    if (this._toPort) { this._toPort = false; this.fast = false; }
    v.leg++;
    this.log(`${U.esc(v.ship)} docked at ${U.esc(b.name)}.`);
    if (v.leg >= v.stops.length) {
      s.voyage = null; s.aboard = false; s.c = b.t[0]; s.r = b.t[1]; this.anim = null;
      if (v.role === "crew" && v.earned) { s.purse = U.rn(s.purse + v.earned, 2); }
      await this.ui.say(`<b>${U.esc(v.ship)}</b> makes fast in ${U.esc(b.name)}. You go ashore${v.role === "crew" ? ` with your pay, 🟡 ${v.earned || 0}` : ""}.`);
      this.afterStep();
      return;
    }
    v.departAt = s.clock + stop.stay;
    await this.ui.say(`<b>${U.esc(v.ship)}</b> calls at ${U.esc(b.name)} and sails again <b>${AZ.Clock.fmt(v.departAt)}</b>, in ${stop.stay} hours. Go ashore if you like (Space), but be back aboard in time.`);
    this.afterStep();
  },
  async shipTalk() {
    const s = this.s, v = s.voyage, U = AZ.U, w = this.w;
    const next = v.stops[v.leg], atSea = v.state === "sea";
    const opts = [{ id: "cap", label: "Talk to the captain" }, { id: "pax", label: "Talk to the other passengers" }];
    if (atSea) opts.push({ id: 3, label: "Rest 3 hours (the ship sails on)" }, { id: 6, label: "Rest 6 hours" }, { id: "dawn", label: "Sleep until dawn" },
      { id: "watch", label: `Watch from the deck (normal pace)${!s.voyPause && !this.fast ? " ✓" : ""}` }, { id: "fast", label: `Let the days pass quickly${this.fast && !s.voyPause ? " ✓" : ""}` },
      { id: "pause", label: `Hold here and look around (time stops until you act)${s.voyPause ? " ✓" : ""}` }, { id: "port", label: "Let the days pass until the next port" });
    else opts.push({ id: "wait", label: "Wait aboard until she sails" });
    opts.push({ id: "back", label: "Back" });
    const k = await this.ui.choose(`Aboard <b>${U.esc(v.ship)}</b>, ${U.esc(v.captain)} master · bound for ${U.esc(next ? next.name : "?")} · ${v.role} · ${AZ.Clock.fmt(s.clock)}`, opts, { cancel: opts.length - 1 });
    const o = opts[k];
    if (o.id === "cap") {
      const sh = w.P.states[v.flag];
      return this.ui.say([`${U.esc(v.captain)} sails under the flag of ${U.esc(sh?.fullName || "no state")} ${AZ.T("data")}. ${U.cap(v.why)}.`,
        `Itinerary: ${v.stops.map((x, i) => `${i < v.leg ? "<s>" : ""}${U.esc(x.name)}${x.stay ? ` (${x.stay} h in port)` : ""}${i < v.leg ? "</s>" : ""}`).join(" → ")} ${AZ.T("mixed")}.`]);
    }
    if (o.id === "pax") { const rm = this.know.rumour(s.c, s.r, U.rng(`${s.seed}:pax:${Math.floor(s.clock / 24)}`), this); s.clock += 1; this.advanceVoyage(0); return this.ui.say(rm ? `A fellow passenger: “${rm}` : "They are seasick and say nothing."); }
    if (o.id === "wait") { s.clock = v.departAt; this.dirty = true; return; }
    if (o.id === 3 || o.id === 6) { this.advanceVoyage(o.id); this.slept(); return; }
    if (o.id === "dawn") { this.advanceVoyage(Math.max(1, AZ.Clock.nextDawn(s.clock, this.lat()) - s.clock)); this.slept(); return; }
    if (o.id === "watch") { s.voyPause = false; this.fast = false; }
    if (o.id === "fast") { s.voyPause = false; this.fast = true; }
    if (o.id === "pause") { s.voyPause = true; this.ui.toast("Holding. The ship moves only while time passes: rest, talk, or press F."); }
    if (o.id === "port") { s.voyPause = false; this.fast = true; this._toPort = true; }
    this.dirty = true;
  },
  // let a number of hours pass aboard: the ship sails on without drawing every step
  advanceVoyage(hours) {
    const s = this.s, v = s.voyage;
    if (!v || v.state !== "sea") return;
    const until = s.clock + hours;
    let guard = 0;
    while (s.voyage === v && v.state === "sea" && guard++ < 5000) {
      if (!v.course[v.pos + 1]) { this.dock(); break; }
      if (s.clock >= until && hours > 0) break;
      this.anim = null; this.voyageStep(); this.anim = null;
      if (this.ui.busy()) break;
      if (hours === 0) break;
    }
    this.dirty = true;
  },
  async market(b) {
    const s = this.s, w = this.w, U = AZ.U, P = AZ.Prices;
    for (;;) {
      const ration = P.ration(w, b), cap = this.capacity(), eat = this.eaters();
      const opts = [];
      for (const n of [1, 5, 10, 20, 40]) opts.push({ label: `Food for ${n} day${n > 1 ? "s" : ""}${eat > 1 ? ` for ${eat} people (${n * eat} rations)` : ""}: 🟡 ${U.rn(n * eat * ration, 2)}`, n, kind: "food", disabled: s.purse < n * eat * ration || s.sup.food + n * eat > cap.food });
      opts.push({ label: `Trade goods (you carry ${this.goodsCount()} of ${cap.goods} units)`, kind: "goods" });
      opts.push({ label: "Back", kind: "back" });
      const k = await this.ui.choose(`<b>${U.esc(b.name)} market</b> · 🟡 ${U.rn(s.purse, 2)} · food ${s.sup.food} rations · food here: ${U.esc(this.cheapFood(b))} ${AZ.T("data")}`, opts, { cancel: opts.length - 1 });
      const o = opts[k];
      if (o.kind === "back") return;
      if (o.kind === "goods") { await this.tradeGoods(b); continue; }
      if (o.kind === "food") { s.purse = U.rn(s.purse - o.n * eat * ration, 2); s.sup.food += o.n * eat; s.hunger = 0; delete s.cond.hungry; delete s.cond.starving; }
      this.dirty = true;
    }
  },
  // ------------------------------------------------------------------ trading goods between markets
  goodsCount() { return Object.values(this.s.goods || {}).reduce((a, n) => a + n, 0); },
  mkRec(mk, gid) { const s = this.s; s.mk = s.mk || {}; const m = s.mk[mk.i] = s.mk[mk.i] || {}; return (m[gid] = m[gid] || { f: 1, taken: 0 }); },
  goodQuote(b, gid) {
    const w = this.w, mk = AZ.Prices.market(w, b);
    if (!mk || !mk.goods[gid]) return null;
    const [stock, price] = mk.goods[gid], rec = this.mkRec(mk, gid), tax = AZ.Prices.tax(w, b);
    const p = price * rec.f;
    const makes = (b.production || {})[gid] > 0 || mk.centerBurgId === b.i;
    return { buy: AZ.U.rn(p * (1 + tax), 2), sell: AZ.U.rn(p * 0.85, 2), stock: Math.max(0, Math.floor(stock - rec.taken)), canBuy: makes && stock - rec.taken >= 1, mk, rec };
  },
  async tradeGoods(b) {
    const s = this.s, w = this.w, U = AZ.U;
    s.goods = s.goods || {}; s.basis = s.basis || {};
    for (;;) {
      const cap = this.capacity().goods, opts = [];
      const held = Object.entries(s.goods).filter(([, n]) => n > 0);
      for (const [gid, n] of held) {
        const q = this.goodQuote(b, gid), g = this.know.good(gid);
        opts.push(q ? { label: `Sell 1 ${U.esc(g.toLowerCase())} for 🟡 ${q.sell} (you have ${n}; paid ${U.rn(s.basis[gid] || 0, 2)} each)`, gid, kind: "sell", q } : { label: `${U.esc(g)}: nobody here buys it (you have ${n})`, disabled: true });
      }
      const mk = AZ.Prices.market(w, b);
      const here = mk ? Object.keys(mk.goods).map(gid => [gid, this.goodQuote(b, gid)]).filter(([, q]) => q && q.canBuy).sort((a, c) => c[1].stock - a[1].stock).slice(0, 10) : [];
      for (const [gid, q] of here) opts.push({ label: `Buy 1 ${U.esc(this.know.good(gid).toLowerCase())} for 🟡 ${q.buy} (${q.stock} in stock)`, gid, kind: "buy", q, disabled: s.purse < q.buy || this.goodsCount() >= cap });
      if (!here.length) opts.push({ label: `${U.esc(b.name)} makes nothing for sale on its market`, disabled: true });
      opts.push({ label: "Back", kind: "back" });
      const k = await this.ui.choose(`<b>${U.esc(b.name)}: goods</b> · 🟡 ${U.rn(s.purse, 2)} · carrying ${this.goodsCount()}/${cap} units · prices from the ${U.esc(w.P.burgs[mk?.centerBurgId]?.name || "")} market, with ${Math.round(AZ.Prices.tax(w, b) * 100)}% sales tax; merchants buy at 85% ${AZ.T("data")}`, opts, { cancel: opts.length - 1 });
      const o = opts[k];
      if (!o || o.kind === "back") return;
      if (o.kind === "buy") {
        const n0 = s.goods[o.gid] || 0;
        s.basis[o.gid] = U.rn(((s.basis[o.gid] || 0) * n0 + o.q.buy) / (n0 + 1), 2);
        s.goods[o.gid] = n0 + 1; s.purse = U.rn(s.purse - o.q.buy, 2); o.q.rec.f *= 1.04; o.q.rec.taken += 1;
      } else if (o.kind === "sell") {
        s.goods[o.gid]--; s.purse = U.rn(s.purse + o.q.sell, 2); o.q.rec.f *= 0.96;
        const profit = U.rn(o.q.sell - (s.basis[o.gid] || 0), 2);
        this.log(`Sold ${U.esc(this.know.good(o.gid).toLowerCase())} in ${U.esc(b.name)} for 🟡 ${o.q.sell} (${profit >= 0 ? "+" : ""}${profit}).`);
      }
      this.dirty = true;
    }
  },
  cheapFood(b) {
    const w = this.w, mk = AZ.Prices.market(w, b);
    if (!mk) return "no market";
    const f = w.P.goods.filter(g => (g.tags || []).includes("food") && mk.goods[g.i]).sort((a, c) => mk.goods[a.i][1] - mk.goods[c.i][1])[0];
    return f ? `${f.name.toLowerCase()} at ${mk.goods[f.i][1]} a unit, ${Math.round((this.w.P.states[b.state]?.salesTax || 0) * 100)}% tax` : "no food on the market";
  },
});

// ---------------------------------------------------------------------------------------------
// Side stories (teal), leads, errands and the reasoning behind the route.
//   Errands are posted on town notice boards and come from the map: what a town makes and who
//   buys it (trade), towns stricken by zones (relief), the state's friends and enemies
//   (letters), its wars (dispatches), strange places nearby (investigations) and faith seats
//   (offerings). Rumours, sightings and libraries add leads you can follow.
// ---------------------------------------------------------------------------------------------
Object.assign(AZ.Game.prototype, {
  startThread(def, quiet) {
    if (!def) return;
    const s = this.s;
    if (s.threads.some(t => t.title === def.title && !t.done)) return;
    const th = { id: s.threads.length, title: def.title, steps: def.steps, phase: 0, done: false, outcome: "", deadline: def.deadline || null, giver: def.giver || null, why: def.why || "" };
    s.threads.push(th);
    this.log(`New side story: ${AZ.U.esc(th.title)}.`, "side");
    if (!quiet) this.ui.toast(`New side story: <b class="side">${AZ.U.esc(th.title)}</b>. ${AZ.U.esc(th.steps[0].text)}`, "teal");
  },
  stepTile(st) {
    const P = this.w.P, g = st.goal || {}, s = this.s;
    if (g.burg) return P.burgs[g.burg]?.t || null;
    if (g.marker != null) return P.markers.find(m => m.i === g.marker)?.t || null;
    if (g.unit) { const [st0, i] = g.unit.split(":").map(Number); return P.military.find(u => u.state === st0 && u.i === i)?.t || null; }
    if (g.temple != null) {
      const c = P.burgs.filter(b => b && b.temple && this.w.C.religion[b.cell] === g.temple).sort((a, b) => Math.hypot(a.t[0] - s.c, a.t[1] - s.r) - Math.hypot(b.t[0] - s.c, b.t[1] - s.r));
      return c[0]?.t || null;
    }
    return null;
  },
  threadSteps(b) {
    const out = [], w = this.w;
    const roles = new Set(this.know.townPeople(b, this).map(p => p.role));
    for (const th of this.s.threads) {
      if (th.done) continue;
      const st = th.steps[th.phase], g = st.goal || {};
      const roleHere = !g.role || roles.has(g.role) || (g.role === "Priest" && roles.has("Shrine-keeper")) || (g.role === "Captain of the watch" && roles.has("Elder"));
      if (!roleHere) continue;
      if (g.burg && g.burg === b.i) out.push([th, st]);
      else if (g.temple != null && b.temple && w.C.religion[b.cell] === g.temple) out.push([th, st]);
      else if (g.marker != null && (() => { const m = w.P.markers.find(x => x.i === g.marker); return m && Math.hypot(m.t[0] - b.t[0], m.t[1] - b.t[1]) <= 2; })()) out.push([th, st]);
      else if (g.farFrom && b.port && Math.hypot(b.t[0] - g.farFrom[0], b.t[1] - g.farFrom[1]) * w.miles >= g.mi) out.push([th, st]);
    }
    return out;
  },
  async completeStep(th, where) {
    const s = this.s, U = AZ.U, st = th.steps[th.phase];
    if (st.needs === "cargo" && ((s.goods || {})[this.tv.cargo] || 0) < 4) {
      th.done = true; th.outcome = "failed";
      this.log(`${U.esc(th.title)}: the consignment is gone.`, "side");
      return this.ui.say(`<b class="side">${U.esc(th.title)}</b>: there is nothing to deliver. ${s.flags.boarded ? "The pirates who boarded you took it" : "You sold some of it elsewhere"} ${AZ.T("mixed")}.`);
    }
    if (st.risk && U.rnd2(th.id, th.phase, s.seed % 9973) < st.risk) {
      th.done = true; th.outcome = "caught";
      const out = this.events.fx({ time: 24, stand: st.riskStand || [] }, `${U.esc(th.title)}: caught.`);
      return this.ui.say(`<b class="side">${U.esc(th.title)}</b>: the watch finds the letter sewn into your coat. A day in a cell, and your name in their book ${AZ.T("mixed")}.${out}`);
    }
    let reward = st.reward ? { ...st.reward } : null;
    let late = "";
    if (th.deadline && s.clock > th.deadline && reward) { if (reward.coin > 0) reward.coin = U.rn(reward.coin / 2, 1); delete reward.stand; late = " You are late: half the pay, and no thanks."; }
    if (st.needs === "cargo") { s.goods[this.tv.cargo] -= 4; delete s.flags.cargo; }
    const out = this.events.fx(reward, `${U.esc(th.title)}: ${U.esc(st.text)}${where ? " (" + U.esc(where.name || "") + ")" : ""}.`);
    th.phase++;
    if (th.phase >= th.steps.length) { th.done = true; th.outcome = "done"; }
    await this.ui.say(`<b class="side">${U.esc(th.title)}</b>: ${U.esc(st.text)}. ${th.done ? "Done." : "Next: " + U.esc(th.steps[th.phase].text) + "."}${late}${out}`);
  },
  async threadsAt(goal) {
    let hit = false;
    for (const th of this.s.threads) {
      if (th.done) continue;
      const g = th.steps[th.phase].goal || {};
      if ((goal.marker != null && g.marker === goal.marker) || (goal.unit && g.unit === goal.unit)) { await this.completeStep(th); hit = true; }
    }
    return hit;
  },
  healCost(b) { const rel = this.w.C.religion[b.cell]; return rel === this.tv.faith || (this.s.stand.f[rel] || 0) >= 2 ? 0 : AZ.Prices.heal(this.w, b); },
  addLead(l) {
    const s = this.s;
    if (!l || s.leads.some(x => x.key === l.key)) return false;
    if (l.key.startsWith("m") && s.done_m.includes(+l.key.slice(1))) return false;
    s.leads.push(l);
    if (l.from === "rumour") this.ui.toast(`New lead: <b class="side">${AZ.U.esc(l.name)}</b> (${l.from})`, "teal");
    return true;
  },
  revealLeads(radiusTiles) {
    const s = this.s; let n = 0;
    for (const x of this.w.near(s.c, s.r, radiusTiles)) {
      if (x.kind !== "marker" || s.seen.m.includes(x.o.i)) continue;
      s.seen.m.push(x.o.i);
      if (this.addLead({ key: "m" + x.o.i, name: x.o.name, type: x.o.type, t: x.o.t, from: "read" })) n++;
    }
    return n;
  },
  activeThread() { return this.s.threads.find(t => !t.done && this.stepTile(t.steps[t.phase])) || this.s.threads.find(t => !t.done) || null; },
  // ------------------------------------------------------------------ the notice board
  questOffers(b) {
    const s = this.s, w = this.w, P = w.P, U = AZ.U, T = AZ.T, out = [];
    const week = Math.floor(s.clock / 168), rnd = U.rng(`${s.seed}:q:${b.i}:${week}`);
    const d = x => Math.hypot(x.t[0] - b.t[0], x.t[1] - b.t[1]);
    const mi = x => Math.round(d(x) * w.miles);
    const days = x => Math.ceil(mi(x) / 40) + 6;
    const near = (lo, hi) => P.burgs.filter(x => x && x !== b && d(x) >= lo && d(x) <= hi).sort((a, c) => d(a) - d(c));
    const gname = g => P.goods.find(x => x.i === +g)?.name || "goods";
    // trade: what this town makes, for a town that buys it
    for (const [g] of Object.entries(b.production || {}).sort((a, c) => c[1] - a[1]).slice(0, 4)) {
      const dest = near(8, 160).find(x => (P.trade.buy[x.i] || {})[g]);
      if (!dest) continue;
      const here = AZ.Prices.goodPrice(w, b, g) || 1, there = AZ.Prices.goodPrice(w, dest, g) || here * 1.2, units = 4;
      const cost = U.rn(here * units, 1), pay = U.rn(Math.max(there, here * 1.1) * units * 1.1 + mi(dest) * 0.003, 1);
      out.push({ title: `${gname(g)} for ${dest.name}`, cost, pay, why: `${b.name} makes ${gname(g).toLowerCase()}; ${dest.name} buys it on its market ${T("data")}. You buy ${units} units here at ${U.rn(here, 2)} and sell there at about ${U.rn(there, 2)} ${T("data")}.`,
        dist: mi(dest), deadline: s.clock + days(dest) * 24, giver: b.i,
        steps: [{ text: `Deliver ${units} ${gname(g).toLowerCase()} to the merchant in ${dest.name}`, goal: { burg: dest.i, role: "Merchant" }, reward: { coin: pay } }] });
      break;
    }
    // relief for a town in a zone
    for (const z of P.zones) {
      if (!/Disease|Disaster|Flood|Tsunami|Eruption|Avalanche/.test(z.type)) continue;
      const tb = P.burgs.filter(x => x && z.cells.includes(x.cell) && d(x) < 220).sort((a, c) => d(a) - d(c))[0];
      if (!tb || tb === b) continue;
      const need = z.type === "Disease" ? P.goods.find(x => /salt/i.test(x.name)) : P.goods.find(x => /grain/i.test(x.name));
      const price = need ? AZ.Prices.goodPrice(w, b, need.i) || 1 : 1, cost = U.rn(price * 2, 1);
      out.push({ title: `Relief for ${tb.name}`, cost, pay: U.rn(cost * 0.6 + 1, 1), why: `${tb.name} lies in the ${z.name} (${z.type.toLowerCase()}) ${T("data")}. The temple here gathers ${need ? need.name.toLowerCase() : "supplies"} for it.`,
        dist: mi(tb), deadline: s.clock + days(tb) * 24, giver: b.i,
        steps: [{ text: `Bring ${need ? need.name.toLowerCase() : "supplies"} to the priests of ${tb.name}`, goal: { burg: tb.i, role: "Priest" }, reward: { coin: U.rn(cost * 0.6 + 1, 1), stand: [["s", tb.state, 2], ["f", w.C.religion[tb.cell], 1]] } }] });
      break;
    }
    // letters along the state's friendships and enmities
    const st = P.states[b.state];
    if (st && st.diplomacy) {
      const rels = st.diplomacy.map((r, i) => ({ r, i })).filter(o => P.states[o.i] && o.i && o.i !== b.state && /Ally|Friendly|Enemy|Suspicion|Rival/.test(o.r));
      for (const o of rels.sort(() => rnd() - 0.5).slice(0, 2)) {
        const cap = P.burgs[P.states[o.i].capital];
        if (!cap || d(cap) > 400) continue;
        const enemy = /Enemy|Rival/.test(o.r);
        const pay = U.rn(1 + mi(cap) * (enemy ? 0.008 : 0.004), 1);
        out.push({ title: `${enemy ? "A letter smuggled into" : "A letter for"} ${cap.name}`, pay, cost: 0,
          why: `${st.name} stands to ${P.states[o.i].name} as “${o.r}” ${T("data")}. ${enemy ? "Their watch searches strangers." : "The chancery wants it carried by someone without a uniform."}`,
          dist: mi(cap), deadline: s.clock + days(cap) * 24, giver: b.i,
          steps: [{ text: `Hand the letter to the watch in ${cap.name}`, goal: { burg: cap.i, role: "Captain of the watch" }, reward: { coin: pay, stand: [["s", b.state, 1]] }, risk: enemy ? 0.4 : 0, riskStand: [["s", o.i, -2]] }] });
      }
      // dispatches to the state's army in a war
      const war = (st.campaigns || []).find(c => c.end == null);
      const reg = war && P.military.filter(u => u.state === b.state && !u.naval).sort((a, c) => d(a) - d(c)).find(u => d(u) > 6 && d(u) < 300);
      if (reg) out.push({ title: `Dispatches for the ${reg.name}`, pay: U.rn(1 + mi(reg) * 0.005, 1), cost: 0, why: `${st.name} is at war: the ${war.name}, since ${war.start} ${T("data")}. The ${reg.name} is ${this.know.dirDist(b.t[0], b.t[1], reg.t).txt} ${T("data")}.`,
        dist: mi(reg), deadline: s.clock + days(reg) * 24, giver: b.i, steps: [{ text: `Carry dispatches to the ${reg.name}`, goal: { unit: `${reg.state}:${reg.i}` }, reward: { coin: U.rn(1 + mi(reg) * 0.005, 1), stand: [["s", b.state, 1]] } }] });
    }
    // strange places nearby
    const m = w.near(b.t[0], b.t[1], 80).filter(n => n.kind === "marker" && /monster|ruin|dungeon|necrop|burial|rift|cave|portal|statue/.test(n.o.type) && !s.done_m.includes(n.o.i)).sort(() => rnd() - 0.5)[0];
    if (m) out.push({ title: `The truth about the ${m.o.name}`, pay: U.rn(1.5 + m.d * w.miles * 0.004, 1), cost: 0, why: `${b.name} wants to know what is at the ${m.o.name}, ${this.know.dirDist(b.t[0], b.t[1], m.o.t).txt} ${T("data")}.`,
      dist: Math.round(m.d * w.miles), deadline: s.clock + (Math.ceil((m.d * w.miles * 2) / 30) + 6) * 24, giver: b.i,
      steps: [{ text: `See the ${m.o.name} for yourself (walk there and press Space beside it)`, goal: { marker: m.o.i } }, { text: `Tell them in ${b.name} what you found`, goal: { burg: b.i, role: "Townsfolk" }, reward: { coin: U.rn(1.5 + m.d * w.miles * 0.004, 1) } }] });
    // an offering for the faith's seat
    const rel = P.religions[w.C.religion[b.cell]], seat = rel && P.burgs.find(x => x && x.cell === rel.center);
    if (seat && seat !== b && d(seat) < 300) out.push({ title: `An offering for ${seat.name}`, pay: 0, cost: 0, why: `${b.name} keeps the ${rel.name}; its seat is ${seat.name} ${T("data")}.`,
      dist: mi(seat), deadline: null, giver: b.i, steps: [{ text: `Carry the offering to the temple in ${seat.name}`, goal: { burg: seat.i, role: "Priest" }, reward: { stand: [["f", rel.i, 2]] } }] });
    return out.filter(o => !s.threads.some(t => t.title === o.title));
  },
  async noticeBoard(b) {
    const s = this.s, U = AZ.U;
    for (;;) {
      const offers = this.questOffers(b);
      const opts = offers.map(o => ({ label: `◆ ${U.esc(o.title)} · ${U.num(o.dist)} mi${o.pay ? ` · pays 🟡 ${o.pay}` : ""}${o.cost ? ` · costs 🟡 ${o.cost} now` : ""}${o.deadline ? ` · within ${Math.round((o.deadline - s.clock) / 24)} days` : ""}`, cls: "side", o, disabled: s.purse < (o.cost || 0) }));
      if (!opts.length) opts.push({ label: "Nothing posted but tax notices", disabled: true });
      opts.push({ label: "Back" });
      const k = await this.ui.choose(`<b>${U.esc(b.name)}: notice board</b> · 🟡 ${U.rn(s.purse, 1)}`, opts, { cancel: opts.length - 1 });
      const o = opts[k].o;
      if (!o) return;
      const k2 = await this.ui.choose(`<b class="side">${U.esc(o.title)}</b><br>${o.why}<br>${U.esc(o.steps.map(x => x.text).join(", then "))}.`, [{ label: `Take it${o.cost ? ` (pay 🟡 ${o.cost} now)` : ""}` }, { label: "Leave it" }], { cancel: 1 });
      if (k2 !== 0) continue;
      if (o.cost) s.purse = U.rn(s.purse - o.cost, 2);
      this.startThread({ title: o.title, steps: o.steps, deadline: o.deadline, giver: o.giver, why: o.why });
    }
  },
  // ------------------------------------------------------------------ why the plan goes this way
  legReasons(cp) {
    const w = this.w, P = w.P, U = AZ.U, T = AZ.T, jr = this.jr, out = [];
    const seg = cp.legIn;
    if (!seg) {
      const o = cp.place.burg;
      const destRel = w.C.religion[jr.segs[jr.segs.length - 1].to];
      out.push(`The road starts in ${U.esc(o.name)}, capital and port of ${U.esc(P.states[o.state]?.fullName)} ${T("data")}. Its end is ${U.esc(jr.dest.name)}, which keeps the ${U.esc(P.religions[destRel]?.name)} ${T("data")}: that is why a pilgrim goes there.`);
      return out;
    }
    const from = jr.cps[cp.i - 1].place, to = cp.place;
    const fb = from.burg, tb = to.burg;
    const fFeat = fb ? w.C.feature[fb.cell] : null, tFeat = tb ? w.C.feature[tb.cell] : null;
    if (fb && tb && to.at) {
      if (fFeat !== tFeat) out.push(`No land joins ${U.esc(fb.name)} (${U.esc(P.features[fFeat]?.name || "")}) and ${U.esc(tb.name)} (${U.esc(P.features[tFeat]?.name || "")}): it has to be by water ${T("data")}.`);
      else out.push(`${U.esc(fb.name)} and ${U.esc(tb.name)} share ${U.esc(P.features[tFeat]?.name || "one landmass")}; ${U.num(Math.round(Math.hypot(fb.t[0] - tb.t[0], fb.t[1] - tb.t[1]) * w.miles))} mi as the crow flies, but the plan goes by water ${T("mixed")}.`);
    }
    const days = seg.hoursPerDay >= 24 ? seg.travelHours / 24 : seg.travelHours / seg.hoursPerDay;
    out.push(`${U.esc(seg.transport)}: ${seg.speed} mph for ${seg.hoursPerDay} hours a day, ${U.num(seg.miles)} mi, about ${Math.round(days)} days ${T("data")}. ${AZ.vesselClass(seg.transport) === "ship" ? "A ship keeps the sea day and night and is booked as a passenger." : "A boat is hired with its crew; it sails by day and anchors at night, and goes where ships do not."}`);
    if (tb && to.at) {
      const lanes = new Set();
      const h = w.harbour(tb, seg.cls || "boat");
      if (h) for (let dr = -3; dr <= 3; dr++) for (let dc = -3; dc <= 3; dc++) { const rt = w.inb(h.t[0] + dc, h.t[1] + dr) && w.route(h.t[0] + dc, h.t[1] + dr); if (rt && rt.group === "searoutes") lanes.add(rt.name); }
      out.push(lanes.size ? `${U.esc(tb.name)} lies on ${[...lanes].slice(0, 2).map(U.esc).join(" and ")} ${T("data")}.` : `No named sea lane reaches ${U.esc(tb.name)} ${T("data")}: ships on regular runs will not call there, which is why the plan hires its own boat.`);
      const rel = P.religions.find(r => r && r.center === tb.cell);
      if (rel) out.push(`${U.esc(tb.name)} is the seat of the ${U.esc(rel.name)} (${rel.type.toLowerCase()}) ${T("data")}.`);
      if (tb.capital) out.push(`It is the capital of ${U.esc(P.states[tb.state]?.fullName)}: markets, a temple${tb.walls ? ", walls" : ""} ${T("data")}.`);
      const stance = tb.state ? this.know.rel(this.tv.homeState, tb.state) : null;
      if (stance) out.push(`${U.esc(P.states[tb.state].name)} stands to your people as “${stance}” ${T("data")}.`);
    } else {
      const near = to.burg;
      if (near) out.push(`The plan stops at sea ${U.esc(to.name)}: by its own timing the boat's sailing hours run out about here ${T("mixed")}; ${U.esc(near.name)} (${U.esc(P.states[near.state]?.name || "unclaimed")}) gives a lee and lights ${T("data")}.`);
    }
    if (seg.nights?.length) out.push(`The plan anchors ${seg.nights.length} times on the way (shown as small gold marks on the course) ${T("mixed")}.`);
    const hz = new Map();
    for (const [c, r] of seg.chain) for (const n of w.near(c, r, 3)) if (n.kind === "marker" && /pirate|monster/.test(n.o.type)) hz.set(n.o.i, n.o);
    if (hz.size) out.push(`Hazards on the course: ${[...hz.values()].map(m => U.esc(m.name)).join(", ")} ${T("data")}.`);
    const crossed = new Set(), avoided = new Set();
    for (const [c, r] of seg.chain) for (const z of w.zonesOfCell(w.cell(c, r))) crossed.add(z.name);
    for (const z of P.zones) {
      if (crossed.has(z.name)) continue;
      const zc = z.cells[0];
      if (zc != null && seg.chain.some(([c, r], k) => k % 8 === 0 && Math.hypot(w.C.cx[zc] - w.centre(c, r)[0], w.C.cy[zc] - w.centre(c, r)[1]) < 40)) avoided.add(z.name);
    }
    if (crossed.size) out.push(`The course crosses the ${[...crossed].map(U.esc).join(", ")} ${T("data")}.`);
    if (avoided.size) out.push(`It keeps clear of the ${[...avoided].map(U.esc).join(", ")} ${T("data")}.`);
    const others = P.burgs.filter(x => x && x.port && x !== fb && x !== tb && seg.chain.some(([c, r], k) => k % 6 === 0 && Math.hypot(x.t[0] - c, x.t[1] - r) < 20)).slice(0, 4);
    if (others.length) out.push(`Other harbours near the way, if you choose differently: ${others.map(x => U.esc(x.name)).join(", ")} ${T("data")}.`);
    return out;
  },
});

// rumours become leads when the thing is near enough to follow
AZ.Know.prototype.rumourLead = function (g, f, d) {
  if (!g || d > 1500) return;
  const key = f.kind === "marker" ? `m${this.P.markers.find(m => m.name === f.name && m.t === f.t)?.i ?? f.name}` : `r:${f.kind}:${f.name}`;
  g.addLead({ key, name: f.kind === "war" ? `${f.name} (${f.a} against ${f.d})` : f.name, type: f.type || f.kind, t: f.t, from: "rumour" });
};

// ---------------------------------------------------------------------------------------------
// Screens: HUD, minimap, world map, journal (with the route and its reasons), help, menu, title.
// ---------------------------------------------------------------------------------------------
Object.assign(AZ.Game.prototype, {

  hud() {
    const s = this.s, w = this.w, U = AZ.U, el = this.ui.el, cell = w.cell(s.c, s.r);
    const b = this.burgHere(), land = w.isLand(s.c, s.r);
    const place = b ? (w.burgAt.get(w.idx(s.c, s.r)) ? b.name : `${b.name} harbour`) : land ? (w.C.province[cell] ? w.P.provinces[w.C.province[cell]].name : w.C.state[cell] ? w.P.states[w.C.state[cell]].name : "Neutral lands") : w.waterName(s.c, s.r);
    const terr = land ? `${w.P.biomes[w.C.biome[cell]].name} · ${w.heightStr(w.h(s.c, s.r))}` : `depth ${w.heightStr(w.h(s.c, s.r), true)}`;
    const lat = this.lat(), light = AZ.Clock.light(s.clock, lat), season = AZ.Clock.season(lat, s.clock), today = AZ.Clock.today(w.tempC(s.c, s.r), lat, s.clock, !land);
    const wx = this.weather();
    const conds = Object.keys(s.cond).map(k => AZ.COND[k]?.label || k).join(", ");
    el.loc.innerHTML = `<div class="big">${U.esc(place)}</div><div>${U.esc(terr)} · ${w.temp(today)} · ${wx.label}</div><div>${AZ.Clock.fmt(s.clock)} · ${light.phase} · ${season}</div>` +
      `<div class="dim">🟡 ${U.rn(s.purse, 2)} · food ${s.sup.food}${this.goodsCount() ? ` · goods ${this.goodsCount()}` : ""} · awake ${Math.round(s.awake || 0)} h${conds ? ` · <span class="late">${conds}</span>` : ""}</div>`;
    let trip = "";
    const here = this.cpHere(), next = this.cpNext();
    if (this.jr) {
      if (here) {
        const pend = this.pendingActs(here.place.burg && here.place.at ? here.place.burg : null);
        trip += `<div class="hook">At checkpoint ${here.i}: ${U.esc(here.place.name)}</div>` + (pend.length ? `<div>★ ${pend.map(a => U.esc(a.label)).join("; ")}</div>` : "");
      }
      if (next) {
        const t = next.tile, dd = this.know.dirDist(s.c, s.r, t);
        trip += `<div class="hook">Next ${next.i}/${this.jr.cps.length - 1}: ${U.esc(next.place.name)} <span class="arrow">${U.arrow(t[0] - s.c, t[1] - s.r)}</span> ${U.num(dd.mi)} mi</div>` +
          `<div class="dim">par ${AZ.Clock.fmt(next.parArrive)} (${s.clock > next.parArrive ? `${AZ.Clock.span(s.clock - next.parArrive)} past` : `${AZ.Clock.span(next.parArrive - s.clock)} left`})${next.legIn ? ` · plan: ${U.esc(next.legIn.transport)}` : ""}</div>`;
      } else if (s.done) trip += `<div class="hook">${U.esc(this.jr.J.name)}: complete</div>`;
    }
    const v = s.voyage, bo = s.vessel;
    if (v) trip += `<div>${s.aboard ? "Aboard" : "Booked on"} ${U.esc(v.ship)} (${v.role}) → ${U.esc(v.stops[v.leg]?.name || "")}${v.state === "port" ? ` · sails ${AZ.Clock.fmt(v.departAt)}` : ""}${s.voyPause ? " · ⏸ holding (P)" : this.fast ? " · ⏩ (F)" : ""}</div>`;
    else if (bo) trip += `<div>${s.aboard ? "Aboard" : "Ashore; your boat waits"}: ${U.esc(bo.kind)} (${bo.mode})${bo.crew ? ` · crew ${bo.crew}, morale ${Math.round(bo.morale)}${bo.strikes ? `, strikes ${bo.strikes}/3` : ""}` : " · no crew"}${s.auto ? ' · <b class="hook">autopilot</b>' : ""}</div>`;
    else if (s.auto) trip += `<div class="dim">walking to the waypoint · F to stop</div>`;
    el.trip.innerHTML = trip + this.threadLine();
    const lens = AZ.LENSES[this.lensIdx];

  threadLine() {

  },
  journal() {
    const s = this.s, U = AZ.U, jr = this.jr, tv = this.tv, w = this.w;
    const cpRows = jr ? jr.cps.map(cp => {
      const rec = s.cpRec[cp.i] || {};

      const d = rec.arrive != null ? rec.arrive - cp.parArrive : null;

    const cnt = (k, list) => `${s.seen[k].length} of ${w.P[list].filter(x => x && !x.removed).length - (list === "states" || list === "cultures" || list === "religions" ? 1 : 0)}`;
    const v = s.vessel;

      <h3>The traveller ${AZ.T("new")}</h3><p><b>${U.esc(tv.name)}</b>, ${tv.age}, ${U.esc(tv.trade)} (${U.esc(tv.kindLabel || "")}). ${U.cap(U.esc(tv.why))}. ${w.P.cultures[tv.culture].name}; faith: ${w.P.religions[tv.faith]?.name}. Carries ${U.esc(tv.token)}.</p>
      <h3>Purse, stores, condition, standing</h3><p>🟡 ${U.rn(s.purse, 2)} · food ${s.sup.food} rations · goods: ${Object.entries(s.goods || {}).filter(([, n]) => n > 0).map(([g, n]) => `${n} ${U.esc(this.know.good(g).toLowerCase())}`).join(", ") || "none"} · ${Object.keys(s.cond).map(k => AZ.COND[k]?.label || k).join(", ") || "well"}${v ? ` · ${U.esc(v.kind)} (${v.mode}), crew ${v.crew}, morale ${Math.round(v.morale)}` : ""} · ${[...Object.entries(s.stand.f).map(([i, n]) => `${U.esc(w.P.religions[i]?.name)} ${n > 0 ? "+" : ""}${n}`), ...Object.entries(s.stand.s).map(([i, n]) => `${U.esc(w.P.states[i]?.name)} ${n > 0 ? "+" : ""}${n}`)].join(" · ") || "no standing earned or lost yet"} ${AZ.T("mixed")}</p>
      ${jr ? `<h3>The route: checkpoints, par and the reasons ${AZ.T("mixed")}</h3><p class="dim">The map's journey is the plan: par times from dawn on Day 1 with each mode's speed and hours a day. It is not a rule: take another ship, hire a boat, walk, skip a checkpoint. Reaching ${U.esc(jr.dest.name)} ends the pilgrimage.</p>
      <table class="plan"><tr><th>#</th><th>Checkpoint and leg</th><th>Par</th><th>Record</th><th>Against par</th><th>The plan's tasks</th></tr>${cpRows}</table>` : ""}
      <h3>Side stories</h3>${s.threads.length ? s.threads.map(th => `<div class="${th.done ? "dim" : "side"}">◆ ${U.esc(th.title)}: ${th.done ? th.outcome : U.esc(th.steps[th.phase].text)}${th.deadline && !th.done ? ` (by ${AZ.Clock.fmt(th.deadline)})` : ""}</div>`).join("") : '<p class="dim">None yet. Look at notice boards in towns.</p>'}
      <h3>Leads (click to set a waypoint)</h3><div class="leads">${leads.map(l => `<div class="lead side" data-c="${l.t[0]}" data-r="${l.t[1]}">${U.esc(l.name)} (${U.esc(l.type || "")}, ${l.from}) · ${this.know.dirDist(s.c, s.r, l.t).txt}</div>`).join("") || '<p class="dim">Nothing yet: rumours, sightings and libraries add leads.</p>'}</div>
      ${this.newsHtml ? this.newsHtml() : ""}${this.timetableHtml ? this.timetableHtml() : ""}
      <h3>Seen so far</h3><p>States ${cnt("st", "states")} · cultures ${cnt("cu", "cultures")} · faiths ${cnt("re", "religions")} · biomes ${s.seen.bi.length} · towns ${s.seen.b.length} · marked places ${s.seen.m.length} of ${w.P.markers.length} · forces ${s.seen.u.length} · zones ${s.seen.z.length} of ${w.P.zones.length}</p>
