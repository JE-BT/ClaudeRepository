      opts.push({ label: `Market: food 🟡 ${P.ration(w, b)} a day; goods to buy and sell`, act: "market" });
      opts.push({ label: `Inn: a room until morning (🟡 ${P.inn(w, b)})${this.shipWarn()}`, act: "inn", disabled: s.purse < P.inn(w, b) });
      opts.push({ label: `Give alms at the ${b.temple ? "temple" : "shrine"} (🟡 ${P.alms(w, b)})`, act: "alms", disabled: s.purse < P.alms(w, b) });
      opts.push({ label: "Notice board: work and errands", act: "board", cls: "side" });
      // marked places in or beside the town can be visited from the town itself
      for (const n of w.near(b.t[0], b.t[1], 2)) if (n.kind === "marker") opts.push({ label: `Visit the ${U.esc(n.o.name)} (${U.esc(n.o.type)}, ${n.d < 0.5 ? "in town" : "just outside"})`, cls: "side", act: { go: () => this.events.marker(n.o, false) } });
      for (const p of people) if (p.role !== "Notice board") opts.push({ label: `${p.role}${p.name ? `: ${U.esc(p.name)}` : ""}`, act: p });
      if (s.cond.fever || s.cond.gravely) opts.push({ label: `Ask the ${b.temple ? "priest" : "shrine-keeper"} to treat your fever (${this.healCost(b) ? "🟡 " + this.healCost(b) : "free"})`, act: "heal", disabled: s.purse < this.healCost(b) });
      if (s.cond.damaged && b.port && s.vessel) opts.push({ label: `Have the boat repaired (🟡 ${P.repair(w, b)}, 12 h)`, act: "repair", disabled: s.purse < P.repair(w, b) });
      opts.push({ label: "Leave", act: "leave" });
      const k = await this.ui.choose(`<b>${U.esc(b.name)}</b> · ${AZ.Clock.fmt(s.clock)} · 🟡 ${U.rn(s.purse, 2)} · food ${s.sup.food} rations${this.voyageLine()}`, opts, { cancel: opts.length - 1 });
      const o = opts[k];
      if (o.act === "leave") break;
      if (typeof o.act === "string" && o.act.startsWith("do:")) o.act = { "do:alms": "alms", "do:rest": "inn", "do:book": "harbour" }[o.act] || o.act;
      if (typeof o.act === "string" && o.act.startsWith("do:")) { await this.doActInTown(o.act.slice(3), b); continue; }
      if (o.act === "thread") { await this.completeStep(o.th, b); continue; }
      if (o.act === "harbour") { await this.harbour(b); if (s.aboard) break; continue; }
      if (o.act === "market") { await this.market(b); continue; }
      if (o.act === "board") { await this.noticeBoard(b); continue; }
      if (o.act === "inn") {
        const t0 = s.clock;
        const out = this.events.fx({ coin: -P.inn(w, b), time: Math.max(1, AZ.Clock.nextDawn(s.clock, this.lat()) - s.clock), cure: ["hurt"] });
        this.slept();
        const act = this.doAct("rest", b);
        await this.ui.say(`You sleep in ${U.esc(b.name)}. ${AZ.Clock.span(s.clock - t0)} pass ${T("mixed")}.${out}${act ? ` <span class="hook">★ ${U.esc(act.label)}</span>` : ""}`); continue;
      }
      if (o.act === "alms") {
        const out = this.events.fx({ coin: -P.alms(w, b), time: 2, stand: [["f", w.C.religion[b.cell], 1]] }, `Alms given in ${U.esc(b.name)}.`);
        const act = this.doAct("alms", b);
        await this.ui.say(`You give alms at the ${b.temple ? "temple" : "shrine"} of the ${U.esc(w.P.religions[w.C.religion[b.cell]].name)}.${out}${act ? ` <span class="hook">★ ${U.esc(act.label)}</span>` : ""}`); continue;
      }
      if (o.act === "heal") { const out = this.events.fx({ coin: -this.healCost(b), time: 6, cure: ["fever", "gravely"] }, `Treated for fever in ${U.esc(b.name)}.`); await this.ui.say(`Bitter tea, cool cloths and a long prayer. By evening the fever breaks.${out}`); continue; }
      if (o.act === "repair") { const out = this.events.fx({ coin: -P.repair(w, b), time: 12, cure: ["damaged"] }, `Repairs in ${U.esc(b.name)}.`); await this.ui.say(`Shipwrights work through the day.${out}`); continue; }
      if (o.act && o.act.go) { await o.act.go(); if (s.aboard) break; continue; }
      const p = o.act;
      if (p.cost && !charged.has(p.role)) { charged.add(p.role); const h = p.cost(); if (h) s.clock += h; }
      await this.ui.say(p.talk(), `${p.role}${p.name ? " · " + U.esc(p.name) : ""}`);
      this.dirty = true;
    }
  }
  async doActInTown(id, b) {
    if (id === "book") return this.harbour(b);
    if (id === "rest") return this.ui.say("Take a room at the inn for the night: that is the rest the plan has in mind.");
    if (id === "alms") return this.ui.say("Give alms at the temple: that is what the plan has in mind.");
    const act = this.doAct(id, b);
    if (act) await this.ui.say(`<span class="hook">★ ${AZ.U.esc(act.label)}</span>`);
  }
  async rest() {
    const s = this.s, U = AZ.U, w = this.w;
    if (this.riding()) return this.shipTalk();
    const sick = s.cond.fever || s.cond.hurt;
    const atSea = s.aboard && !w.isLand(s.c, s.r);
    const opts = [{ label: atSea ? "Anchor until dawn" : "Camp until dawn" }, { label: "Wait 1 hour" }, { label: "Wait 3 hours" }, { label: "Wait 6 hours" }, { label: "Two days, to recover", disabled: !sick }, { label: "Never mind" }];
    const k = await this.ui.choose(atSea ? "Heave to or anchor?" : "Make camp or wait?", opts, { cancel: 5 });
    if (k === 5) return;
    const t0 = s.clock;
    if (k === 4) { this.events.fx({ time: 48, cure: ["fever", "hurt"] }, "Rested two days."); this.ui.toast("Two days' rest. You feel yourself again."); return; }
    if (k === 0) {
      s.clock = AZ.Clock.nextDawn(s.clock, this.lat());
      if (s.vessel) { s.vessel.anchored = true; s.vessel.morale = Math.min(100, (s.vessel.morale || 70) + 4); s.vessel.nightKey = Math.floor(s.clock / 24); }
      const act = this.doAct("anchor");
      if (act) this.ui.toast(`<span class="hook">★ ${U.esc(act.label)}</span>`, "gold");
    } else s.clock += [0, 1, 3, 6][k];
    this.ui.toast(`${AZ.Clock.span(s.clock - t0)} pass. ${AZ.Clock.fmt(s.clock)}.`);
    this.dirty = true;
  }
  cycleLens(d = 1) {
    this.lensIdx = (this.lensIdx + d + AZ.LENSES.length) % AZ.LENSES.length;
    this.ui.toast(`Lens: <b>${AZ.LENSES[this.lensIdx].name}</b>`);
    this.dirty = true;
  }
  toggleInspect() { this.inspectOn = !this.inspectOn; this.ui.el.panel.classList.toggle("on", this.inspectOn); this.dirty = true; }
  started() { this._steps = 0; this.dirty = true; this.s.region = ""; this.afterStep(); }
  // ------------------------------------------------------------------ loop
  frame(now) {
    if (!this.s) return;
    const s = this.s;
    if (this.anim && now - this.anim.t0 >= this.anim.dur) this.anim = null;
    if (!this.anim && !this.ui.busy()) {
      this.tick();
      if (this.ui.busy()) { /* a crew call or a departure opened a window */ }
      else if (this.riding() && s.voyage.state === "sea" && !s.voyPause) this.voyageStep();
      else if (s.auto) { const d = this.autoDir(); if (d) this.tryMove(d); else { this.setAuto(false); s.autoPath = null; } }
      else if (this.held.length) this.tryMove(this.held[this.held.length - 1]);
    }
    let cx = s.c, cy = s.r;
    if (this.anim) { const t = Math.min(1, (now - this.anim.t0) / this.anim.dur); cx = this.anim.from[0] + (this.anim.to[0] - this.anim.from[0]) * t; cy = this.anim.from[1] + (this.anim.to[1] - this.anim.from[1]) * t; }
    const frame = this.anim ? 1 + (Math.floor(now / 120) % 2) : 0;
    const sprites = [];
    if (this.sim) for (const r of this.sim.regs) if (r.a > 200 && Math.abs(r.t[0] - s.c) < 45 && Math.abs(r.t[1] - s.r) < 28) sprites.push({ img: this.ren.art.unit({ state: r.state, naval: false }), c: r.t[0], r: r.t[1] });
    if (s.vessel && !(s.aboard && !this.riding())) sprites.push({ img: this.ren.art.vessel(s.vessel.cls === "ship" ? "ship" : "boat", "left"), c: s.vessel.c, r: s.vessel.r });
    if (s.voyage && !this.riding() && s.voyage.state === "port" && s.voyage.at) sprites.push({ img: this.ren.art.vessel(s.voyage.mode === "land" ? "wagon" : "ship", "left"), c: s.voyage.at[0], r: s.voyage.at[1] });
    const me = this.riding() && s.voyage.mode === "land" ? this.ren.art.vessel("wagon", s.dir === "left" ? "left" : "right") : s.aboard ? this.ren.art.vessel(this.riding() ? "ship" : s.vessel?.cls === "ship" ? "ship" : "boat", s.dir === "left" ? "left" : "right")
      : this.ren.art.walker(s.dir, frame, this.tv.pal);
    sprites.push({ img: me, c: cx, r: cy });
    const cp = this.cpNext(), leg = cp && cp.legIn;
    this.ren.draw({ camX: cx + 0.5, camY: cy + 0.5, sprites, lens: AZ.LENSES[this.lensIdx], light: AZ.Clock.light(s.clock, this.lat()),
      course: s.voyage && s.voyage.course ? s.voyage.course : leg ? leg.chain : null, goal: cp ? cp.tile : null, waypoint: s.waypoint, time: now,
      weather: this.weather().kind, nights: leg && leg.nights ? leg.nights.map(n => n.tile) : null, path: s.auto && !s.voyage ? s.autoPath : null });
    if (this.dirty) { this.dirty = false; this.hud(); }
    if (now - (this._pf || 0) > 60) { this._pf = now; this.ren.prefetch(cx + 0.5, cy + 0.5); }
  }
};

// ---------------------------------------------------------------------------------------------
// Seasons, travellers and events.
//   Seasons: the plan clock carries a day of the year; each latitude gets its own season, day
//   length and a seasonal swing around the map's annual mean temperature (mixed).
//   Travellers: kinds are found in the data (stops, faith seats, wars, trade, zones, libraries);
//   the player picks one or lets chance pick, and the details are generated.
//   Events: markers and zones have scenes with choices; choices cost time and coin, change
//   standing with faiths and states, leave conditions, and open side stories (teal).
// ---------------------------------------------------------------------------------------------
Object.assign(AZ.Clock, {
  doyAt(t) { return (((this.doy0 + Math.floor(t / 24)) % 365) + 365) % 365; },
  season(lat, t) {
    const doy = this.doyAt(t);
    if (Math.abs(lat) < 23.5) {
      const northWet = doy >= 120 && doy < 300;
      return (lat >= 0) === northWet ? "wet season" : "dry season";
    }
    const d = lat >= 0 ? doy : (doy + 186) % 365; // southern seasons: autumn from the March equinox
    return d >= 80 && d < 172 ? "spring" : d >= 172 && d < 266 ? "summer" : d >= 266 && d < 355 ? "autumn" : "winter";
  },
  // the map's temperature is an annual mean; the swing grows with latitude and shrinks at sea
  today(meanC, lat, t, sea) {
    const doy = this.doyAt(t), peak = lat >= 0 ? 200 : 17;
    const amp = AZ.U.clamp(Math.abs(lat) * 0.3, 1, 18) * (sea ? 0.55 : 1);
    return meanC + amp * Math.cos((2 * Math.PI * (doy - peak)) / 365);
  },
  dateStr(t) { return `day ${this.doyAt(t) + 1} of the year`; },
});

// ------------------------------------------------------------------ traveller kinds
AZ.travellerKinds = function (w, jr) {
  const P = w.P, C = w.C, kinds = [];
  if (!jr) return [{ id: "wanderer", label: "Wanderer", blurb: "No journey on this map; you go where you please.", wt: 1, culture: C.culture[P.burgs.find(b => b && b.capital).cell], faith: 0, home: P.burgs.find(b => b && b.capital) }];
  const first = jr.segs[0], last = jr.segs[jr.segs.length - 1];
  const oB = jr.origin.burg, dB = jr.dest.burg;
  const oCul = C.culture[first.from], dCul = C.culture[last.to], oRel = C.religion[first.from], dRel = C.religion[last.to];
  const relName = i => P.religions[i]?.name || "no faith";
  const seatOf = r => P.burgs.find(b => b && b.cell === P.religions[r]?.center);
  const dSeat = seatOf(dRel);
  const homesIn = (state, cul) => P.burgs.filter(b => b && b.state === state && (cul == null || b.culture === cul));
  const stops = jr.segs.map(s => s.place.burg).filter(Boolean).filter((b, i, a) => a.indexOf(b) === i && b !== oB && b !== dB);
  kinds.push({ id: "returning", label: `Returning ${P.cultures[dCul].name}`, wt: 4, culture: dCul, faith: dRel, homes: homesIn(dB.state, dCul).length ? homesIn(dB.state, dCul) : [dB],
    blurb: `Born to the ${relName(dRel)} in ${P.states[dB.state]?.name}; going home.`,
    trades: ["deckhand", "clerk of a trading house", "released hostage of an old treaty", "journeyman scribe", "widowed net-mender"],
    why: h => `born to the ${relName(dRel)} among the ${P.cultures[dCul].name} of ${P.states[h.state]?.name || "the far shore"}, you are going home to make the pilgrimage you were promised as a child`,
    thread: h => (h !== dB ? { title: `Home to ${h.name}`, steps: [{ text: `Visit your family in ${h.name}`, goal: { burg: h.i, role: "Townsfolk" }, reward: { coin: 5, stand: [["f", dRel, 1]] } }] }
      : { title: "A promise kept", steps: [{ text: `Pray at the temple of ${dB.name}`, goal: { burg: dB.i, role: "Priest" }, reward: { stand: [["f", dRel, 2]] } }] }), purse: 12 });
  if (dRel !== oRel) kinds.push({ id: "convert", label: `${P.cultures[oCul].name} convert`, wt: 3.5, culture: oCul, faith: dRel, homes: [oB], family: oRel,
    blurb: `Raised in the ${relName(oRel)} of ${oB.name}; took the ${relName(dRel)} as an adult.`,
    trades: ["chandler", "harbour clerk", "schoolmaster", "cooper", "temple sweeper"],
    why: () => `raised in the ${relName(oRel)} of ${oB.name}, you took the ${relName(dRel)} as an adult; your family has not forgiven it`,
    thread: () => (dSeat && dSeat !== oB ? { title: "A letter home", steps: [{ text: `Have the priests at ${dSeat.name}, seat of your new faith, bless a letter to your family`, goal: { burg: dSeat.i, role: "Priest" }, reward: { stand: [["f", dRel, 1]], coin: -1 } }] } : null), purse: 10 });
  for (const b of stops) {
    const rel = C.religion[b.cell], cul = C.culture[b.cell];
    if (rel === dRel && cul === dCul) continue;
    kinds.push({ id: `stranger:${b.i}`, label: `Stranger from ${b.name}`, wt: 2.5 / stops.length, culture: cul, faith: rel, homes: [b],
      blurb: `${P.cultures[cul].name}, of the ${relName(rel)}; an errand to ${dB.name}.`,
      trades: ["envoy's secretary", "travelling physician", "apprentice cartographer", "copyist", "ship's cook"],
      why: h => `you keep the ${relName(rel)} of ${h.name}, and you travel to ${dB.name} on an errand you have told no one`,
      thread: h => (dSeat ? { title: `A message for ${dSeat.name}`, steps: [{ text: `Carry a sealed message from ${h.name} to the clergy of ${dSeat.name}`, goal: { burg: dSeat.i, role: "Priest" }, reward: { coin: 6 } }] } : null), purse: 8 });
  }
  const warStates = [...new Set([oB, ...stops, dB].map(b => b.state))].filter(st => (P.states[st]?.campaigns || []).some(c => c.end == null));
  for (const st of warStates) {
    const S = P.states[st], war = S.campaigns.find(c => c.end == null), cap = P.burgs[S.capital];
    const regs = P.military.filter(u => u.state === st && !u.naval);
    kinds.push({ id: `soldier:${st}`, label: `Soldier of ${S.name}`, wt: 1.5, culture: cap.culture, faith: C.religion[cap.cell], homes: homesIn(st, cap.culture).slice(0, 12), homeState: st,
      blurb: `On leave from the ${war.name} (since ${war.start}).`,
      trades: ["archer", "cavalry groom", "sapper", "quartermaster's clerk", "infantry sergeant"],
      why: () => `you serve ${S.fullName} in the ${war.name}, which began in ${war.start}; your leave is a pilgrimage, or so your papers say`,
      thread: () => (regs.length ? { title: "Papers to sign", steps: [{ text: `Report to the ${regs[0].name}`, goal: { unit: `${st}:${regs[0].i}` }, reward: { coin: 5, stand: [["s", st, 1]] } }] } : null), purse: 15 });
  }
  if (oB.state && dB.state && oB.state !== dB.state) {
    const rel = P.states[oB.state].diplomacy?.[dB.state] || "Unknown";
    kinds.push({ id: "envoy", label: `Envoy of ${P.states[oB.state].name}`, wt: 1.2, culture: oCul, faith: oRel, homes: [oB],
      blurb: `Letters for ${P.states[dB.state].name}; the two stand as “${rel}”.`,
      trades: ["junior envoy", "herald", "secretary to the chancery"],
      why: () => `you carry sealed letters from ${P.states[oB.state].fullName} to ${P.states[dB.state].fullName}, which it regards as “${rel}”; pilgrimage is your cover and your comfort`,
      thread: () => ({ title: "Sealed letters", steps: [{ text: `Present the letters to the watch in ${dB.name}`, goal: { burg: dB.i, role: "Captain of the watch" }, reward: { coin: 10, stand: [["s", dB.state, 2]] } }] }), purse: 30 });
  }
  const sells = P.trade.sell[oB.i] || {}, buys = P.trade.buy[dB.i] || {};
  const portable = g => { const x = P.goods.find(y => y.i === +g); return x && !/ship|boat|house|building/i.test(x.name); };
  const val = g => P.goods.find(y => y.i === +g)?.value || 0;
  const cargo = Object.keys(sells).filter(g => buys[g] && portable(g)).sort((a, b) => val(b) - val(a))[0] || Object.keys(sells).filter(portable).sort((a, b) => val(b) - val(a))[0];
  if (cargo) {
    const gName = P.goods.find(g => g.i === +cargo)?.name || "goods";
    kinds.push({ id: "factor", label: "Trading factor", wt: 1.2, culture: oCul, faith: oRel, homes: [oB], cargo: +cargo,
      blurb: `${gName} from ${oB.name} for the market of ${dB.name}.`,
      trades: ["factor of a trading house", "supercargo", "merchant's son"],
      why: () => `you travel with a consignment of ${gName.toLowerCase()}, which ${oB.name} sells and ${buys[cargo] ? `${dB.name} buys` : "you hope to sell"}; the pilgrimage is real, and so is the profit`,
      thread: () => ({ title: `${gName} for ${dB.name}`, steps: [{ text: `Deliver the ${gName.toLowerCase()} to the merchant in ${dB.name}`, goal: { burg: dB.i, role: "Merchant" }, reward: { coin: 15 }, needs: "cargo" }] }), purse: 20 });
  }
  if (oB.port && (P.military.some(u => u.naval && u.state === oB.state) || (oB.production || {})[P.goods.find(g => /ship/i.test(g.name))?.i])) {
    kinds.push({ id: "shipmaster", label: `Shipmaster of ${oB.name}`, wt: 1, culture: oCul, faith: oRel, homes: [oB], boat: true, purseF: 0.6,
      blurb: `You own a sailing boat in ${oB.name}; you need only a crew and stores.`,
      trades: ["shipmaster", "coasting skipper", "boat-owner"],
      why: () => `you own a sailing boat in ${oB.name} and have sailed these waters for years; this time the cargo is yourself`,
      thread: null, purse: 12 });
  }
  const lib = P.markers.find(m => m.type === "libraries"), stat = P.markers.find(m => m.type === "statues");
  if (lib) {
    const near = w.near(lib.t[0], lib.t[1], 80).find(n => n.kind === "burg");
    const home = near ? near.o : oB;
    kinds.push({ id: "scholar", label: `Scholar of the ${lib.name}`, wt: 1, culture: home.culture, faith: C.religion[home.cell], homes: [home],
      blurb: `Sent to copy the rites of the ${relName(dRel)}.`,
      trades: ["copyist", "archivist", "student of tongues"],
      why: () => `the ${lib.name} sent you to copy the rites of the ${relName(dRel)}; you will be expected to bring back more than that`,
      thread: () => (stat ? { title: "An inscription no one can read", steps: [
        { text: `Copy the inscription on the ${stat.name}`, goal: { marker: stat.i }, reward: { flag: "inscription" } },
        { text: `Bring the copy to the ${lib.name}`, goal: { marker: lib.i }, reward: { coin: 8, reveal: 160 } }] } : null), purse: 10 });
  }
  for (const z of P.zones) {
    if (!/Disease|Disaster|Tsunami|Flood|Invasion|Rebels|Eruption/.test(z.type)) continue;
    const home = P.burgs.find(b => b && z.cells.includes(b.cell));
    if (!home || Math.hypot(home.t[0] - oB.t[0], home.t[1] - oB.t[1]) * w.miles > 1200) continue;
    kinds.push({ id: `fugitive:${z.i}`, label: `Fled the ${z.name}`, wt: 0.8, culture: home.culture, faith: C.religion[home.cell], homes: [home],
      blurb: `From ${home.name}; you left with little.`,
      trades: ["fisher", "weaver", "gravedigger", "baker's apprentice"],
      why: h => `you fled ${h.name} when the ${z.name} came, and you have been walking towards something ever since`,
      thread: h => ({ title: "Word home", steps: [{ text: `Send word to ${h.name} from a harbour far away (any harbourmaster over 1,000 miles from home)`, goal: { role: "Harbourmaster", farFrom: h.t, mi: 1000 }, reward: { stand: [["f", C.religion[h.cell], 1]] } }] }), purse: 3 });
  }
  return kinds;
};

// what the plan would cost at local prices: fares, boat hire and wages, food for everyone, rooms
AZ.planCost = function (w, jr) {
  if (!jr || !AZ.Prices) return 20;
  let cost = 0;
  for (const seg of jr.segs) {
    const from = w.P.burgs[w.C.burg[seg.from]] || jr.origin.burg, days = (seg.planEnd - seg.planStart) / 24;
    if (!seg.moving) cost += Math.ceil(days) * (AZ.Prices.inn(w, from) + AZ.Prices.ration(w, from));
    else if (AZ.vesselClass(seg.transport) === "ship") cost += AZ.Prices.fare(w, from, seg.miles) + days * AZ.Prices.ration(w, from);
    else cost += days * (3 * (AZ.Prices.wage(w, from) + AZ.Prices.ration(w, from)) + AZ.Prices.hire(w, from) + AZ.Prices.ration(w, from));
  }
  return cost * 1.15;
};
AZ.makeTraveller = function (w, jr, seed, kindId) {
  const U = AZ.U, rnd = U.rng(seed), P = w.P;
  const kinds = AZ.travellerKinds(w, jr);
  let K = kinds.find(k => k.id === kindId);
  if (!K) {
    let roll = rnd() * kinds.reduce((a, k) => a + k.wt, 0); K = kinds[0];
    for (const k of kinds) if ((roll -= k.wt) <= 0) { K = k; break; }
  } else rnd();
  const home = rnd.pick(K.homes && K.homes.length ? K.homes : [jr ? jr.origin.burg : P.burgs[1]]);
  const cul = P.cultures[K.culture] || P.cultures[1], rel = P.religions[K.faith];
  const name = w.names.get(cul.base, rnd);
  const age = 18 + Math.floor(rnd() * 44);
  const deity = ((rel && rel.deity) || "").split(",")[0];
  const skin = rnd.pick(["rgb(240,204,170)", "rgb(214,170,130)", "rgb(176,124,88)", "rgb(124,84,58)"]);
  const cloak = U.shade(U.hex2rgb(cul.color || "#806040"), -0.35);
  return {
    seed, kind: K.id, kindLabel: K.label, name, age, culture: K.culture, faith: K.faith, home: home?.i, homeState: K.homeState ?? home?.state ?? 0,
    trade: rnd.pick(K.trades || ["traveller"]), why: K.why ? K.why(home) : K.blurb, token: deity ? `a small icon of ${deity}` : "a pilgrim's token",
    purse: Math.round(AZ.planCost(w, jr) * (K.purseF ?? ({ returning: 1, convert: 1, envoy: 1.5, factor: 1.2, scholar: 0.9 }[K.id] ?? (/^stranger/.test(K.id) ? 0.9 : /^soldier/.test(K.id) ? 0.8 : /^fugitive/.test(K.id) ? 0.45 : 1)))),
    thread: K.thread ? K.thread(home) : null, cargo: K.cargo ?? null, boat: !!K.boat, food: 3, kindId: K.id,
    pal: { cloak: U.css(cloak), cloakDark: U.css(U.shade(cloak, -0.35)), skin, belt: "rgb(150,110,60)" },
  };
};

// ------------------------------------------------------------------ events
AZ.Events = class {
  constructor(g) { this.g = g; }
  get w() { return this.g.w; }
  get s() { return this.g.s; }
  rnd(key) { return AZ.U.rng(`${this.s.seed}:${key}`); }
  relByName(text) {
    const P = this.w.P;
    return P.religions.filter(r => r && r.i && text.includes(r.name)).sort((a, b) => b.name.length - a.name.length)[0] || null;
  }
  stateByPrefix(name) {
    const word = (name || "").split(" ")[0].toLowerCase();
    return this.w.P.states.filter(s => s && s.i && word.startsWith(s.name.toLowerCase().slice(0, Math.max(4, s.name.length - 1)))).sort((a, b) => b.name.length - a.name.length)[0] || null;
  }
  // effects ------------------------------------------------------------------------------
  fx(e, note) {
    const g = this.g, s = this.s, U = AZ.U, bits = [];
    if (!e) return "";
    if (e.time) { s.clock += e.time; bits.push(`${AZ.Clock.span(e.time)} pass`); }
    if (e.coin) { const before = s.purse; s.purse = U.rn(Math.max(0, s.purse + e.coin), 2); const d = U.rn(s.purse - before, 2); bits.push(`🟡 ${d >= 0 ? "+" : ""}${d}`); }
    for (const [k, id, n] of e.stand || []) {
      const tab = k === "f" ? s.stand.f : s.stand.s;
      tab[id] = (tab[id] || 0) + n;
      const nm = k === "f" ? this.w.P.religions[id]?.name : this.w.P.states[id]?.name;
      bits.push(`standing with ${nm} ${n > 0 ? "+" : ""}${n}`);
    }
    if (e.cond) { s.cond[e.cond] = true; bits.push(AZ.COND[e.cond].on); }
    for (const c of e.cure || []) if (s.cond[c]) { delete s.cond[c]; bits.push(AZ.COND[c].off); }
    if (e.flag) { s.flags[e.flag] = true; if (e.flag === "boarded" && s.goods && Object.keys(s.goods).length) { s.goods = {}; bits.push("your goods are taken"); } }
    if (e.unflag) delete s.flags[e.unflag];
    if (e.reveal) { const n = g.revealLeads(e.reveal); bits.push(`${n} new places entered in your journal`); }
    if (e.thread) g.startThread(e.thread);
    const out = bits.length ? ` <span class="dim">(${bits.join("; ")})</span>` : "";
    if (note) g.log(`${note}${out}`, "side");
    g.dirty = true;
    return out;
  }
  // triggers --------------------------------------------------------------------------------
  async onStep() {
    const g = this.g, s = this.s, w = this.w;
    if (g.ui.busy()) return;
    const cell = w.cell(s.c, s.r);
    for (const z of w.zonesOfCell(cell)) if (!s.done_z.includes(z.i)) { s.done_z.push(z.i); g.setAuto(false); await this.zone(z); return; }
    for (const n of w.near(s.c, s.r, 3)) {
      if (n.kind !== "marker") continue;
      const T = AZ.MARKERS[n.o.type];
      if (!T || !T.auto || s.done_m.includes(n.o.i)) continue;
      if (n.d > (T.radius ?? 2)) continue;
      if (T.sea && !s.aboard) continue;
      if (T.land && s.aboard) continue;
      s.done_m.push(n.o.i); g.setAuto(false);
      await this.marker(n.o, true);
      return;
    }
  }
  async marker(m, auto) {
    const g = this.g, U = AZ.U, T = AZ.MARKERS[m.type] || AZ.MARKERS._default;
    const head = `<b class="side">${U.esc(m.name)}</b> (${m.type}) ${AZ.T("data")}`;
    await g.threadsAt({ marker: m.i });
    const first = !this.s.done_m.includes(m.i);
    if (first) this.s.done_m.push(m.i);
    this.s.leads = this.s.leads.filter(i => i !== m.i);
    if (T.auto && !auto && !first) return g.ui.say(head + "<br>" + U.esc(m.note).replace(/\n/g, "<br>"));
    if (T.auto && T.sea && this.g.riding()) return this.captainDecides(m, head);
    await T.run(this, m, head);
  }
  async captainDecides(m, head) {
    const g = this.g, v = this.s.voyage, U = AZ.U, r = this.rnd(`cap${m.i}`)();
    let text, fx;
    if (r < 0.5) { text = `${U.esc(v.captain)} puts the helm over and keeps clear. Most of a day lost.`; fx = { time: 10 }; }
    else if (r < 0.8 || !/pirate/.test(m.type)) { text = `${U.esc(v.captain)} holds his course, and nothing comes of it.`; fx = null; }
    else { text = "Pirates board her at dusk. They take the passengers' purses as well as the cargo."; fx = { coin: -Math.min(this.s.purse, U.rn(this.s.purse * 0.4, 1)), time: 12, flag: "boarded" }; }
    const out = this.fx(fx, `${U.esc(m.name)}: the captain's choice.`);
    return g.ui.say(`${head}<br>You are a passenger; the captain decides. ${text}${out} ${AZ.T("mixed")}`);
  }
  async zone(z) { const T = AZ.ZONES[z.type] || AZ.ZONES._default; await T(this, z, `<b class="hook">${AZ.U.esc(z.name)}</b> (${z.type.toLowerCase()} zone) ${AZ.T("data")}`); }
  // a choice scene: options [{label, fx, text, if}]
  async scene(head, body, options, key) {
    const g = this.g, U = AZ.U;
    const opts = options.filter(o => o.if === undefined || o.if);
    const k = await g.ui.choose(`${head}<br>${body}`, opts.map(o => ({ label: o.label, disabled: o.disabled })), { cancel: opts.length - 1 });
    const o = opts[k];
    let text = typeof o.text === "function" ? o.text() : o.text;
    let eff = typeof o.fx === "function" ? o.fx() : o.fx;
    if (o.roll) { const r = this.rnd(`${key}:${k}`)(); const good = r < o.roll.p; text = good ? o.roll.ok : o.roll.bad; eff = good ? o.roll.okFx : o.roll.badFx; }
    const out = this.fx(eff, `${U.esc(head.replace(/<[^>]+>/g, "").replace(/ (data|mixed|new)$/, ""))}: ${U.esc(o.label)}.`);
    if (text) await g.ui.say(text + out + ` ${AZ.T("mixed")}`);
    return k;
  }
};

AZ.COND = {
  fever: { on: "you are fevered", off: "the fever breaks", slow: 1.3, label: "fevered" },
  hurt: { on: "you are hurt", off: "you are mended", slow: 1.2, label: "hurt" },
  damaged: { on: "the vessel is damaged", off: "the vessel is repaired", slow: 1.25, label: "vessel damaged" },
  gravely: { on: "you are gravely ill", off: "the illness passes", slow: 1.6, label: "gravely ill" },
  tired: { on: "you are tired", off: "you are rested", slow: 1.15, label: "tired" },
  exhausted: { on: "you are exhausted", off: "you are rested", slow: 1.4, label: "exhausted" },
};

// marker scenes (type -> {auto, radius, sea, land, run})
AZ.MARKERS = (() => {
  const U = AZ.U, esc = U.esc;
  const lore = (ev, m, head, extra = []) => ev.g.ui.say([head + "<br>" + esc(m.note).replace(/\n/g, "<br>"), ...extra]);
  const explore = (hours, label) => async (ev, m, head) => {
    const s = ev.s, r = ev.rnd(`m${m.i}`)();
    if (s.flags[`ex${m.i}`]) return ev.g.ui.say(head + "<br>You have already been through it.");
    const link = m.links?.find(l => /dungeon/.test(l));
    await ev.scene(head, esc(m.note.split("\n")[0]) + (link ? `<br><span class="dim">The map links this place to a One Page Dungeon: <a href="${esc(link)}" target="_blank" rel="noopener">open it</a> ${AZ.T("data")}</span>` : ""), [
      { label: `${label} (${hours} h)`, fx: () => (s.flags[`ex${m.i}`] = true) && (r < 0.35 ? { time: hours, flag: "relic", thread: { title: `A relic from the ${m.name}`, steps: [{ text: "Take the relic to a temple of your own faith", goal: { temple: s.tvFaith, role: "Priest" }, reward: { stand: [["f", s.tvFaith, 2]], unflag: "relic" } }] } } : r < 0.65 ? { time: hours, coin: 4 + Math.floor(r * 10) } : r < 0.85 ? { time: hours } : { time: hours + 6, cond: "hurt" }),
        text: () => (r < 0.35 ? "Deep inside you find something old and holy, wrapped in rotten cloth. It wants to be carried home." : r < 0.65 ? "Someone hid coins here and did not come back for them." : r < 0.85 ? "Dust, bones, and the feeling of being watched. Nothing to carry away." : "A floor gives way. You climb out bruised and slow.") },
      { label: "Leave it be", fx: null, text: "" }], `m${m.i}`);
  };
  const hazardSea = (label) => ({ auto: true, radius: 3, sea: true, run: async (ev, m, head) => {
    const s = ev.s, dir = AZ.U.compass(m.t[0] - s.c, m.t[1] - s.r);
    await ev.scene(head, `${label} off to the ${dir}.`, [
      { label: "Steer wide (about 8 hours lost)", fx: { time: 8 }, text: "The master puts the helm over and keeps the danger hull-down until dark." },
      { label: "Pay them off (🟡 8)", if: /pirate/.test(m.type), disabled: s.purse < 8, fx: { coin: -8, time: 1 }, text: "A boat comes over; coins go across; the black sails fall away." },
      { label: "Hold course", roll: { p: 0.55, ok: "Nothing comes of it. The crew talks of nothing else for a day.", okFx: null,
        bad: /pirate/.test(m.type) ? "They board at dusk and take what they like. The hull is holed in the struggle." : "Something huge rises under the bow. Timbers crack.", badFx: /pirate/.test(m.type) ? { coin: -Math.min(s.purse, 10), time: 12, cond: "damaged", flag: "boarded" } : { time: 6, cond: "damaged" } } }], `m${m.i}`);
  } });
  const hazardLand = (label, toll) => ({ auto: true, radius: 2, land: true, run: async (ev, m, head) => {
    const s = ev.s, soldier = /^soldier/.test(ev.g.tv.kind);
    await ev.scene(head, label, [
      { label: "Go round (about 6 hours)", fx: { time: 6 } , text: "You take the long way through rough ground." },
      { label: `Pay (🟡 ${toll})`, if: toll > 0, disabled: s.purse < toll, fx: { coin: -toll }, text: "They count the coins twice and let you by." },
      { label: soldier ? "Show your papers and your sword" : "Bluff your way past", roll: { p: soldier ? 0.85 : 0.45, ok: "They decide you are not worth it.", okFx: null, bad: "It goes badly. You lose your purse's top layer and some blood.", badFx: { coin: -Math.min(s.purse, 6), time: 8, cond: "hurt" } } }], `m${m.i}`);
  } });
  const T = {
    pirates: hazardSea("Black sails"),
    "sea-monsters": hazardSea("The water heaves where the old sailors said it would"),
    brigands: hazardLand("A gang watches the road from cover.", 5),
    "hill-monsters": hazardLand("Scorched trees, and a smell of sulphur on the wind. Something lairs in these hills.", 0),
    "lake-monsters": { run: (ev, m, head) => lore(ev, m, head, ["You do not fish here."]) },
    ruins: { run: explore(10, "Search the ruins") }, dungeons: { run: explore(16, "Go down into it") }, caves: { run: explore(8, "Explore the chasm") },
    necropolises: { run: explore(14, "Walk among the tombs") }, "disturbed-burials": hazardLand("The dead are walking here. You hear them before you see them.", 0),
    rifts: { run: explore(6, "Go to the rift") },
    inns: { run: async (ev, m, head) => {
      const s = ev.s, g = ev.g;
      await ev.scene(head, esc(m.note), [
        { label: `Take a room until morning (🟡 ${AZ.Prices.inn(g.w, null)})`, disabled: s.purse < AZ.Prices.inn(g.w, null), fx: () => ({ coin: -AZ.Prices.inn(g.w, null), time: Math.max(1, AZ.Clock.nextDawn(s.clock, g.lat()) - s.clock), cure: ["hurt"] }), text: () => "You sleep under a roof. Over supper: " + (g.know.rumour(m.t[0], m.t[1], ev.rnd(`inn${m.i}:${Math.floor(s.clock / 24)}`), g) || "nothing worth repeating.") },
        { label: "Just a meal (🟡 1)", disabled: s.purse < 1, fx: { coin: -1, time: 1 }, text: "The food is as good as they say." },
        { label: "Move on", fx: null, text: "" }], `m${m.i}`);
    } },
    "hot-springs": { run: async (ev, m, head) => ev.scene(head, esc(m.note), [{ label: "Bathe (3 h)", fx: { time: 3, cure: ["fever", "gravely", "hurt"] }, text: "The heat goes into your bones and takes the ache with it." }, { label: "Move on", fx: null, text: "" }], `m${m.i}`) },
    "water-sources": { run: async (ev, m, head) => ev.scene(head, esc(m.note), [{ label: "Drink, and fill a flask (2 h)", fx: { time: 2, cure: ["fever", "gravely"], flag: "flask" }, text: "Cold, clean water. You fill a flask for the road; it may help later." }, { label: "Move on", fx: null, text: "" }], `m${m.i}`) },
    "sacred-forests": { run: async (ev, m, head) => { const r = ev.relByName(m.note); return ev.scene(head, esc(m.note), [{ label: "Leave an offering (🟡 2)", disabled: ev.s.purse < 2, fx: r ? { coin: -2, time: 1, stand: [["f", r.i, 1]] } : { coin: -2 }, text: `You leave something at the oldest tree${r ? ` for the ${esc(r.name)}` : ""}.` }, { label: "Pass through quietly", fx: { time: 1 }, text: "" }], `m${m.i}`); } },
    statues: { run: async (ev, m, head) => ev.scene(head, esc(m.note.split("\n")[0]), [{ label: "Copy the inscription (2 h)", fx: { time: 2, flag: "inscription" }, text: "You copy every mark as well as you can. Someone, somewhere, may read it." }, { label: "Move on", fx: null, text: "" }], `m${m.i}`) },
    libraries: { run: async (ev, m, head) => {
      const s = ev.s;
      await ev.scene(head, esc(m.note), [
        { label: "Read in the stacks (12 h, 🟡 2 to the copyists)", disabled: s.purse < 2, fx: { time: 12, coin: -2, reveal: 160 }, text: "Old charts and travellers' letters: you note every marked place within a hundred and sixty leagues." },
        { label: "Ask after the inscription you copied", if: !!s.flags.inscription, fx: { time: 4, unflag: "inscription", coin: 3 }, text: "An old archivist reads it aloud, slowly. It is a list of names, and one of them is a place on your route." },
        { label: "Move on", fx: null, text: "" }], `m${m.i}`);
    } },
    battlefields: { run: async (ev, m, head) => ev.scene(head, esc(m.note), [{ label: "Walk the field (4 h)", fx: { time: 4 }, text: "Rusted iron, a broken standard, too many small mounds." }, { label: "Move on", fx: null, text: "" }], `m${m.i}`) },
    mines: { run: async (ev, m, head) => ev.scene(head, esc(m.note), [{ label: "Work a shift for pay (12 h)", fx: { time: 12, coin: 4 }, text: "Hard work, honest pay, and dust in every seam of your clothes." }, { label: "Move on", fx: null, text: "" }], `m${m.i}`) },
    circuses: { run: async (ev, m, head) => ev.scene(head, esc(m.note), [{ label: "Spend an afternoon (4 h, 🟡 1)", disabled: ev.s.purse < 1, fx: { time: 4, coin: -1 }, text: () => "Lights, music, and the crowd's talk: " + (ev.g.know.rumour(m.t[0], m.t[1], ev.rnd(`c${m.i}`), ev.g) || "") }, { label: "Move on", fx: null, text: "" }], `m${m.i}`) },
    portals: { run: async (ev, m, head) => {
      const g = ev.g, s = ev.s, others = g.w.P.markers.filter(x => x.type === "portals" && x.i !== m.i);
      const k = await g.ui.choose(`${head}<br>${esc(m.note)}<br><span class="dim">Stepping through leaves your ${s.vessel ? esc(s.vessel.kind.toLowerCase()) : "baggage"} behind. You will have to come back the same way.</span>`,
        [...others.map(o => ({ label: `Step through to the ${esc(o.name)} (${AZ.U.num(g.know.dirDist(s.c, s.r, o.t).mi)} mi)` })), { label: "Stay on this side" }], { cancel: others.length });
      if (k >= others.length) return;
      const o = others[k];
      s.aboard = false; s.auto = false; s.c = o.t[0]; s.r = o.t[1];
      if (!g.w.isLand(s.c, s.r)) { const l = g.w.near(s.c, s.r, 2).find(n => n.kind === "burg"); if (l) { s.c = l.o.t[0]; s.r = l.o.t[1]; } }
      ev.fx({ time: 1 }, `Stepped through the portal to the ${esc(o.name)}.`);
      g.anim = null; g.afterStep();
      await g.ui.say(`The world folds. You stand at the ${esc(o.name)}, ${AZ.U.num(g.know.dirDist(s.c, s.r, m.t).mi)} miles from where you were ${AZ.T("data")}.`);
    } },
    party: { run: async (ev, m, head) => {
      const g = ev.g, s = ev.s;
      const lead = g.w.P.markers.filter(x => !s.done_m.includes(x.i) && x.type !== "party").map(x => ({ x, d: Math.hypot(x.t[0] - s.c, x.t[1] - s.r) })).sort((a, b) => a.d - b.d)[0];
      await ev.scene(head, `${esc(m.note)} Four of them, road-worn, arguing over a map.`, [
        { label: "Share a fire and swap news (3 h)", fx: () => ({ time: 3, thread: lead ? { title: `The party's lead: ${lead.x.name}`, steps: [{ text: `See the ${lead.x.name} for yourself`, goal: { marker: lead.x.i }, reward: { coin: 3 } }] } : null }), text: () => (lead ? `They tell you about the ${esc(lead.x.name)}, ${g.know.dirDist(s.c, s.r, lead.x.t).txt}, and mark it on your map.` : "They have nothing new.") },
        { label: "Move on", fx: null, text: "" }], `m${m.i}`);
    } },
    encounters: { run: async (ev, m, head) => {
      const g = ev.g, nm = g.know.person(`enc${m.i}`, g.w.C.culture[m.cell]);
      await ev.scene(`<b class="side">${esc(nm)}</b>, a stranger on the road ${AZ.T("new")}`, `The map marks a chance meeting here ${AZ.T("data")}.`, [
        { label: "Talk", fx: { time: 1 }, text: () => g.know.rumour(m.t[0], m.t[1], ev.rnd(`enc${m.i}`), g) || "They have little to say." }, { label: "Nod and pass", fx: null, text: "" }], `m${m.i}`);
    } },
    _default: { run: (ev, m, head) => lore(ev, m, head) },
  };
  T.jousts = T.circuses; T.fairs = T.circuses; T["sacred-pineries"] = T["sacred-forests"];
  return T;
})();

// zone scenes (type -> fn)
AZ.ZONES = (() => {
  const esc = AZ.U.esc;
  const blocked = (what, h) => async (ev, z, head) => ev.scene(head, what, [{ label: `Find another way (about ${h} hours)`, fx: { time: h }, text: "It takes most of a day to get round." }, { label: "Wait it out (twice that)", fx: { time: h * 2 }, text: "You wait, and watch others try their luck." }], `z${z.i}`);
  return {
    Disease: async (ev, z, head) => ev.scene(head, "Sickness in these parts: shuttered doors, smoke from burning bedding.", [
      { label: "Keep away from people (about 6 hours lost)", fx: { time: 6 }, text: "You skirt every village and drink only what you carry." },
      { label: "Use the flask from the spring", if: !!ev.s.flags.flask, fx: { unflag: "flask" }, text: "You drink nothing else until you are clear of it." },
      { label: "Go on as you are", roll: { p: 0.5, ok: "You pass through and feel nothing worse than worry.", okFx: null, bad: "Two days on, the fever finds you. A priest, a healing spring or two days' rest will break it.", badFx: { cond: "fever" } } }], `z${z.i}`),
    Invasion: async (ev, z, head) => {
      const g = ev.g, inv = ev.stateByPrefix(z.name), rel = inv ? g.know.rel(g.tv.homeState, inv.i) : "Unknown";
      const enemy = rel === "Enemy" || rel === "Rival";
      return ev.scene(head, `${inv ? `Soldiers of ${esc(inv.fullName)}` : "An army"} hold this ground. Your people stand to theirs as: <b>${rel}</b> ${AZ.T("data")}.`, [
        { label: "Go round their pickets (about 8 hours)", fx: { time: 8 }, text: "You move by night and by the long way." },
        { label: "Present yourself and your papers", fx: enemy ? { time: 12, coin: -Math.min(ev.s.purse, 4), stand: inv ? [["s", inv.i, -1]] : [] } : { time: 2 }, text: enemy ? "They hold you half a day and keep some of your coin for their trouble." : "Questions, a stamp, and a wave onward." }], `z${z.i}`);
    },
    Rebels: async (ev, z, head) => ev.scene(head, "Rebels have closed the roads and levy their own toll.", [{ label: "Pay the toll (🟡 4)", disabled: ev.s.purse < 4, fx: { coin: -4 }, text: "They give you a token to show at the next barricade." }, { label: "Go round (about 6 hours)", fx: { time: 6 }, text: "" }], `z${z.i}`),
    Proselytism: async (ev, z, head) => {
      const r = ev.relByName(z.name) || ev.w.P.religions.find(x => x && x.name.split(" ")[0] === z.name.split(" ")[0]);
      return ev.scene(head, `Missionaries${r ? ` of the ${esc(r.name)}` : ""} are working these parts, with bread for anyone who will listen.`, [
        { label: "Take their bread and blessing", fx: r ? { stand: [["f", r.i, 1]], flag: `debt:${r.i}`, time: 1 } : { time: 1 }, text: "You owe them now, and they will remember it." },
        { label: "Politely refuse", fx: null, text: "They let you go, with a look." }], `z${z.i}`);
    },
    Crusade: async (ev, z, head) => ev.scene(head, "Armed pilgrims and recruiters for a crusade crowd the way.", [{ label: "Join a prayer and move on (2 h)", fx: { time: 2 }, text: "No one asks what you believe, as long as you kneel." }, { label: "Avoid them (about 4 hours)", fx: { time: 4 }, text: "" }], `z${z.i}`),
    Disaster: async (ev, z, head) => {
      const cell = ev.w.cell(ev.s.c, ev.s.r), rel = ev.w.C.religion[cell];
      return ev.scene(head, "Dearth: empty granaries, thin children, prices no one can pay.", [{ label: "Give alms (🟡 2)", disabled: ev.s.purse < 2, fx: { coin: -2, stand: rel ? [["f", rel, 1]] : [] }, text: "It is not much, and it is noticed." }, { label: "Pass by", fx: null, text: "" }], `z${z.i}`);
    },
    Eruption: async (ev, z, head) => ev.scene(head, "Ash falls like grey snow; the sky glows red at night.", [{ label: ev.s.aboard ? "Stand out to sea (about 6 hours)" : "Cover your face and push on (about 10 hours)", fx: { time: ev.s.aboard ? 6 : 10 }, text: "" }, { label: "Shelter until it eases (a day)", fx: { time: 24 }, text: "" }], `z${z.i}`),
    Avalanche: blocked("The pass is buried under a slide of snow and rock.", 10),
    Fault: blocked("The ground has split; the road ends in a raw cliff.", 6),
    Flood: blocked("The rivers are over their banks; fords and bridges are gone.", 12),
    Tsunami: async (ev, z, head) => ev.scene(head, ev.s.aboard ? "A great swell runs in from the open sea; wreckage floats everywhere." : "The wave came in and went out again. The shore is wreckage and mud.", [
      { label: ev.s.aboard ? "Ride it out (about 4 hours)" : "Help dig out survivors (8 h)", fx: () => (ev.s.aboard ? { time: 4 } : { time: 8, stand: ev.w.C.state[ev.w.cell(ev.s.c, ev.s.r)] ? [["s", ev.w.C.state[ev.w.cell(ev.s.c, ev.s.r)], 1]] : [] }), text: "" },
      { label: "Keep going", fx: null, text: "" }], `z${z.i}`),
    _default: async (ev, z, head) => ev.g.ui.say(head),
  };
})();

// ---------------------------------------------------------------------------------------------
// Navigation, weather and prices.
//   Water is navigable; a river is navigable when its discharge (data) is large enough for the
//   vessel: boats from 40 m³/s, ships from 400 m³/s (mixed rule). Each port gets a harbour: the
//   nearest navigable tile within a few tiles of the town, reached overland. Courses run only on
//   navigable tiles, following the plan's track where it is on water and joining the gaps by
//   search, so no vessel crosses land.
//   Weather is rolled per day and per region from the map's precipitation, the season and the
//   latitude. Prices come from the town's market (cheapest food, sales tax of the state).
// ---------------------------------------------------------------------------------------------
AZ.NAV = { boat: 40, ship: 400 };
AZ.vesselClass = kind => (/ship|steam|modern/i.test(kind || "") ? "ship" : "boat");

Object.assign(AZ.World.prototype, {
  navigable(c, r, cls = "boat") {
    if (!this.inb(c, r)) return false;
    if (!this.isLand(c, r)) return true;
    if (!(this.R.cwater[r * this.cols + c] >> 4)) return false;
    const rv = this.river(c, r);
    return (rv?.discharge || 0) >= AZ.NAV[cls];
  },
  harbour(b, cls = "boat") {
    this._harb = this._harb || new Map();
    const key = `${b.i}:${cls}`;
    if (this._harb.has(key)) return this._harb.get(key);
    let found = null;
    const seen = new Set([this.idx(b.t[0], b.t[1])]), q = [[b.t[0], b.t[1], 0]];
    while (q.length && !found) {
      const [c, r, d] = q.shift();
      for (const [dc, dr] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
        const a = c + dc, e = r + dr, k = this.idx(a, e);
        if (!this.inb(a, e) || seen.has(k)) continue;
        seen.add(k);
        if (this.navigable(a, e, cls)) { found = { t: [a, e], walk: d + 1 }; break; }
        if (d < 3 && this.isLand(a, e)) q.push([a, e, d + 1]); // a harbour is within a short walk of the town, never a distant coast
      }
    }
    this._harb.set(key, found);
    return found;
  },
  // A* on the tile grid; ok(c, r) says whether a tile may be entered; cost(c, r) >= 1
  path(from, to, ok, opts = {}) {
    const N = this.cols * this.rows, cols = this.cols;
    if (!this._astar || this._astar.g.length !== N) this._astar = { g: new Float32Array(N), from: new Int32Array(N), stamp: new Uint32Array(N), gen: 0 };
    const A = this._astar; A.gen++;
    const start = this.idx(from[0], from[1]), goal = this.idx(to[0], to[1]);
    const limit = opts.limit || 400000, cost = opts.cost || (() => 1);
    const heap = [], push = (f, i) => { heap.push([f, i]); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };
    const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m; } } return top; };
    const h = i => Math.abs((i % cols) - to[0]) + Math.abs(Math.floor(i / cols) - to[1]);
    A.stamp[start] = A.gen; A.g[start] = 0; A.from[start] = -1; push(h(start), start);
    let n = 0;
    while (heap.length && n++ < limit) {
      const [, i] = pop();
      if (i === goal) {
        const out = []; for (let k = i; k !== -1; k = A.from[k]) out.push([k % cols, Math.floor(k / cols)]);
        return out.reverse();
      }
      const c = i % cols, r = Math.floor(i / cols), gi = A.g[i];
      for (const [dc, dr] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
        const a = c + dc, e = r + dr;
        if (a < 0 || e < 0 || a >= cols || e >= this.rows) continue;
        const j = e * cols + a;
        if (j !== goal && !ok(a, e)) continue;
        const ng = gi + cost(a, e);
        if (A.stamp[j] === A.gen && A.g[j] <= ng) continue;
        A.stamp[j] = A.gen; A.g[j] = ng; A.from[j] = i;
        push(ng + h(j) * (opts.greed || 1), j);
      }
    }
    return null;
  },
  // are two tiles on the same connected body of navigable water? (components labelled once per class)
  sameWater(a, b, cls = "boat") {
    if (!a || !b) return false;
    this._comp = this._comp || {};
    let lab = this._comp[cls];
    if (!lab) {
      const N = this.cols * this.rows, cols = this.cols;
      lab = this._comp[cls] = new Int32Array(N);
      let next = 0;
      const q = new Int32Array(N);
      for (let i = 0; i < N; i++) {
        if (lab[i] || !this.navigable(i % cols, (i / cols) | 0, cls)) continue;
        next++; let h = 0, t = 0; q[t++] = i; lab[i] = next;
        while (h < t) {
          const j = q[h++], c = j % cols, r = (j / cols) | 0;
          for (const [dc, dr] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
            const a2 = c + dc, b2 = r + dr;
            if (a2 < 0 || b2 < 0 || a2 >= cols || b2 >= this.rows) continue;
            const k = b2 * cols + a2;
            if (!lab[k] && this.navigable(a2, b2, cls)) { lab[k] = next; q[t++] = k; }
          }
        }
      }
    }
    const la = lab[this.idx(a[0], a[1])], lb = lab[this.idx(b[0], b[1])];
    return la > 0 && la === lb;
  },
  waterPath(from, to, cls) { return this.withMiles(this.path(from, to, (c, r) => this.navigable(c, r, cls), { limit: 600000, greed: 1.2 })); },
  // a 4-connected path zigzags on diagonals; its true length is the chord length sampled along it
  withMiles(p) {
    if (!p || p.length < 2) return p;
    let L = 0;
    for (let i = 0; i < p.length - 1; i += 8) { const j = Math.min(p.length - 1, i + 8); L += Math.hypot(p[j][0] - p[i][0], p[j][1] - p[i][1]); }
    p.mps = Math.max(0.7, L / (p.length - 1)) * this.miles;
    return p;
  },
});

// The plan's courses, moved onto navigable tiles and run harbour to harbour
AZ.Journey.prototype.fixCourses = function () {
  const w = this.w;
  this.course = new Set();
  for (const seg of this.segs) {
    if (!seg.moving) continue;
    const cls = AZ.vesselClass(seg.transport);
    seg.cls = cls;
    const fromB = w.P.burgs[w.C.burg[seg.from]], toB = seg.place.at ? seg.place.burg : null;
    const fromH = fromB && fromB.port ? w.harbour(fromB, cls) : null, toH = toB && toB.port ? w.harbour(toB, cls) : null;
    seg.fromHarbour = fromH ? fromH.t : null; seg.toHarbour = toH ? toH.t : null;
    const raw = seg.chain;
    const anchors = raw.filter(([c, r]) => w.navigable(c, r, cls));
    if (fromH) anchors.unshift(fromH.t);
    if (toH) anchors.push(toH.t);
    const out = [];
    for (let k = 0; k < anchors.length; k++) {
      const t = anchors[k], last = out[out.length - 1];
      if (!last) { out.push(t); continue; }
      if (last[0] === t[0] && last[1] === t[1]) continue;
      if (Math.abs(last[0] - t[0]) + Math.abs(last[1] - t[1]) === 1) { out.push(t); continue; }
      const p = w.path(last, t, (c, r) => w.navigable(c, r, cls), { limit: 60000 });
      if (p) out.push(...p.slice(1));
    }
    // loop erasure: where the plan's track doubles back over its own water, cut the loop out
    const pos = new Map(), clean = [];
    for (const t of out) {
      const k = w.idx(t[0], t[1]);
      if (pos.has(k)) { for (const u of clean.splice(pos.get(k) + 1)) pos.delete(w.idx(u[0], u[1])); }
      else { pos.set(k, clean.length); clean.push(t); }
    }
    seg.chain = clean.length ? clean : raw;
    seg.chainPos = new Map(seg.chain.map(([c, r], i) => [w.idx(c, r), i]));
    seg.endTile = seg.toHarbour || seg.chain[seg.chain.length - 1];
    seg.chain.forEach(([c, r]) => this.course.add(w.idx(c, r)));
  }
  // checkpoints: the stops, in order, each with its par times and the stays that make it up
  this.cps = [];
  const at = (seg) => (seg.place.burg && seg.place.at ? `b${seg.place.burg.i}` : `t${seg.place.tile.join(",")}`);
  const first = { place: this.origin, key: `b${this.origin.burg?.i}`, stays: [], legIn: null };
  this.cps.push(first);
  for (const seg of this.segs) {
    let cp = this.cps[this.cps.length - 1];
    if (seg.moving) {
      cp.legOut = seg;
      const next = { place: seg.place, key: at(seg), stays: [], legIn: seg, parArrive: seg.planEnd };
      this.cps.push(next);
    } else cp.stays.push(seg);
  }
  this.cps.forEach((cp, i) => {
    cp.i = i;
    if (cp.parArrive == null) cp.parArrive = this.t0;
    cp.parLeave = cp.legOut ? cp.legOut.planStart : cp.stays.length ? cp.stays[cp.stays.length - 1].planEnd : cp.parArrive;
    cp.tile = cp.place.burg && cp.place.at ? cp.place.burg.t : cp.place.tile;
    cp.acts = cp.stays.flatMap(st => AZ.stayActs(st, cp, w));
  });
  // the plan's own nights at anchor on legs that sail less than a full day (par, mixed)
  for (const seg of this.segs) {
    if (!seg.moving || seg.hoursPerDay >= 24) { if (seg.moving) seg.nights = []; continue; }
    seg.nights = [];
    const lat = w.latlon(...seg.startTile)[0];
    let t = seg.planStart, sailed = 0;
    for (let guard = 0; guard < 400 && sailed < seg.travelHours - 1e-6; guard++) {
      const sun = AZ.Clock.sun(t, lat), dawn = sun.day * 24 + Math.max(0, sun.rise);
      if (t < dawn) t = dawn;
      const use = Math.min(dawn + seg.hoursPerDay - t, seg.travelHours - sailed);
      if (use <= 0) { t = (sun.day + 1) * 24 + Math.max(0, AZ.Clock.sun((sun.day + 1) * 24, lat).rise); continue; }
      t += use; sailed += use;
      if (sailed < seg.travelHours - 1e-6) {
        const k = Math.round((sailed / seg.travelHours) * (seg.chain.length - 1));
        seg.nights.push({ t, tile: seg.chain[k], frac: sailed / seg.travelHours });
      }
    }
  }
};

// activities that make up a stay; the plan's hours are par, the player does the work
AZ.stayActs = function (st, cp, w) {
  const n = st.name, acts = [], land = w ? w.isLand(...cp.tile) : true;
  const at = (n.match(/ at (.+)$/i) || [])[1];
  if (/gather|muster|assembl|meet/i.test(n)) acts.push({ id: "gather", label: `Meet the company in ${cp.place.name}`, stay: st.k });
  if (/rumou?r|news|tidings|ask/i.test(n)) acts.push({ id: "rumours", label: "Listen for rumours", stay: st.k });
  if (/book|passage|hire|waiting for a (ship|boat)/i.test(n)) acts.push({ id: "book", label: "Book passage or hire a boat at the harbour", stay: st.k });
  if (/resupply|provision|supplies|market/i.test(n)) acts.push({ id: "resupply", label: "Buy supplies at the market", stay: st.k });
  if (/alms/i.test(n)) acts.push({ id: "alms", label: "Give alms at the temple", stay: st.k });
  if (/\brest\b|shelter|\binn\b|lodg/i.test(n)) acts.push({ id: "rest", label: `Rest a night${at ? " at " + at : " ashore"}`, stay: st.k });
  if (/camp/i.test(n)) acts.push({ id: "camp", label: `Camp ${(n.match(/camp (in|by|near|at) (.+)$/i) || [])[0]?.replace(/^camp/i, "") || "here"} (R)`.replace("  ", " "), stay: st.k });
  else if (/anchor|stopp|night/i.test(n)) acts.push(land ? { id: "camp", label: `Spend the night ${cp.place.name} (R)`, stay: st.k } : { id: "anchor", label: `Spend the night at anchor ${cp.place.name}`, stay: st.k });
  if (!acts.length) acts.push({ id: "wait", label: n, stay: st.k });
  return acts;
};

// ------------------------------------------------------------------ weather
AZ.Weather = {
  KINDS: { clear: { label: "clear", walk: 1, sail: 1 }, cloudy: { label: "overcast", walk: 1, sail: 1 }, rain: { label: "rain", walk: 1.15, sail: 1.05 },
           snow: { label: "snow", walk: 1.4, sail: 1.15 }, fog: { label: "fog", walk: 1.1, sail: 1.3 }, storm: { label: "storm", walk: 1.5, sail: 2.2 } },
  at(w, c, r, t) {
    const day = Math.floor(t / 24), half = Math.floor((t % 24) / 12);
    const rx = c >> 5, ry = r >> 5, seed = AZ.U.strSeed(String(w.P.world.seed));
    const roll = AZ.U.rnd2(rx * 7919 + day * 3, ry * 104729 + half, seed);
    const roll2 = AZ.U.rnd2(rx + day * 31, ry + half * 17, seed ^ 0x5bd1e995);
    const lat = w.latlon(c, r)[0], season = AZ.Clock.season(lat, t), sea = !w.isLand(c, r);
    const prec = w.precMM(c, r);
    let pRain = AZ.U.clamp(prec / 2600, 0.06, 0.8);
    if (season === "winter") pRain *= 1.25; else if (season === "summer") pRain *= 0.8;
    else if (season === "wet season") pRain *= 1.5; else if (season === "dry season") pRain *= 0.4;
    let pStorm = sea ? 0.02 + (Math.abs(lat) > 30 && season === "winter" ? 0.06 : 0) + (Math.abs(lat) > 45 ? 0.03 : 0) + (season === "wet season" ? 0.04 : 0) : pRain * 0.08;
    const today = AZ.Clock.today(w.tempC(c, r), lat, t, sea);
    let kind = "clear";
    if (roll < pStorm) kind = "storm";
    else if (roll < pStorm + pRain) kind = today < 0 ? "snow" : "rain";
    else if (roll2 < (sea && today < 8 ? 0.08 : 0.03)) kind = "fog";
    else if (roll2 < 0.4) kind = "cloudy";
    return { kind, ...this.KINDS[kind], key: `${day}:${half}:${rx}:${ry}` };
  },
};

// ------------------------------------------------------------------ prices (🟡, Azgaar's money)
AZ.Prices = {
  tax(w, b) { const s = b && w.P.states[b.state]; return s ? +s.salesTax || 0 : 0; },
  market(w, b) { return b ? w.P.markets.find(m => m.i === b.market) : null; },
  food(w, b) { // cheapest food good on the town's market, with the state's sales tax
    const mk = this.market(w, b);
    let best = 1;
    if (mk) {
      const prices = w.P.goods.filter(g => (g.tags || []).includes("food") && mk.goods[g.i]).map(g => mk.goods[g.i][1]).filter(p => p > 0);
      if (prices.length) best = Math.min(...prices);
    }
    return best * (1 + this.tax(w, b));
  },
  ration(w, b) { return AZ.U.rn(Math.max(0.05, this.food(w, b) * 0.1), 2); },        // one person, one day
  water(w, b) { return AZ.U.rn(0.02 * (1 + this.tax(w, b)), 2); },                    // one cask-day
  inn(w, b) { return AZ.U.rn(0.3 * (1 + this.tax(w, b)) + this.ration(w, b) * 2, 1); },
  alms(w, b) { return AZ.U.rn(0.5 + (b?.population || 1) * 0.01, 1); },
  fare(w, b, miles) { return AZ.U.rn(Math.max(1, miles * 0.004) * (1 + this.tax(w, b)), 1); },
  wage(w, b) { return AZ.U.rn(0.15 * (1 + this.tax(w, b)), 2); },                    // one crew member, one day
  hire(w, b) { return AZ.U.rn(0.1 * (1 + this.tax(w, b)), 2); },                     // the boat, one day
  heal(w, b) { return AZ.U.rn(1 + this.ration(w, b) * 5, 1); },
  repair(w, b) {
    const mk = this.market(w, b), s = w.P.goods.find(g => /sail/i.test(g.name)), rp = w.P.goods.find(g => /rope/i.test(g.name));
    const p = (s && mk?.goods[s.i]?.[1] || 6) * 0.3 + (rp && mk?.goods[rp.i]?.[1] || 3) * 0.3;
    return AZ.U.rn(p * (1 + this.tax(w, b)), 1);
  },
  goodPrice(w, b, gid) { const mk = this.market(w, b); return mk && mk.goods[gid] ? mk.goods[gid][1] * (1 + this.tax(w, b)) : null; },
};

// ---------------------------------------------------------------------------------------------
// Travel, supplies and money.
//   Booked ship: a captain with his own itinerary (a cargo to land, ports to call at); a fixed
//   departure; the passenger cannot steer and the ship does not wait.
//   Hired or owned boat: the traveller steers; the crew eats from the traveller's stores, draws
//   daily wages, calls for anchor at dusk and for shelter in storms, and can be overruled at a
//   cost to morale. Low morale ends in mutiny.
//   Days: everyone eats once a day (water is not tracked for now). Hunger slows you;
//   in the end you collapse and wake somewhere else, poorer and later.
// ---------------------------------------------------------------------------------------------
Object.assign(AZ.COND, {
  hungry: { on: "you are hungry", off: "you have eaten", slow: 1.2, label: "hungry" },
  starving: { on: "you are starving", off: "you have eaten", slow: 1.5, label: "starving" },
  thirsty: { on: "you are thirsty", off: "you have drunk", slow: 1.4, label: "thirsty" },
});

Object.assign(AZ.Game.prototype, {
  eaters() { const v = this.s.vessel; return 1 + (v && v.crew && (v.mode === "hired" || v.mode === "owned") && !this.riding() ? v.crew : 0); },
  capacity() { const s = this.s, ride = this.riding(); return { food: s.vessel && !ride ? 220 : ride || s.voyage ? 60 : 20, goods: s.vessel && !ride ? 30 : ride || s.voyage ? 10 : 6 }; },
  refill() { /* water is not tracked for now */ },
  tick() {
    const s = this.s, w = this.w, U = AZ.U;
    if (!s || this.ui.busy()) return;
    const day = Math.floor(s.clock / 24);
    if (day > s.lastDay) {
      const n = Math.min(day - s.lastDay, 60); s.lastDay = day;
      for (let i = 0; i < n; i++) if (this.newDay()) return;
      if (this.riding() && s.voyage.state === "sea" && this.shipEvent && U.rnd2(day, s.seed % 100003, 41) < AZ.SHIP_EVENTS.rate) return this.shipEvent();
    }
    if (s.voyage && s.voyage.state === "port" && s.clock >= s.voyage.departAt) return this.depart();
    const wx = this.weather();
    if (wx.key !== s.wxKey) {
      s.wxKey = wx.key;
      if (wx.kind === "storm" && s.aboard && !w.isLand(s.c, s.r)) return this.stormCall();
      if (wx.kind !== s.wxKind && ["storm", "snow", "fog", "rain"].includes(wx.kind)) this.ui.toast(`Weather: ${wx.label} ${AZ.T("mixed")}`);
      s.wxKind = wx.kind;
    }
    const v = s.vessel;
    if (v && s.aboard && !this.riding() && v.crew && !this.harbourAt.has(w.idx(s.c, s.r)) && w.navigable(s.c, s.r, v.cls)) {
      const sun = AZ.Clock.sun(s.clock, this.lat()), key = Math.floor((s.clock + 12) / 24);
      if (sun.dl < 24 && (sun.hour >= sun.set + 0.75 || sun.hour < sun.rise) && v.nightKey !== key) { v.nightKey = key; return this.crewCall(); }
    }
    void U;
  },
  newDay() {
    const s = this.s, U = AZ.U, v = s.vessel;
    const eat = this.eaters();
    s.sup.food -= eat;
    if (this.riding()) { if (s.voyage.role === "crew") s.sup.food += eat; this.slept(); } // the ship feeds its crew; passengers sleep aboard
    if (s.sup.food < 0) { s.sup.food = 0; s.hunger++; if (v && v.crew) v.morale -= 15; } else s.hunger = 0;
    delete s.cond.hungry; delete s.cond.starving; delete s.cond.thirsty;
    if (s.hunger >= 3) s.cond.starving = true; else if (s.hunger >= 1) s.cond.hungry = true;
    if (v && v.crew && (v.mode === "hired" || v.mode === "owned")) {
      const due = U.rn(v.crew * v.wage + (v.hire || 0), 2);
      if (s.purse >= due) { s.purse = U.rn(s.purse - due, 2); v.morale = Math.min(100, v.morale + 1); }

  // ------------------------------------------------------------------ sleep

  slept() { const s = this.s; s.awake = 0; delete s.cond.tired; delete s.cond.exhausted; },
  nearestPort(cls) {

  async collapse(cause) {

  async mutiny() {
    const s = this.s, w = this.w, U = AZ.U, v = s.vessel;

    const h = w.harbour(b, v.cls);

      v.mode === "hired" ? "In harbour they walk off with the boat's owner, and your deposit goes with them. You are ashore." : "In harbour they take their wages in silence and leave. Your boat has no crew; hire one at the harbour."]);

      [{ label: "Anchor here until dawn" }, { label: `Sail on through the night (morale −12${nearLand ? ", and reefs near" : ""})` }, { label: port ? `Make for ${U.esc(port.name)} harbour (${U.num(mi)} mi)` : "No harbour near", disabled: !port }], { cancel: 0 });

  // three strikes: each time morale breaks, the crew states its terms; the third time they take the boat
  async ultimatum() {

    s.auto = false;

    const bonus = U.rn(v.crew * (v.wage || 0.2) * 5, 2);

  async stormCall() {

    }

  // ------------------------------------------------------------------ harbour
  canCrew() { return /deck|net|sail|fish|cook|supercargo|shipmaster/i.test(this.tv.trade) || this.tv.kind === "shipmaster"; },
  shipOffers(b) {
    const s = this.s, w = this.w, U = AZ.U, P = w.P, day = Math.floor(s.clock / 24);
    s.taken = s.taken || [];
    const rnd = U.rng(`${s.seed}:ships:${b.i}:${Math.floor(day / 3)}`);
    const out = [];
    const flagOf = st => P.states[st]?.name || "no flag";
    const mk = (dest, stops, departAt, planned, cargo) => {
      const bh = w.harbour(b, "ship");
      if (!bh) return null;
      const legs = [b, ...stops, dest];
      let miles = 0;
      for (let i = 0; i < legs.length - 1; i++) miles += Math.hypot(legs[i + 1].t[0] - legs[i].t[0], legs[i + 1].t[1] - legs[i].t[1]) * w.miles * 1.15;
      const id = `${b.i}:${dest.i}:${Math.round(departAt)}`;
      const captain = this.know.person(`cap:${id}`, b.culture);
      const ship = `the ${U.cap(w.names.get(P.cultures[b.culture].base, U.rng(`ship:${id}`), 4, 9))}`;
      if (!legs.every(x => w.harbour(x, "ship") && w.sameWater(bh.t, w.harbour(x, "ship").t, "ship"))) return null;
      return { id, planned, dest, stops, departAt, miles: Math.round(miles), fare: AZ.Prices.fare(w, b, miles), captain, ship, flag: b.state, cargo,
        why: cargo ? `${captain} carries ${cargo.toLowerCase()} for the markets of ${[...stops, dest].map(x => x.name).join(" and ")} ${AZ.T("data")}` : `${captain} has a cargo for ${dest.name}` };
    };
    const cp = this.cpHere();
    if (cp && cp.place.burg === b && cp.legOut && AZ.vesselClass(cp.legOut.transport) === "ship" && cp.legOut.place.burg) {
      const arrive = s.cpRec[cp.i]?.arrive ?? cp.parArrive;
      const departAt = arrive + (cp.parLeave - cp.parArrive);
      const o = mk(cp.legOut.place.burg, [], departAt, true, null);
      if (o && departAt > s.clock) { o.miles = Math.round(cp.legOut.miles); o.fare = AZ.Prices.fare(w, b, cp.legOut.miles); o.why = `the plan's ship: ${o.captain} sails direct ${AZ.T("data")}`; out.push(o); }
      // a slower ship to the same port, calling on the way where the trade takes it
      const dest = cp.legOut.place.burg;
      const between = P.burgs.filter(x => x && x.port && x !== b && x !== dest && w.harbour(x, "ship") && w.sameWater(w.harbour(b, "ship")?.t, w.harbour(x, "ship").t, "ship")).map(x => ({ x, off: AZ.U.clamp(this.offLine(b.t, dest.t, x.t), 0, 1e9) })).filter(o2 => o2.off < 60).sort((a2, b2) => a2.off - b2.off).slice(0, 3).map(o2 => o2.x);
      if (between.length) { const o2 = mk(dest, [rnd.pick(between)], s.clock + 30 + rnd() * 40, false, this.cargoFor(b)); if (o2) { o2.fare = AZ.U.rn(o2.fare * 0.8, 1); out.push(o2); } }
    }
    const sells = Object.keys(P.trade.sell[b.i] || {});
    const ports = P.burgs.filter(x => x && x.port && x !== b && w.harbour(x, "ship") && w.sameWater(w.harbour(b, "ship")?.t, w.harbour(x, "ship").t, "ship"));
    const buyers = ports.filter(x => sells.some(g => (P.trade.buy[x.i] || {})[g])).sort((a, c) => Math.hypot(a.t[0] - b.t[0], a.t[1] - b.t[1]) - Math.hypot(c.t[0] - b.t[0], c.t[1] - b.t[1]));

  offLine(a, b, p) { // distance (tiles) from p to segment ab, infinite beyond the ends
    const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;

  cargoFor(b) { const g = Object.keys(this.w.P.trade.sell[b.i] || {})[0]; return g ? this.w.P.goods.find(x => x.i === +g)?.name : null; },
  async harbour(b) {
    const s = this.s, w = this.w, U = AZ.U, P = AZ.Prices;

      }

      const k = await this.ui.choose(`<b>${U.esc(b.name)} harbour</b> · 🟡 ${U.rn(s.purse, 1)}${this.voyageLine()}`, opts, { cancel: opts.length - 1 });

        const crew = o.act === "crew";

        s.voyage = { ship: o.o.ship, captain: o.o.captain, flag: o.o.flag, role: crew ? "crew" : "passenger", fare: crew ? 0 : o.o.fare, cls: "ship", speed: 10, hpd: 24,
          stops: [...o.o.stops, o.o.dest].map((x, i, a) => ({ b: x.i, name: x.name, stay: i === a.length - 1 ? 0 : 8 + Math.round(AZ.U.rnd2(x.i, b.i, 3) * 16) })),
          leg: 0, state: "port", at: h, portBurg: b.i, departAt: o.o.departAt, planned: o.o.planned, from: b.i, why: o.o.why, course: null, pos: 0 };
        this.doAct("book");
        this.log(`${crew ? "Signed on" : "Booked passage"} aboard ${U.esc(o.o.ship)} to ${U.esc(o.o.dest.name)}, sailing ${AZ.Clock.fmt(o.o.departAt)}.`, "hook");
        await this.ui.say([`${crew ? "You sign the ship's articles" : `🟡 ${o.o.fare} buys a berth`} aboard ${U.esc(o.o.ship)}, ${U.esc(o.o.captain)} master. ${U.cap(o.o.why)}.`,
          `She sails <b>${AZ.Clock.fmt(o.o.departAt)}</b>, in ${AZ.Clock.span(o.o.departAt - s.clock)}, and will not wait. Bring your own food: you have ${s.sup.food} days' worth. Board from town (Space) before she sails.`]);
