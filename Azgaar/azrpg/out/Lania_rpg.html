  },
  vesselHere(b) { const v = this.s.vessel; if (!v) return false; return ["boat", "ship"].some(cls => { const h = this.w.harbour(b, cls); return h && h.t[0] === v.c && h.t[1] === v.r; }); },
  boardOptions(b) {
    const s = this.s, U = AZ.U, opts = [];
    const v = s.voyage;
    if (v && v.state === "port" && v.portBurg === b.i) {
      if (!this.riding()) opts.push({ label: `Board ${U.esc(v.ship)} (sails ${AZ.Clock.fmt(v.departAt)}, in ${AZ.Clock.span(v.departAt - s.clock)})`, cls: "hook", act: { go: async () => { s.aboard = true; v.boarded = true; s.c = v.at[0]; s.r = v.at[1]; this.ui.toast(`Aboard ${U.esc(v.ship)}.`); this.afterStep(); } } });
      opts.push({ label: `Wait aboard until ${U.esc(v.ship)} sails (${AZ.Clock.span(v.departAt - s.clock)})`, act: { go: async () => { s.aboard = true; v.boarded = true; s.c = v.at[0]; s.r = v.at[1]; s.clock = v.departAt; this.afterStep(); } } });
      if (this.riding()) opts.push({ label: "Go ashore and walk (mind the sailing time)", act: { go: async () => { s.aboard = false; v.boarded = false; s.c = b.t[0]; s.r = b.t[1]; this.afterStep(); } } });
    }
    if (s.vessel && this.vesselHere(b)) {
      if (!s.aboard || this.riding()) opts.push({ label: `Board your ${U.esc(s.vessel.kind.toLowerCase())}${s.vessel.crew ? "" : " (no crew!)"}`, act: { go: async () => { if (s.voyage) s.voyage.boarded = false; s.aboard = true; s.c = s.vessel.c; s.r = s.vessel.r; this.afterStep(); } } });
      else opts.push({ label: `Go ashore and walk (the ${U.esc(s.vessel.kind.toLowerCase())} waits in harbour)`, act: { go: async () => { s.aboard = false; s.c = b.t[0]; s.r = b.t[1]; this.afterStep(); } } });
    }
    return opts;
  },
  shipWarn() { const v = this.s.voyage; return v && v.state === "port" && v.departAt < AZ.Clock.nextDawn(this.s.clock, this.lat()) ? " — the ship sails before morning!" : ""; },
  voyageLine() { const v = this.s.voyage; return v && v.state === "port" ? ` · <span class="hook">${AZ.U.esc(v.ship)} sails ${AZ.Clock.fmt(v.departAt)} (in ${AZ.Clock.span(v.departAt - this.s.clock)})</span>` : ""; },
  // ------------------------------------------------------------------ voyages
  depart() {
    const s = this.s, v = s.voyage, U = AZ.U, w = this.w;
    if (!this.riding()) {
      this.log(`Missed ${U.esc(v.ship)}: she sailed ${AZ.Clock.fmt(v.departAt)} without you.`, "hook");
      s.voyage = null; this.dirty = true;
      return this.ui.say(`<b class="hook">${U.esc(v.ship)} has sailed without you.</b> The fare is gone. Book another ship at the harbour.`);
    }
    const stop = v.stops[v.leg], tb = w.P.burgs[stop.b], th = w.harbour(tb, "ship");
    let course = null;
    const plan = v.planned && this.jr && this.jr.segs.find(sg => sg.moving && sg.fromHarbour && sg.fromHarbour[0] === v.at[0] && sg.fromHarbour[1] === v.at[1] && sg.place.burg === tb);
    if (plan) { course = plan.chain; v.milesPerStep = plan.miles / Math.max(1, plan.chain.length - 1); }
    else { course = th ? w.waterPath(v.at, th.t, "ship") : null; v.milesPerStep = course ? course.mps : w.miles; }
    if (!course) {
      const port = w.P.burgs[v.portBurg];
      this.log(`${U.esc(v.ship)} could not find a way to ${U.esc(tb.name)}.`);
      s.voyage = null; s.aboard = false; s.purse = U.rn(s.purse + (v.leg === 0 ? v.fare : 0), 2);
      if (port) { s.c = port.t[0]; s.r = port.t[1]; }
      this.anim = null; this.afterStep();
      return this.ui.say(`The captain will not risk it: there is no way by sea to ${U.esc(tb.name)} from here. The voyage is off${v.leg === 0 ? " and your fare is returned" : ""}; you are put ashore.`);
    }
    v.course = course; v.pos = 0; v.state = "sea"; v.to = th.t;
    s.c = course[0][0]; s.r = course[0][1];
    this.log(`${U.esc(v.ship)} cast off for ${U.esc(tb.name)}.`);
    this.ui.toast(`${U.esc(v.ship)} casts off for ${U.esc(tb.name)}. You are a passenger: Space for the ship, F for faster days, P to pause.`);
    this.dirty = true;
  },
  voyageStep() {
    const s = this.s, v = s.voyage, U = AZ.U, w = this.w;
    const next = v.course[v.pos + 1];
    if (!next) return this.dock();
    const dc = next[0] - s.c, dr = next[1] - s.r;
    s.dir = dc < 0 ? "left" : dc > 0 ? "right" : s.dir;
    const hours = this.stepHours(next[0], next[1], dc, dr);
    this.anim = { from: [s.c, s.r], to: [next[0], next[1]], t0: performance.now(), dur: this.fast ? 22 : 70 };
    s.c = next[0]; s.r = next[1]; s.clock += hours; v.pos++;
    this.afterStep();
    void U; void w;
  },
  async dock() {
    const s = this.s, v = s.voyage, U = AZ.U, w = this.w;
    const stop = v.stops[v.leg], b = w.P.burgs[stop.b];
    v.state = "port"; v.at = [s.c, s.r]; v.portBurg = b.i; v.course = null;
    if (this._toPort) { this._toPort = false; this.fast = false; }
    v.leg++;
    this.log(`${U.esc(v.ship)} docked at ${U.esc(b.name)}.`);
    if (v.leg >= v.stops.length) {
      s.voyage = null; s.aboard = false; s.c = b.t[0]; s.r = b.t[1]; this.anim = null;
      if (v.role === "crew" && v.earned) { s.purse = U.rn(s.purse + v.earned, 2); }
      await this.ui.say(`<b>${U.esc(v.ship)}</b> makes fast in ${U.esc(b.name)}. You go ashore${v.role === "crew" ? ` with your pay, 🟡 ${v.earned || 0}` : ""}.`);
      this.afterStep();
      return;
    }
    v.departAt = s.clock + stop.stay;
    await this.ui.say(`<b>${U.esc(v.ship)}</b> calls at ${U.esc(b.name)} and sails again <b>${AZ.Clock.fmt(v.departAt)}</b>, in ${stop.stay} hours. Go ashore if you like (Space), but be back aboard in time.`);
    this.afterStep();
  },
  async shipTalk() {
    const s = this.s, v = s.voyage, U = AZ.U, w = this.w;
    const next = v.stops[v.leg], atSea = v.state === "sea";
    const opts = [{ id: "cap", label: "Talk to the captain" }, { id: "pax", label: "Talk to the other passengers" }];
    if (atSea) opts.push({ id: 3, label: "Rest 3 hours (the ship sails on)" }, { id: 6, label: "Rest 6 hours" }, { id: "dawn", label: "Sleep until dawn" },
      { id: "watch", label: `Watch from the deck (normal pace)${!s.voyPause && !this.fast ? " ✓" : ""}` }, { id: "fast", label: `Let the days pass quickly${this.fast && !s.voyPause ? " ✓" : ""}` },
      { id: "pause", label: `Hold here and look around (time stops until you act)${s.voyPause ? " ✓" : ""}` }, { id: "port", label: "Let the days pass until the next port" });
    else opts.push({ id: "wait", label: "Wait aboard until she sails" });
    opts.push({ id: "back", label: "Back" });
    const k = await this.ui.choose(`Aboard <b>${U.esc(v.ship)}</b>, ${U.esc(v.captain)} master · bound for ${U.esc(next ? next.name : "?")} · ${v.role} · ${AZ.Clock.fmt(s.clock)}`, opts, { cancel: opts.length - 1 });
    const o = opts[k];
    if (o.id === "cap") {
      const sh = w.P.states[v.flag];
      return this.ui.say([`${U.esc(v.captain)} sails under the flag of ${U.esc(sh?.fullName || "no state")} ${AZ.T("data")}. ${U.cap(v.why)}.`,
        `Itinerary: ${v.stops.map((x, i) => `${i < v.leg ? "<s>" : ""}${U.esc(x.name)}${x.stay ? ` (${x.stay} h in port)` : ""}${i < v.leg ? "</s>" : ""}`).join(" → ")} ${AZ.T("mixed")}.`]);
    }
    if (o.id === "pax") { const rm = this.know.rumour(s.c, s.r, U.rng(`${s.seed}:pax:${Math.floor(s.clock / 24)}`), this); s.clock += 1; this.advanceVoyage(0); return this.ui.say(rm ? `A fellow passenger: “${rm}` : "They are seasick and say nothing."); }
    if (o.id === "wait") { s.clock = v.departAt; this.dirty = true; return; }
    if (o.id === 3 || o.id === 6) { this.advanceVoyage(o.id); this.slept(); return; }
    if (o.id === "dawn") { this.advanceVoyage(Math.max(1, AZ.Clock.nextDawn(s.clock, this.lat()) - s.clock)); this.slept(); return; }
    if (o.id === "watch") { s.voyPause = false; this.fast = false; }
    if (o.id === "fast") { s.voyPause = false; this.fast = true; }
    if (o.id === "pause") { s.voyPause = true; this.ui.toast("Holding. The ship moves only while time passes: rest, talk, or press F."); }
    if (o.id === "port") { s.voyPause = false; this.fast = true; this._toPort = true; }
    this.dirty = true;
  },
  // let a number of hours pass aboard: the ship sails on without drawing every step
  advanceVoyage(hours) {
    const s = this.s, v = s.voyage;
    if (!v || v.state !== "sea") return;
    const until = s.clock + hours;
    let guard = 0;
    while (s.voyage === v && v.state === "sea" && guard++ < 5000) {
      if (!v.course[v.pos + 1]) { this.dock(); break; }
      if (s.clock >= until && hours > 0) break;
      this.anim = null; this.voyageStep(); this.anim = null;
      if (this.ui.busy()) break;
      if (hours === 0) break;
    }
    this.dirty = true;
  },
  async market(b) {
    const s = this.s, w = this.w, U = AZ.U, P = AZ.Prices;
    for (;;) {
      const ration = P.ration(w, b), cap = this.capacity(), eat = this.eaters();
      const opts = [];
      for (const n of [1, 5, 10, 20, 40]) opts.push({ label: `Food for ${n} day${n > 1 ? "s" : ""}${eat > 1 ? ` for ${eat} people (${n * eat} rations)` : ""}: 🟡 ${U.rn(n * eat * ration, 2)}`, n, kind: "food", disabled: s.purse < n * eat * ration || s.sup.food + n * eat > cap.food });
      opts.push({ label: `Trade goods (you carry ${this.goodsCount()} of ${cap.goods} units)`, kind: "goods" });
      opts.push({ label: "Back", kind: "back" });
      const k = await this.ui.choose(`<b>${U.esc(b.name)} market</b> · 🟡 ${U.rn(s.purse, 2)} · food ${s.sup.food} rations · food here: ${U.esc(this.cheapFood(b))} ${AZ.T("data")}`, opts, { cancel: opts.length - 1 });
      const o = opts[k];
      if (o.kind === "back") return;
      if (o.kind === "goods") { await this.tradeGoods(b); continue; }
      if (o.kind === "food") { s.purse = U.rn(s.purse - o.n * eat * ration, 2); s.sup.food += o.n * eat; s.hunger = 0; delete s.cond.hungry; delete s.cond.starving; }
      this.dirty = true;
    }
  },
  // ------------------------------------------------------------------ trading goods between markets
  goodsCount() { return Object.values(this.s.goods || {}).reduce((a, n) => a + n, 0); },
  mkRec(mk, gid) { const s = this.s; s.mk = s.mk || {}; const m = s.mk[mk.i] = s.mk[mk.i] || {}; return (m[gid] = m[gid] || { f: 1, taken: 0 }); },
  goodQuote(b, gid) {
    const w = this.w, mk = AZ.Prices.market(w, b);
    if (!mk || !mk.goods[gid]) return null;
    const [stock, price] = mk.goods[gid], rec = this.mkRec(mk, gid), tax = AZ.Prices.tax(w, b);
    const p = price * rec.f;
    const makes = (b.production || {})[gid] > 0 || mk.centerBurgId === b.i;
    return { buy: AZ.U.rn(p * (1 + tax), 2), sell: AZ.U.rn(p * 0.85, 2), stock: Math.max(0, Math.floor(stock - rec.taken)), canBuy: makes && stock - rec.taken >= 1, mk, rec };
  },
  async tradeGoods(b) {
    const s = this.s, w = this.w, U = AZ.U;
    s.goods = s.goods || {}; s.basis = s.basis || {};
    for (;;) {
      const cap = this.capacity().goods, opts = [];
      const held = Object.entries(s.goods).filter(([, n]) => n > 0);
      for (const [gid, n] of held) {
        const q = this.goodQuote(b, gid), g = this.know.good(gid);
        opts.push(q ? { label: `Sell 1 ${U.esc(g.toLowerCase())} for 🟡 ${q.sell} (you have ${n}; paid ${U.rn(s.basis[gid] || 0, 2)} each)`, gid, kind: "sell", q } : { label: `${U.esc(g)}: nobody here buys it (you have ${n})`, disabled: true });
      }
      const mk = AZ.Prices.market(w, b);
      const here = mk ? Object.keys(mk.goods).map(gid => [gid, this.goodQuote(b, gid)]).filter(([, q]) => q && q.canBuy).sort((a, c) => c[1].stock - a[1].stock).slice(0, 10) : [];
      for (const [gid, q] of here) opts.push({ label: `Buy 1 ${U.esc(this.know.good(gid).toLowerCase())} for 🟡 ${q.buy} (${q.stock} in stock)`, gid, kind: "buy", q, disabled: s.purse < q.buy || this.goodsCount() >= cap });
      if (!here.length) opts.push({ label: `${U.esc(b.name)} makes nothing for sale on its market`, disabled: true });
      opts.push({ label: "Back", kind: "back" });
      const k = await this.ui.choose(`<b>${U.esc(b.name)}: goods</b> · 🟡 ${U.rn(s.purse, 2)} · carrying ${this.goodsCount()}/${cap} units · prices from the ${U.esc(w.P.burgs[mk?.centerBurgId]?.name || "")} market, with ${Math.round(AZ.Prices.tax(w, b) * 100)}% sales tax; merchants buy at 85% ${AZ.T("data")}`, opts, { cancel: opts.length - 1 });
      const o = opts[k];
      if (!o || o.kind === "back") return;
      if (o.kind === "buy") {
        const n0 = s.goods[o.gid] || 0;
        s.basis[o.gid] = U.rn(((s.basis[o.gid] || 0) * n0 + o.q.buy) / (n0 + 1), 2);
        s.goods[o.gid] = n0 + 1; s.purse = U.rn(s.purse - o.q.buy, 2); o.q.rec.f *= 1.04; o.q.rec.taken += 1;
      } else if (o.kind === "sell") {
        s.goods[o.gid]--; s.purse = U.rn(s.purse + o.q.sell, 2); o.q.rec.f *= 0.96;
        const profit = U.rn(o.q.sell - (s.basis[o.gid] || 0), 2);
        this.log(`Sold ${U.esc(this.know.good(o.gid).toLowerCase())} in ${U.esc(b.name)} for 🟡 ${o.q.sell} (${profit >= 0 ? "+" : ""}${profit}).`);
      }
      this.dirty = true;
    }
  },
  cheapFood(b) {
    const w = this.w, mk = AZ.Prices.market(w, b);
    if (!mk) return "no market";
    const f = w.P.goods.filter(g => (g.tags || []).includes("food") && mk.goods[g.i]).sort((a, c) => mk.goods[a.i][1] - mk.goods[c.i][1])[0];
    return f ? `${f.name.toLowerCase()} at ${mk.goods[f.i][1]} a unit, ${Math.round((this.w.P.states[b.state]?.salesTax || 0) * 100)}% tax` : "no food on the market";
  },
});

// ---------------------------------------------------------------------------------------------
// Side stories (teal), leads, errands and the reasoning behind the route.
//   Errands are posted on town notice boards and come from the map: what a town makes and who
//   buys it (trade), towns stricken by zones (relief), the state's friends and enemies
//   (letters), its wars (dispatches), strange places nearby (investigations) and faith seats
//   (offerings). Rumours, sightings and libraries add leads you can follow.
// ---------------------------------------------------------------------------------------------
Object.assign(AZ.Game.prototype, {
  startThread(def, quiet) {
    if (!def) return;
    const s = this.s;
    if (s.threads.some(t => t.title === def.title && !t.done)) return;
    const th = { id: s.threads.length, title: def.title, steps: def.steps, phase: 0, done: false, outcome: "", deadline: def.deadline || null, giver: def.giver || null, why: def.why || "" };
    s.threads.push(th);
    this.log(`New side story: ${AZ.U.esc(th.title)}.`, "side");
    if (!quiet) this.ui.toast(`New side story: <b class="side">${AZ.U.esc(th.title)}</b>. ${AZ.U.esc(th.steps[0].text)}`, "teal");
  },
  stepTile(st) {
    const P = this.w.P, g = st.goal || {}, s = this.s;
    if (g.burg) return P.burgs[g.burg]?.t || null;
    if (g.marker != null) return P.markers.find(m => m.i === g.marker)?.t || null;
    if (g.unit) { const [st0, i] = g.unit.split(":").map(Number); return P.military.find(u => u.state === st0 && u.i === i)?.t || null; }
    if (g.temple != null) {
      const c = P.burgs.filter(b => b && b.temple && this.w.C.religion[b.cell] === g.temple).sort((a, b) => Math.hypot(a.t[0] - s.c, a.t[1] - s.r) - Math.hypot(b.t[0] - s.c, b.t[1] - s.r));
      return c[0]?.t || null;
    }
    return null;
  },
  threadSteps(b) {
    const out = [], w = this.w;
    const roles = new Set(this.know.townPeople(b, this).map(p => p.role));
    for (const th of this.s.threads) {
      if (th.done) continue;
      const st = th.steps[th.phase], g = st.goal || {};
      const roleHere = !g.role || roles.has(g.role) || (g.role === "Priest" && roles.has("Shrine-keeper")) || (g.role === "Captain of the watch" && roles.has("Elder"));
      if (!roleHere) continue;
      if (g.burg && g.burg === b.i) out.push([th, st]);
      else if (g.temple != null && b.temple && w.C.religion[b.cell] === g.temple) out.push([th, st]);
      else if (g.marker != null && (() => { const m = w.P.markers.find(x => x.i === g.marker); return m && Math.hypot(m.t[0] - b.t[0], m.t[1] - b.t[1]) <= 2; })()) out.push([th, st]);
      else if (g.farFrom && b.port && Math.hypot(b.t[0] - g.farFrom[0], b.t[1] - g.farFrom[1]) * w.miles >= g.mi) out.push([th, st]);
    }
    return out;
  },
  async completeStep(th, where) {
    const s = this.s, U = AZ.U, st = th.steps[th.phase];
    if (st.needs === "cargo" && ((s.goods || {})[this.tv.cargo] || 0) < 4) {
      th.done = true; th.outcome = "failed";
      this.log(`${U.esc(th.title)}: the consignment is gone.`, "side");
      return this.ui.say(`<b class="side">${U.esc(th.title)}</b>: there is nothing to deliver. ${s.flags.boarded ? "The pirates who boarded you took it" : "You sold some of it elsewhere"} ${AZ.T("mixed")}.`);
    }
    if (st.risk && U.rnd2(th.id, th.phase, s.seed % 9973) < st.risk) {
      th.done = true; th.outcome = "caught";
      const out = this.events.fx({ time: 24, stand: st.riskStand || [] }, `${U.esc(th.title)}: caught.`);
      return this.ui.say(`<b class="side">${U.esc(th.title)}</b>: the watch finds the letter sewn into your coat. A day in a cell, and your name in their book ${AZ.T("mixed")}.${out}`);
    }
    let reward = st.reward ? { ...st.reward } : null;
    let late = "";
    if (th.deadline && s.clock > th.deadline && reward) { if (reward.coin > 0) reward.coin = U.rn(reward.coin / 2, 1); delete reward.stand; late = " You are late: half the pay, and no thanks."; }
    if (st.needs === "cargo") { s.goods[this.tv.cargo] -= 4; delete s.flags.cargo; }
    const out = this.events.fx(reward, `${U.esc(th.title)}: ${U.esc(st.text)}${where ? " (" + U.esc(where.name || "") + ")" : ""}.`);
    th.phase++;
    if (th.phase >= th.steps.length) { th.done = true; th.outcome = "done"; }
    await this.ui.say(`<b class="side">${U.esc(th.title)}</b>: ${U.esc(st.text)}. ${th.done ? "Done." : "Next: " + U.esc(th.steps[th.phase].text) + "."}${late}${out}`);
  },
  async threadsAt(goal) {
    let hit = false;
    for (const th of this.s.threads) {
      if (th.done) continue;
      const g = th.steps[th.phase].goal || {};
      if ((goal.marker != null && g.marker === goal.marker) || (goal.unit && g.unit === goal.unit)) { await this.completeStep(th); hit = true; }
    }
    return hit;
  },
  healCost(b) { const rel = this.w.C.religion[b.cell]; return rel === this.tv.faith || (this.s.stand.f[rel] || 0) >= 2 ? 0 : AZ.Prices.heal(this.w, b); },
  addLead(l) {
    const s = this.s;
    if (!l || s.leads.some(x => x.key === l.key)) return false;
    if (l.key.startsWith("m") && s.done_m.includes(+l.key.slice(1))) return false;
    s.leads.push(l);
    if (l.from === "rumour") this.ui.toast(`New lead: <b class="side">${AZ.U.esc(l.name)}</b> (${l.from})`, "teal");
    return true;
  },
  revealLeads(radiusTiles) {
    const s = this.s; let n = 0;
    for (const x of this.w.near(s.c, s.r, radiusTiles)) {
      if (x.kind !== "marker" || s.seen.m.includes(x.o.i)) continue;
      s.seen.m.push(x.o.i);
      if (this.addLead({ key: "m" + x.o.i, name: x.o.name, type: x.o.type, t: x.o.t, from: "read" })) n++;
    }
    return n;
  },
  activeThread() { return this.s.threads.find(t => !t.done && this.stepTile(t.steps[t.phase])) || this.s.threads.find(t => !t.done) || null; },
  // ------------------------------------------------------------------ the notice board
  questOffers(b) {
    const s = this.s, w = this.w, P = w.P, U = AZ.U, T = AZ.T, out = [];
    const week = Math.floor(s.clock / 168), rnd = U.rng(`${s.seed}:q:${b.i}:${week}`);
    const d = x => Math.hypot(x.t[0] - b.t[0], x.t[1] - b.t[1]);
    const mi = x => Math.round(d(x) * w.miles);
    const days = x => Math.ceil(mi(x) / 40) + 6;
    const near = (lo, hi) => P.burgs.filter(x => x && x !== b && d(x) >= lo && d(x) <= hi).sort((a, c) => d(a) - d(c));
    const gname = g => P.goods.find(x => x.i === +g)?.name || "goods";
    // trade: what this town makes, for a town that buys it
    for (const [g] of Object.entries(b.production || {}).sort((a, c) => c[1] - a[1]).slice(0, 4)) {
      const dest = near(8, 160).find(x => (P.trade.buy[x.i] || {})[g]);
      if (!dest) continue;
      const here = AZ.Prices.goodPrice(w, b, g) || 1, there = AZ.Prices.goodPrice(w, dest, g) || here * 1.2, units = 4;
      const cost = U.rn(here * units, 1), pay = U.rn(Math.max(there, here * 1.1) * units * 1.1 + mi(dest) * 0.003, 1);
      out.push({ title: `${gname(g)} for ${dest.name}`, cost, pay, why: `${b.name} makes ${gname(g).toLowerCase()}; ${dest.name} buys it on its market ${T("data")}. You buy ${units} units here at ${U.rn(here, 2)} and sell there at about ${U.rn(there, 2)} ${T("data")}.`,
        dist: mi(dest), deadline: s.clock + days(dest) * 24, giver: b.i,
        steps: [{ text: `Deliver ${units} ${gname(g).toLowerCase()} to the merchant in ${dest.name}`, goal: { burg: dest.i, role: "Merchant" }, reward: { coin: pay } }] });
      break;
    }
    // relief for a town in a zone
    for (const z of (this.sim ? [...this.sim.zones.values()].filter(z0 => !z0.over).map(z0 => ({ ...z0, cells: [...z0.cells] })) : P.zones)) {
      if (!/Disease|Disaster|Flood|Tsunami|Eruption|Avalanche/.test(z.type)) continue;
      const tb = P.burgs.filter(x => x && z.cells.includes(x.cell) && d(x) < 220).sort((a, c) => d(a) - d(c))[0];
      if (!tb || tb === b) continue;
      const need = z.type === "Disease" ? P.goods.find(x => /salt/i.test(x.name)) : P.goods.find(x => /grain/i.test(x.name));
      const price = need ? AZ.Prices.goodPrice(w, b, need.i) || 1 : 1, cost = U.rn(price * 2, 1);
      out.push({ title: `Relief for ${tb.name}`, cost, pay: U.rn(cost * 0.6 + 1, 1), why: `${tb.name} lies in the ${z.name} (${z.type.toLowerCase()}) ${T("data")}. The temple here gathers ${need ? need.name.toLowerCase() : "supplies"} for it.`,
        dist: mi(tb), deadline: s.clock + days(tb) * 24, giver: b.i,
        steps: [{ text: `Bring ${need ? need.name.toLowerCase() : "supplies"} to the priests of ${tb.name}`, goal: { burg: tb.i, role: "Priest" }, reward: { coin: U.rn(cost * 0.6 + 1, 1), stand: [["s", tb.state, 2], ["f", w.C.religion[tb.cell], 1]] } }] });
      break;
    }
    // letters along the state's friendships and enmities
    const st = P.states[b.state];
    if (st && st.diplomacy) {
      const rels = st.diplomacy.map((r, i) => ({ r, i })).filter(o => P.states[o.i] && o.i && o.i !== b.state && /Ally|Friendly|Enemy|Suspicion|Rival/.test(o.r));
      for (const o of rels.sort(() => rnd() - 0.5).slice(0, 2)) {
        const cap = P.burgs[P.states[o.i].capital];
        if (!cap || d(cap) > 400) continue;
        const enemy = /Enemy|Rival/.test(o.r);
        const pay = U.rn(1 + mi(cap) * (enemy ? 0.008 : 0.004), 1);
        out.push({ title: `${enemy ? "A letter smuggled into" : "A letter for"} ${cap.name}`, pay, cost: 0,
          why: `${st.name} stands to ${P.states[o.i].name} as “${o.r}” ${T("data")}. ${enemy ? "Their watch searches strangers." : "The chancery wants it carried by someone without a uniform."}`,
          dist: mi(cap), deadline: s.clock + days(cap) * 24, giver: b.i,
          steps: [{ text: `Hand the letter to the watch in ${cap.name}`, goal: { burg: cap.i, role: "Captain of the watch" }, reward: { coin: pay, stand: [["s", b.state, 1]] }, risk: enemy ? 0.4 : 0, riskStand: [["s", o.i, -2]] }] });
      }
      // dispatches to the state's army in a war
      const war = (st.campaigns || []).find(c => c.end == null);
      const reg = war && P.military.filter(u => u.state === b.state && !u.naval).sort((a, c) => d(a) - d(c)).find(u => d(u) > 6 && d(u) < 300);
      if (reg) out.push({ title: `Dispatches for the ${reg.name}`, pay: U.rn(1 + mi(reg) * 0.005, 1), cost: 0, why: `${st.name} is at war: the ${war.name}, since ${war.start} ${T("data")}. The ${reg.name} is ${this.know.dirDist(b.t[0], b.t[1], reg.t).txt} ${T("data")}.`,
        dist: mi(reg), deadline: s.clock + days(reg) * 24, giver: b.i, steps: [{ text: `Carry dispatches to the ${reg.name}`, goal: { unit: `${reg.state}:${reg.i}` }, reward: { coin: U.rn(1 + mi(reg) * 0.005, 1), stand: [["s", b.state, 1]] } }] });
    }
    // strange places nearby
    const m = w.near(b.t[0], b.t[1], 80).filter(n => n.kind === "marker" && /monster|ruin|dungeon|necrop|burial|rift|cave|portal|statue/.test(n.o.type) && !s.done_m.includes(n.o.i)).sort(() => rnd() - 0.5)[0];
    if (m) out.push({ title: `The truth about the ${m.o.name}`, pay: U.rn(1.5 + m.d * w.miles * 0.004, 1), cost: 0, why: `${b.name} wants to know what is at the ${m.o.name}, ${this.know.dirDist(b.t[0], b.t[1], m.o.t).txt} ${T("data")}.`,
      dist: Math.round(m.d * w.miles), deadline: s.clock + (Math.ceil((m.d * w.miles * 2) / 30) + 6) * 24, giver: b.i,
      steps: [{ text: `See the ${m.o.name} for yourself (walk there and press Space beside it)`, goal: { marker: m.o.i } }, { text: `Tell them in ${b.name} what you found`, goal: { burg: b.i, role: "Townsfolk" }, reward: { coin: U.rn(1.5 + m.d * w.miles * 0.004, 1) } }] });
    // an offering for the faith's seat
    const rel = P.religions[w.C.religion[b.cell]], seat = rel && P.burgs.find(x => x && x.cell === rel.center);
    if (seat && seat !== b && d(seat) < 300) out.push({ title: `An offering for ${seat.name}`, pay: 0, cost: 0, why: `${b.name} keeps the ${rel.name}; its seat is ${seat.name} ${T("data")}.`,
      dist: mi(seat), deadline: null, giver: b.i, steps: [{ text: `Carry the offering to the temple in ${seat.name}`, goal: { burg: seat.i, role: "Priest" }, reward: { stand: [["f", rel.i, 2]] } }] });
    if (this.tv.trait === "well-connected") for (const o of out) { if (o.pay) o.pay = U.rn(o.pay * 1.2, 2); for (const st of o.steps) if (st.reward && st.reward.coin > 0) st.reward.coin = U.rn(st.reward.coin * 1.2, 2); }
    return out.filter(o => !s.threads.some(t => t.title === o.title));
  },
  async noticeBoard(b) {
    const s = this.s, U = AZ.U;
    for (;;) {
      const offers = this.questOffers(b);
      const opts = offers.map(o => ({ label: `◆ ${U.esc(o.title)} · ${U.num(o.dist)} mi${o.pay ? ` · pays 🟡 ${o.pay}` : ""}${o.cost ? ` · costs 🟡 ${o.cost} now` : ""}${o.deadline ? ` · within ${Math.round((o.deadline - s.clock) / 24)} days` : ""}`, cls: "side", o, disabled: s.purse < (o.cost || 0) }));
      if (!opts.length) opts.push({ label: "Nothing posted but tax notices", disabled: true });
      opts.push({ label: "Back" });
      const k = await this.ui.choose(`<b>${U.esc(b.name)}: notice board</b> · 🟡 ${U.rn(s.purse, 1)}`, opts, { cancel: opts.length - 1 });
      const o = opts[k].o;
      if (!o) return;
      const k2 = await this.ui.choose(`<b class="side">${U.esc(o.title)}</b><br>${o.why}<br>${U.esc(o.steps.map(x => x.text).join(", then "))}.`, [{ label: `Take it${o.cost ? ` (pay 🟡 ${o.cost} now)` : ""}` }, { label: "Leave it" }], { cancel: 1 });
      if (k2 !== 0) continue;
      if (o.cost) s.purse = U.rn(s.purse - o.cost, 2);
      this.startThread({ title: o.title, steps: o.steps, deadline: o.deadline, giver: o.giver, why: o.why });
    }
  },
  // ------------------------------------------------------------------ why the plan goes this way
  legReasons(cp) {
    const w = this.w, P = w.P, U = AZ.U, T = AZ.T, jr = this.jr, out = [];
    const seg = cp.legIn;
    if (!seg) {
      const o = cp.place.burg;
      const destRel = w.C.religion[jr.segs[jr.segs.length - 1].to];
      out.push(`The road starts in ${U.esc(o.name)}, capital and port of ${U.esc(P.states[o.state]?.fullName)} ${T("data")}. Its end is ${U.esc(jr.dest.name)}, which keeps the ${U.esc(P.religions[destRel]?.name)} ${T("data")}: that is why a pilgrim goes there.`);
      return out;
    }
    const from = jr.cps[cp.i - 1].place, to = cp.place;
    const fb = from.burg, tb = to.burg;
    const fFeat = fb ? w.C.feature[fb.cell] : null, tFeat = tb ? w.C.feature[tb.cell] : null;
    if (fb && tb && to.at) {
      if (fFeat !== tFeat) out.push(`No land joins ${U.esc(fb.name)} (${U.esc(P.features[fFeat]?.name || "")}) and ${U.esc(tb.name)} (${U.esc(P.features[tFeat]?.name || "")}): it has to be by water ${T("data")}.`);
      else out.push(`${U.esc(fb.name)} and ${U.esc(tb.name)} share ${U.esc(P.features[tFeat]?.name || "one landmass")}; ${U.num(Math.round(Math.hypot(fb.t[0] - tb.t[0], fb.t[1] - tb.t[1]) * w.miles))} mi as the crow flies, but the plan goes by water ${T("mixed")}.`);
    }
    const days = seg.hoursPerDay >= 24 ? seg.travelHours / 24 : seg.travelHours / seg.hoursPerDay;
    out.push(`${U.esc(seg.transport)}: ${seg.speed} mph for ${seg.hoursPerDay} hours a day, ${U.num(seg.miles)} mi, about ${Math.round(days)} days ${T("data")}. ${AZ.vesselClass(seg.transport) === "ship" ? "A ship keeps the sea day and night and is booked as a passenger." : "A boat is hired with its crew; it sails by day and anchors at night, and goes where ships do not."}`);
    if (tb && to.at) {
      const lanes = new Set();
      const h = w.harbour(tb, seg.cls || "boat");
      if (h) for (let dr = -3; dr <= 3; dr++) for (let dc = -3; dc <= 3; dc++) { const rt = w.inb(h.t[0] + dc, h.t[1] + dr) && w.route(h.t[0] + dc, h.t[1] + dr); if (rt && rt.group === "searoutes") lanes.add(rt.name); }
      out.push(lanes.size ? `${U.esc(tb.name)} lies on ${[...lanes].slice(0, 2).map(U.esc).join(" and ")} ${T("data")}.` : `No named sea lane reaches ${U.esc(tb.name)} ${T("data")}: ships on regular runs will not call there, which is why the plan hires its own boat.`);
      const rel = P.religions.find(r => r && r.center === tb.cell);
      if (rel) out.push(`${U.esc(tb.name)} is the seat of the ${U.esc(rel.name)} (${rel.type.toLowerCase()}) ${T("data")}.`);
      if (tb.capital) out.push(`It is the capital of ${U.esc(P.states[tb.state]?.fullName)}: markets, a temple${tb.walls ? ", walls" : ""} ${T("data")}.`);
      const stance = tb.state ? this.know.rel(this.tv.homeState, tb.state) : null;
      if (stance) out.push(`${U.esc(P.states[tb.state].name)} stands to your people as “${stance}” ${T("data")}.`);
    } else {
      const near = to.burg;
      if (near) out.push(`The plan stops at sea ${U.esc(to.name)}: by its own timing the boat's sailing hours run out about here ${T("mixed")}; ${U.esc(near.name)} (${U.esc(P.states[near.state]?.name || "unclaimed")}) gives a lee and lights ${T("data")}.`);
    }
    if (seg.nights?.length) out.push(`The plan anchors ${seg.nights.length} times on the way (shown as small gold marks on the course) ${T("mixed")}.`);
    const hz = new Map();
    for (const [c, r] of seg.chain) for (const n of w.near(c, r, 3)) if (n.kind === "marker" && /pirate|monster/.test(n.o.type)) hz.set(n.o.i, n.o);
    if (hz.size) out.push(`Hazards on the course: ${[...hz.values()].map(m => U.esc(m.name)).join(", ")} ${T("data")}.`);
    const crossed = new Set(), avoided = new Set();
    for (const [c, r] of seg.chain) for (const z of w.zonesOfCell(w.cell(c, r))) crossed.add(z.name);
    for (const z of P.zones) {
      if (crossed.has(z.name)) continue;
      const zc = z.cells[0];
      if (zc != null && seg.chain.some(([c, r], k) => k % 8 === 0 && Math.hypot(w.C.cx[zc] - w.centre(c, r)[0], w.C.cy[zc] - w.centre(c, r)[1]) < 40)) avoided.add(z.name);
    }
    if (crossed.size) out.push(`The course crosses the ${[...crossed].map(U.esc).join(", ")} ${T("data")}.`);
    if (avoided.size) out.push(`It keeps clear of the ${[...avoided].map(U.esc).join(", ")} ${T("data")}.`);
    const others = P.burgs.filter(x => x && x.port && x !== fb && x !== tb && seg.chain.some(([c, r], k) => k % 6 === 0 && Math.hypot(x.t[0] - c, x.t[1] - r) < 20)).slice(0, 4);
    if (others.length) out.push(`Other harbours near the way, if you choose differently: ${others.map(x => U.esc(x.name)).join(", ")} ${T("data")}.`);
    return out;
  },
});

// rumours become leads when the thing is near enough to follow
AZ.Know.prototype.rumourLead = function (g, f, d) {
  if (!g || d > 1500) return;
  const key = f.kind === "marker" ? `m${this.P.markers.find(m => m.name === f.name && m.t === f.t)?.i ?? f.name}` : `r:${f.kind}:${f.name}`;
  g.addLead({ key, name: f.kind === "war" ? `${f.name} (${f.a} against ${f.d})` : f.name, type: f.type || f.kind, t: f.t, from: "rumour" });
};

// ---------------------------------------------------------------------------------------------
// Screens: HUD, minimap, world map, journal (with the route and its reasons), help, menu, title.
// ---------------------------------------------------------------------------------------------
Object.assign(AZ.Game.prototype, {

  hud() {
    const s = this.s, w = this.w, U = AZ.U, el = this.ui.el, cell = w.cell(s.c, s.r);
    const b = this.burgHere(), land = w.isLand(s.c, s.r);
    const place = b ? (w.burgAt.get(w.idx(s.c, s.r)) ? b.name : `${b.name} harbour`) : land ? (w.C.province[cell] ? w.P.provinces[w.C.province[cell]].name : w.C.state[cell] ? w.P.states[w.C.state[cell]].name : "Neutral lands") : w.waterName(s.c, s.r);
    const terr = land ? `${w.P.biomes[w.C.biome[cell]].name} · ${w.heightStr(w.h(s.c, s.r))}` : `depth ${w.heightStr(w.h(s.c, s.r), true)}`;
    const lat = this.lat(), light = AZ.Clock.light(s.clock, lat), season = AZ.Clock.season(lat, s.clock), today = AZ.Clock.today(w.tempC(s.c, s.r), lat, s.clock, !land);
    const wx = this.weather();
    const conds = Object.keys(s.cond).map(k => AZ.COND[k]?.label || k).join(", ");
    el.loc.innerHTML = `<div class="big">${U.esc(place)}</div><div>${U.esc(terr)} · ${w.temp(today)} · ${wx.label}</div><div>${AZ.Clock.fmt(s.clock)} · ${light.phase} · ${season}</div>` +
      `<div class="dim">🟡 ${U.rn(s.purse, 2)} · food ${s.sup.food}${this.goodsCount() ? ` · goods ${this.goodsCount()}` : ""} · awake ${Math.round(s.awake || 0)} h${conds ? ` · <span class="late">${conds}</span>` : ""}</div>`;
    let trip = "";
    const here = this.cpHere(), next = this.cpNext();
    if (this.jr) {
      if (here) {
        const pend = this.pendingActs(here.place.burg && here.place.at ? here.place.burg : null);
        trip += `<div class="hook">At checkpoint ${here.i}: ${U.esc(here.place.name)}</div>` + (pend.length ? `<div>★ ${pend.map(a => U.esc(a.label)).join("; ")}</div>` : "");
      }
      if (next) {
        const t = next.tile, dd = this.know.dirDist(s.c, s.r, t);
        trip += `<div class="hook">Next ${next.i}/${this.jr.cps.length - 1}: ${U.esc(next.place.name)} <span class="arrow">${U.arrow(t[0] - s.c, t[1] - s.r)}</span> ${U.num(dd.mi)} mi</div>` +
          `<div class="dim">par ${AZ.Clock.fmt(next.parArrive)} (${s.clock > next.parArrive ? `${AZ.Clock.span(s.clock - next.parArrive)} past` : `${AZ.Clock.span(next.parArrive - s.clock)} left`})${next.legIn ? ` · plan: ${U.esc(next.legIn.transport)}` : ""}</div>`;
      } else if (s.done) trip += `<div class="hook">${U.esc(this.jr.J.name)}: complete</div>`;
    }
    const v = s.voyage, bo = s.vessel;
    if (v) trip += `<div>${s.aboard ? "Aboard" : "Booked on"} ${U.esc(v.ship)} (${v.role}) → ${U.esc(v.stops[v.leg]?.name || "")}${v.state === "port" ? ` · sails ${AZ.Clock.fmt(v.departAt)}` : ""}${s.voyPause ? " · ⏸ holding (P)" : this.fast ? " · ⏩ (F)" : ""}</div>`;
    else if (bo) trip += `<div>${s.aboard ? "Aboard" : "Ashore; your boat waits"}: ${U.esc(bo.kind)} (${bo.mode})${bo.crew ? ` · crew ${bo.crew}, morale ${Math.round(bo.morale)}${bo.strikes ? `, strikes ${bo.strikes}/3` : ""}` : " · no crew"}${s.auto ? ' · <b class="hook">autopilot</b>' : ""}</div>`;
    else if (s.auto) trip += `<div class="dim">walking to the waypoint · F to stop</div>`;
    if (!this.jr) trip = `<div class="hook">Sandbox · ${this.sim ? "a moving world" : "a still world"}</div>` + trip;
    if (s.party && s.party.length) trip += `<div class="dim">With ${s.party.map(p => U.esc(p.name)).join(", ")}</div>`;
    el.trip.innerHTML = trip + this.threadLine();
    const lens = AZ.LENSES[this.lensIdx];
    if (lens.id !== "none") { el.legend.style.display = "block"; el.legend.innerHTML = `<b>${lens.name}</b> (L)<br>${U.esc(lens.label(w, cell, s.c, s.r) ?? "")}`; }
    else el.legend.style.display = "none";
    if (this.inspectOn) el.panel.innerHTML = this.know.inspect(s.c, s.r, this) + `<p class="dim">I to close · tags: ${AZ.T("data")} file ${AZ.T("mixed")} rule on data ${AZ.T("new")} invented</p>`;
    this.mini();
  },
  threadLine() {
    const th = this.activeThread(), U = AZ.U, s = this.s;
    if (!th) return "";
    const st = th.steps[th.phase], t = this.stepTile(st);
    const dd = t ? this.know.dirDist(s.c, s.r, t) : null;
    const due = th.deadline ? ` · ${s.clock > th.deadline ? "late" : `${Math.ceil((th.deadline - s.clock) / 24)} d left`}` : "";
    return `<div class="side">◆ ${U.esc(th.title)}</div><div class="dim">${U.esc(st.text)}${dd && dd.mi > 1 ? ` · <span class="side">${U.arrow(t[0] - s.c, t[1] - s.r)}</span> ${U.num(dd.mi)} mi` : ""}${due}</div>`;
  },
  journal() {
    const s = this.s, U = AZ.U, jr = this.jr, tv = this.tv, w = this.w;
    const cpRows = jr ? jr.cps.map(cp => {
      const rec = s.cpRec[cp.i] || {};
      const acts = cp.acts.map(a => `${(rec.acts || {})[a.id] ? "✓" : "·"} ${U.esc(a.label)}`).join("<br>");
      const d = rec.arrive != null ? rec.arrive - cp.parArrive : null;
      const nights = cp.legIn && cp.legIn.nights && cp.legIn.nights.length ? `<div class="dim">${cp.legIn.nights.length} nights at anchor by the plan</div>` : "";
      return `<tr class="${cp.i === s.cp ? "cur" : ""}"><td>${cp.i}</td><td>${U.esc(cp.place.name)}${cp.legIn ? `<div class="dim">${U.esc(cp.legIn.name)} · ${U.esc(cp.legIn.transport)} · ${U.num(cp.legIn.miles)} mi</div>` : ""}${nights}</td><td>${AZ.Clock.fmt(cp.parArrive)}</td><td>${rec.skipped ? "skipped" : rec.arrive != null ? AZ.Clock.fmt(rec.arrive) : "—"}</td><td class="${d > 24 ? "late" : ""}">${d != null ? this.deltaTextAt(d) : ""}</td><td>${acts}</td></tr>` +
        `<tr><td></td><td colspan="5" class="why">${this.legReasons(cp).join(" ")}</td></tr>`;
    }).join("") : "";
    const leads = s.leads.filter(l => typeof l === "object" && !(l.key.startsWith("m") && s.done_m.includes(+l.key.slice(1))));
    const cnt = (k, list) => `${s.seen[k].length} of ${w.P[list].filter(x => x && !x.removed).length - (list === "states" || list === "cultures" || list === "religions" ? 1 : 0)}`;
    const v = s.vessel;
    this.ui.modal(`<div class="sheet"><h2>Journal</h2>
      <h3>The traveller ${AZ.T("new")}</h3><p><b>${U.esc(tv.name)}</b>, ${tv.age}, ${U.esc(tv.trade)} (${U.esc(tv.kindLabel || "")}; ${U.esc(AZ.TRAITS[tv.trait]?.label || "")}: ${U.esc(AZ.TRAITS[tv.trait]?.text || "")}).${s.party && s.party.length ? ` The company: ${s.party.map(p => `${U.esc(p.name)} (${U.esc(p.role)})`).join(", ")}.` : ""} ${U.cap(U.esc(tv.why))}. ${w.P.cultures[tv.culture].name}; faith: ${w.P.religions[tv.faith]?.name}. Carries ${U.esc(tv.token)}.</p>
      <h3>Purse, stores, condition, standing</h3><p>🟡 ${U.rn(s.purse, 2)} · food ${s.sup.food} rations · goods: ${Object.entries(s.goods || {}).filter(([, n]) => n > 0).map(([g, n]) => `${n} ${U.esc(this.know.good(g).toLowerCase())}`).join(", ") || "none"} · ${Object.keys(s.cond).map(k => AZ.COND[k]?.label || k).join(", ") || "well"}${v ? ` · ${U.esc(v.kind)} (${v.mode}), crew ${v.crew}, morale ${Math.round(v.morale)}` : ""} · ${[...Object.entries(s.stand.f).map(([i, n]) => `${U.esc(w.P.religions[i]?.name)} ${n > 0 ? "+" : ""}${n}`), ...Object.entries(s.stand.s).map(([i, n]) => `${U.esc(w.P.states[i]?.name)} ${n > 0 ? "+" : ""}${n}`)].join(" · ") || "no standing earned or lost yet"} ${AZ.T("mixed")}</p>
      ${jr ? `<h3>The route: checkpoints, par and the reasons ${AZ.T("mixed")}</h3><p class="dim">The map's journey is the plan: par times from dawn on Day 1 with each mode's speed and hours a day. It is not a rule: take another ship, hire a boat, walk, skip a checkpoint. Reaching ${U.esc(jr.dest.name)} ends the pilgrimage.</p>
      <table class="plan"><tr><th>#</th><th>Checkpoint and leg</th><th>Par</th><th>Record</th><th>Against par</th><th>The plan's tasks</th></tr>${cpRows}</table>` : ""}

      <h3>The plan is par, not a rule</h3><p>The map's journey gives checkpoints, par times and tasks (★, gold). Do the tasks yourself: book passage, give alms, take a room, anchor for the night. Take another ship, hire a boat, walk, or skip a checkpoint; reaching the last one ends the pilgrimage.</p>
      <h3>Ships and boats</h3><p>A <b>booked ship</b> has a captain with his own itinerary and a sailing time; it does not wait. Bring your own food. If you work the passage (some trades can), you pay no fare and are paid at the end. A <b>hired boat</b> is yours to steer: you pay wages and hire each dawn and feed the crew. They call for anchor at dusk and shelter in storms; overrule them and morale falls; low morale ends in mutiny.</p>

  worldMap() {

    ui.modal(`<div class="mapwrap"><div class="maphead"><b>World map</b> · ${U.esc(w.P.world.name)} · lens: <span id="mlens">${AZ.LENSES[this.lensIdx].name}</span> · click: set a teal waypoint · L: lens · M/Esc: close<br><span class="dim">Lines you know (N to show or hide): blue by sea, tan by road, red dashed if last heard not running</span></div><canvas id="wmap" width="${Math.round(w.cols * sc)}" height="${Math.round(w.rows * sc)}"></canvas><div id="minfo" class="dim">Brighter ground is ground you have seen.</div></div>`);

        ctx.beginPath(); sg.chain.forEach(([c, r], i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, (c + 0.5) * sc, (r + 0.5) * sc)); ctx.stroke();

      // the passenger network as you know it: lines you have read on timetables or heard of
      if (this.sim && this._showLines !== false) for (const [id, seen] of Object.entries(s.lineSeen || {})) {
        const L = this.sim.lines[+id]; if (!L) continue;
        const A = w.P.burgs[L.from], B = w.P.burgs[L.to];
        ctx.strokeStyle = !seen.ok ? "rgba(255,110,90,0.8)" : L.mode === "sea" ? "rgba(140,220,255,0.75)" : "rgba(230,190,120,0.85)";
        ctx.setLineDash(seen.ok ? [] : [3, 3]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo((A.t[0] + 0.5) * sc, (A.t[1] + 0.5) * sc); ctx.lineTo((B.t[0] + 0.5) * sc, (B.t[1] + 0.5) * sc); ctx.stroke(); ctx.setLineDash([]);
      }
      if (this.jr) for (const sg of this.jr.segs) { ctx.fillStyle = "#f5c542"; ctx.fillRect(sg.place.tile[0] * sc - 3, sg.place.tile[1] * sc - 3, 6, 6); }
      for (const l of s.leads) if (l && l.t) { ctx.fillStyle = "#4fd1c5"; ctx.fillRect(l.t[0] * sc - 2, l.t[1] * sc - 2, 4, 4); }
      if (s.waypoint) { ctx.strokeStyle = "#4fd1c5"; ctx.lineWidth = 2; ctx.strokeRect(s.waypoint[0] * sc - 5, s.waypoint[1] * sc - 5, 10, 10); }
      if (s.vessel && !s.aboard) { ctx.fillStyle = "#fff"; ctx.fillRect(s.vessel.c * sc - 3, s.vessel.r * sc - 3, 6, 6); }
      ctx.fillStyle = "#ff3b3b"; ctx.beginPath(); ctx.arc(s.c * sc, s.r * sc, 5, 0, 7); ctx.fill();
    };
    draw();
    cv.onclick = e => {
      const rect = cv.getBoundingClientRect(), c = Math.floor(((e.clientX - rect.left) / rect.width) * w.cols), r = Math.floor(((e.clientY - rect.top) / rect.height) * w.rows);
      s.waypoint = [c, r];
      const cell = w.cell(c, r), b = w.near(c, r, 3).find(n => n.kind === "burg");
      const lensNow = AZ.LENSES[this.lensIdx], lensWord = lensNow.id !== "none" ? `<b>${lensNow.name}</b>: ${U.esc(lensNow.label(w, cell, c, r) ?? "")} · ` : "";
      document.getElementById("minfo").innerHTML = lensWord + `Waypoint: ${w.isLand(c, r) ? U.esc(w.P.biomes[w.C.biome[cell]].name) + " in " + U.esc(this.know.regionName(cell)) : U.esc(w.waterName(c, r))}${b ? " · near " + U.esc(b.o.name) : ""} · ${this.know.dirDist(s.c, s.r, [c, r]).txt} of you`;
      draw(); this.dirty = true;
    };
    ui.modalKey = e => {
      if (e.key === "l" || e.key === "L") { this.lensIdx = (this.lensIdx + (e.shiftKey ? -1 : 1) + AZ.LENSES.length) % AZ.LENSES.length; document.getElementById("mlens").textContent = AZ.LENSES[this.lensIdx].name; draw(); this.dirty = true; }
      else if (e.key === "n" || e.key === "N") { this._showLines = this._showLines === false; draw(); }
      else if (["Escape", "m", "M", "x", "X"].includes(e.key)) ui.closeModal();

  },
  pickList(head, items, foot = "", start = 0) {
    return new Promise(res => {
      let i = items[start] && !items[start].disabled ? start : Math.max(0, items.findIndex(x => !x.disabled));
      const render = () => {
        this.ui.el.modal.innerHTML = `<div class="title">${head}<ul class="choices big">${items.map((x, k) => `<li data-k="${k}" class="${k === i ? "sel" : ""}${x.disabled ? " dis" : ""}">${k === i ? "▶ " : ""}${x.html}</li>`).join("")}</ul>${foot}</div>`;
        this.ui.el.modal.querySelectorAll("li").forEach(li => (li.onclick = () => { const k = +li.dataset.k; if (!items[k].disabled) done(items[k].id); }));
        const sel = this.ui.el.modal.querySelector("li.sel"); if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "nearest" });
      };
      const done = id => { this.ui.modalKey = null; res(id); };
      this.ui.el.modal.classList.add("on");
      this.ui.modalKey = e => {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") { do { i = (i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; } while (items[i].disabled); render(); }
        else if (e.key === "ArrowLeft" || e.key === "ArrowRight") { if (items[i].cycle) { items[i].cycle(e.key === "ArrowRight" ? 1 : -1); done("__cycle"); } }
        else if (e.key === "Enter" || e.key === " ") done(items[i].id);
        else if (e.key === "Escape") done(null);
      };
      render();
    });
  },
  async title(fromMenu) {
    const U = AZ.U, w = this.w, jr = this.jr, can = this.hasSave() && !fromMenu;
    const head = `<div class="logo">${U.esc(jr ? jr.J.name : w.P.world.name)}</div><div class="sub">${U.esc(w.P.world.name)} (${U.esc(w.P.world.folder)}) · year ${w.W.calendar?.year || "?"} ${U.esc(w.W.calendar?.era || "")}</div>`;
    const foot = `<div class="dim">${U.num(w.cols)} × ${U.num(w.rows)} tiles of ${U.num(w.miles, 2)} mi · ${U.esc(w.P.grid.source)}</div>`;
    for (;;) {
      const a = await this.pickList(head, [{ id: "new", html: "New journey" }, ...(can ? [{ id: "cont", html: "Continue saved journey" }] : []), { id: "help", html: "How to play" }], foot);
      if (a === "help") { await new Promise(r => { this.help(); this.ui.onModalClose = r; }); continue; }
      if (a === "cont") { this.ui.closeModal(); this.loadGame(); this.started(); this.ui.toast(`Welcome back, ${U.esc(this.tv.name)}.`); return; }
      if (a !== "new") continue;
      const kinds = AZ.travellerKinds(w, jr);
      const kind = await this.pickList(`${head}<div class="sub">Who travels? ${AZ.T("mixed")} Each kind is found in this map's data.</div>`,
        [{ id: "__random", html: "Let chance decide" }, ...kinds.map(k => ({ id: k.id, html: `${U.esc(k.label)}<div class="dim small">${U.esc(k.blurb)}</div>` })), { id: "__back", html: "Back" }]);
      if (kind === null || kind === "__back") continue;
      let seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, doys = [80, 172, 266, 355], di = 0;
      const lat0 = jr ? w.latlon(...jr.origin.tile)[0] : 0;
      for (;;) {
        const tv = AZ.makeTraveller(w, jr, seed, kind === "__random" ? null : kind);
        AZ.Clock.doy0 = doys[di];
        const seasonHere = AZ.Clock.season(lat0, 6), dl = AZ.Clock.dayLength(lat0, doys[di]);
        const card = `<div class="card win"><div class="who">${U.esc(tv.kindLabel)} ${AZ.T("new")}</div><b>${U.esc(tv.name)}</b>, ${tv.age}, ${U.esc(tv.trade)} · ${U.esc(w.P.cultures[tv.culture].name)} · ${U.esc(w.P.religions[tv.faith]?.name || "no faith")}<br>${U.cap(U.esc(tv.why))}.<br><span class="dim">Purse 🟡 ${tv.purse}${tv.thread ? ` · side story: <span class="side">${U.esc(tv.thread.title)}</span>` : ""}</span></div>`;
        const items = [{ id: "begin", html: "Begin" }, { id: "roll", html: "Another traveller like this" },
          { id: "season", html: `Departure: ${seasonHere} in ${U.esc(jr ? jr.origin.name : "the start")} (${Math.round(dl)} h of daylight) ◀ ▶`, cycle: d => { di = (di + d + 4) % 4; } },
          { id: "back", html: "Back" }];
        const r = await this.pickList(head + card, items, "", this._sel || 0);
        this._sel = r === "__cycle" || r === "season" ? 2 : 0;
        if (r === "roll") { seed = (seed * 1664525 + 1013904223) >>> 0; continue; }
        if (r === "__cycle") continue;
        if (r === "season") { di = (di + 1) % 4; continue; }
        if (r === "begin") {
          this.ui.closeModal(); this.fresh(seed, tv.kind, doys[di]); this.started(); this.saveGame();
          if (jr) await this.ui.say(this.know.intro(this));
          if (this.tv.thread) this.ui.toast(`Side story: <b class="side">${U.esc(this.tv.thread.title)}</b>. ${U.esc(this.tv.thread.steps[0].text)}`, "teal");
          return;
        }

        if (r === "season") continue;
      }
    }
  }
});

AZ.boot = async function (packText) {
  const status = document.getElementById("status");
  try {
    const P = await AZ.loadPack(packText);
    const w = new AZ.World(P);
    const mk = (W, H) => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
    const art = new AZ.Art(w, mk);
    const cv = document.getElementById("view");
    const ren = new AZ.Renderer(w, art, cv, mk);
    const jr = P.journeys.length ? new AZ.Journey(w, P.journeys[0]) : null;
    let store;
    try { store = window.localStorage; store.getItem("x"); } catch (e) { store = { getItem: () => null, setItem: () => { throw e; } }; }
    const ui = new AZ.UI();
    const g = new AZ.Game(w, ren, ui, jr, store);
    AZ.game = g;
    const fit = () => { cv.width = window.innerWidth; cv.height = window.innerHeight; g.dirty = true; };
    window.addEventListener("resize", fit); fit();
    status.remove();
    const DK = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
    window.addEventListener("keydown", e => {
      if (e.target && e.target.tagName === "INPUT") return;
      if (ui.key(e)) { e.preventDefault(); return; }
      if (!g.s) return;
      const k = e.key;
      if (DK[k]) { e.preventDefault(); if (g.s.auto) g.setAuto(false); if (!g.held.includes(DK[k])) g.held.push(DK[k]); return; }
      if (k === " " || k === "Enter" || k === "z" || k === "Z") { e.preventDefault(); g.interact(); }
      else if ((k === "f" || k === "F") && g.s.voyage && g.s.aboard) { if (g.s.voyPause) { g.s.voyPause = false; g.fast = false; } else g.fast = !g.fast; g.ui.toast(g.fast ? "Days pass quickly (F for normal pace, P to hold)." : "Normal pace (F to speed up, P to hold)."); g.dirty = true; }
      else if ((k === "p" || k === "P") && g.s.voyage && g.s.aboard) { g.s.voyPause = !g.s.voyPause; g.ui.toast(g.s.voyPause ? "Holding: time passes only when you act (Space for the ship, R to rest)." : "Sailing on."); g.dirty = true; }
      else if (k === "f" || k === "F") { if (e.shiftKey) { g.fast = true; g.setAuto(true); } else { g.fast = false; g.setAuto(!g.s.auto); } }
      else if (k === "r" || k === "R") g.rest();
      else if (k === "i" || k === "I") g.toggleInspect();
      else if (k === "l" || k === "L") g.cycleLens(e.shiftKey ? -1 : 1);
      else if (k === "m" || k === "M") g.worldMap();
      else if (k === "j" || k === "J") g.journal();
      else if (k === "h" || k === "H" || k === "?") g.help();
      else if (k === "+" || k === "=") { ren.zoom = Math.min(4, ren.zoom + 1); g.dirty = true; }
      else if (k === "-" || k === "_") { ren.zoom = Math.max(1, ren.zoom - 1); g.dirty = true; }
      else if (k === "Escape" || k === "x" || k === "X") g.menu();
    });
    window.addEventListener("keyup", e => { const d = DK[e.key]; if (d) g.held = g.held.filter(x => x !== d); });
    window.addEventListener("blur", () => (g.held = []));
    // touch controls
    document.querySelectorAll("[data-pad]").forEach(btn => {
      const d = btn.dataset.pad;
      const on = e => { e.preventDefault(); if (g.s?.auto) g.setAuto(false); if (!g.held.includes(d)) g.held.push(d); };
      const off = e => { e.preventDefault(); g.held = g.held.filter(x => x !== d); };
      btn.addEventListener("pointerdown", on); btn.addEventListener("pointerup", off); btn.addEventListener("pointerleave", off); btn.addEventListener("pointercancel", off);
    });
    document.querySelectorAll("[data-key]").forEach(btn => btn.addEventListener("click", e => {
      e.preventDefault();
      window.dispatchEvent(new KeyboardEvent("keydown", { key: btn.dataset.key }));
    }));
    g.title();
    const loop = now => { g.frame(now); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } catch (err) {
    status.textContent = "Could not load the world: " + err.message;
    console.error(err);
  }
};

// ---------------------------------------------------------------------------------------------
// Stretching stores, and life aboard.
//   Fishing (mixed rule on data): a catch per fisher per six hours, better in coastal shallows
//   than open water, up to two and a half times better where the cell or a neighbour holds an aquatic resource
//   (Fish, Whales, Pearls in the map's goods), worse in rain, impossible in a storm. A boat's crew
//   fish too.
//   Foraging (mixed rule on data): the biome's habitability, the cell's own food output (the
//   rural production the converter computed with Azgaar's formula), the season and the weather.
//   Shipboard events: on a booked ship, now and then, drawn from the captain's flag and culture,
//   the ports on the itinerary and the faiths aboard. AZ.SHIP_EVENTS.rate is the daily chance.
// ---------------------------------------------------------------------------------------------
AZ.SHIP_EVENTS = { rate: 0.18 };

Object.assign(AZ.Game.prototype, {
  aquaticNear(cell) {
    const w = this.w, aq = new Set(w.P.goods.filter(g => (g.tags || []).includes("aquatic")).map(g => g.i));
    const has = c => aq.has(w.C.good[c]) || Object.keys(w.C.prod[String(c)] || {}).some(g => aq.has(+g) && w.C.type[c]);
    if (has(cell)) return 2;
    const x = w.C.cx[cell], y = w.C.cy[cell];
    // neighbouring cells: the cells under the 8 surrounding tiles at a cell's distance
    const [c0, r0] = w.tileAt(x, y);
    for (const [dc, dr] of [[10, 0], [-10, 0], [0, 10], [0, -10], [7, 7], [-7, -7], [7, -7], [-7, 7]]) {
      if (!w.inb(c0 + dc, r0 + dr)) continue;
      if (has(w.cell(c0 + dc, r0 + dr))) return 1;
    }
    return 0;
  },
  fishYield(c, r) {
    const w = this.w, s = this.s, U = AZ.U;
    const wx = AZ.Weather.at(w, c, r, s.clock);
    if (wx.kind === "storm") return { n: 0, why: "no one fishes in a storm" };
    const cell = w.cell(c, r), land = w.isLand(c, r);
    const waterHere = !land || w.bits(c, r).river;
    const adjWater = [[0, 1], [1, 0], [0, -1], [-1, 0]].some(([a, b]) => w.inb(c + a, r + b) && !w.isLand(c + a, r + b));
    if (!waterHere && !adjWater) return { n: 0, why: "no water to fish here" };
    const fishCell = !land ? cell : adjWater ? w.cell(...[[0, 1], [1, 0], [0, -1], [-1, 0]].map(([a, b]) => [c + a, r + b]).find(t => w.inb(...t) && !w.isLand(...t))) : cell;
    const shallow = land || w.h(c, r) >= 15 || [[0, 2], [2, 0], [0, -2], [-2, 0]].some(([a, b]) => w.isLand(c + a, r + b));
    const aq = this.aquaticNear(fishCell);
    const fishers = 1 + (s.aboard && s.vessel && !this.riding() ? s.vessel.crew || 0 : 0) + (this.tv.trait === "sea legs" ? 1 : 0);
    let per = (shallow ? 0.6 : 0.3) * (aq === 2 ? 2.5 : aq === 1 ? 1.6 : 1) * (land && w.bits(c, r).river ? 0.8 : 1) * (wx.kind === "rain" ? 0.8 : wx.kind === "snow" ? 0.6 : 1);
    const luck = 0.5 + U.rnd2(c, r, Math.floor(s.clock / 6));
    const n = Math.round(per * fishers * luck);
    const where = `${shallow ? "coastal shallows" : "open water"}${aq ? `, ${aq === 2 ? "rich" : "good"} grounds (the map's ${aq === 2 ? "resource here" : "resource nearby"})` : ""}`;
    return { n, fishers, where, why: "" };
  },
  forageYield(c, r) {
    const w = this.w, s = this.s, U = AZ.U;
    if (!w.isLand(c, r)) return { n: 0, why: "nothing to forage at sea" };
    const wx = AZ.Weather.at(w, c, r, s.clock);
    if (wx.kind === "storm") return { n: 0, why: "not in a storm" };
    const cell = w.cell(c, r), b = w.P.biomes[w.C.biome[cell]];
    const prod = w.C.prod[String(cell)] || {};
    let food = 0, game = false;
    for (const [g, u] of Object.entries(prod)) { const G = w.P.goods.find(x => x.i === +g); if ((G?.tags || []).includes("food")) { food += u; if (/game/i.test(G.name)) game = true; } }
    const season = AZ.Clock.season(w.latlon(c, r)[0], s.clock);
    const sf = { winter: 0.4, autumn: 0.8, spring: 0.9, summer: 1, "wet season": 1, "dry season": 0.6 }[season] ?? 1;
    const wf = { rain: 0.8, snow: 0.3, fog: 0.9 }[wx.kind] ?? 1;
    const per = ((b.habitability || 0) / 100) * 1.5 * (1 + Math.min(food, 8) / 3) * sf * wf + (game ? 0.5 : 0);
    const luck = 0.5 + U.rnd2(c, r, Math.floor(s.clock / 6) + 7);
    return { n: Math.round(per * luck), where: `${b.name}, habitability ${b.habitability}${food ? `, local food output ${U.rn(food, 1)}` : ""}${game ? ", game" : ""}; ${season}`, why: "" };
  },
  async provide(kind) {
    const s = this.s, U = AZ.U;
    const y = kind === "fish" ? this.fishYield(s.c, s.r) : this.forageYield(s.c, s.r);
    if (y.why) return this.ui.say(`You cannot: ${y.why}.`);
    s.clock += 6;
    this.awakeTick(6);
    s.sup.food += y.n;
    if (y.n > 0) { s.hunger = 0; delete s.cond.hungry; delete s.cond.starving; }
    this.log(`${kind === "fish" ? "Fished" : "Foraged"} six hours: ${y.n} ration${y.n === 1 ? "" : "s"}.`);
    this.dirty = true;
    return this.ui.say(`${kind === "fish" ? `Six hours with lines and nets${y.fishers > 1 ? `, ${y.fishers} of you` : ""}` : "Six hours of gathering, snaring and digging"}: <b>${y.n} ration${y.n === 1 ? "" : "s"}</b>. ${U.cap(y.where)} ${AZ.T("mixed")}.`);
  },
  // ------------------------------------------------------------------ life aboard a booked ship
  async shipEvent() {
    const s = this.s, v = s.voyage, w = this.w, U = AZ.U, T = AZ.T, P = w.P;
    if (!v || !s.aboard || v.state !== "sea") return;
    const day = Math.floor(s.clock / 24), rnd = U.rng(`${s.seed}:aboard:${day}`);
    const flag = P.states[v.flag], capCul = P.cultures[w.C.culture[P.burgs[v.from]?.cell]] || P.cultures[1];
    const ports = v.stops.map(x => P.burgs[x.b]).filter(Boolean);
    const paxPort = rnd.pick([P.burgs[v.from], ...ports].filter(Boolean));
    const paxCul = paxPort.culture, paxRel = w.C.religion[paxPort.cell];
    const pax = this.know.person(`pax:${day}:${v.ship}`, paxCul);
    const stance = flag ? this.know.rel(this.tv.homeState, flag.i) : "Unknown";
    const home = P.burgs[v.from], galley = U.rn(AZ.Prices.ration(w, home) * 1.6, 2);
    const kinds = [
      { wt: 2, run: () => this.events.scene(`<b>The cook</b> of ${U.esc(v.ship)}`, `He has hard tack and salt fish to spare, at sea prices: 🟡 ${galley} a ration, half again what ${U.esc(home?.name || "port")} charged ${T("mixed")}.`,
        [{ label: `Buy 5 rations (🟡 ${U.rn(galley * 5, 1)})`, disabled: s.purse < galley * 5, fx: { coin: -U.rn(galley * 5, 2) }, text: "Dry, salty, and enough." }, { label: "No, thank you", fx: null, text: "" }], `cook${day}`).then(k => { if (k === 0) s.sup.food += 5; }) },
      { wt: 2, run: async () => { const rm = this.know.rumour(s.c, s.r, rnd, this); await this.ui.say(`<b class="side">${U.esc(pax)}</b>, a passenger from ${U.esc(paxPort.name)} (${U.esc(P.cultures[paxCul].name)}, of the ${U.esc(P.religions[paxRel]?.name || "old ways")}) ${T("data")}, talks the evening away.${rm ? ` “${rm}` : ""}`); } },
      { wt: paxRel === this.tv.faith ? 2 : 0.5, run: () => this.events.scene(`<b class="side">${U.esc(pax)}</b> keeps the ${U.esc(P.religions[paxRel]?.name || "old ways")}`, paxRel === this.tv.faith ? "You find you share a faith, and the evening prayers." : "They pray at dawn on the open deck and ask if you will join.",
        [{ label: "Pray with them", fx: { stand: [["f", paxRel, 1]] }, text: "It costs nothing, and someone remembers it." }, { label: "Keep to yourself", fx: null, text: "" }], `pray${day}`) },
      { wt: 1.5, run: () => this.events.scene("<b>Dice on the main deck</b>", `${U.esc(capCul.name)} sailors' rules ${T("data")}; nobody explains them twice.`,
        [{ label: "Stake 🟡 1", disabled: s.purse < 1, roll: { p: 0.45, ok: "You win, to some grumbling.", okFx: { coin: 1 }, bad: "You lose, to some laughter.", badFx: { coin: -1 } } },
         { label: "Stake 🟡 5", disabled: s.purse < 5, roll: { p: 0.45, ok: "You win, and the deck goes quiet.", okFx: { coin: 5 }, bad: "You lose. They are kinder about it than you expect.", badFx: { coin: -5 } } }, { label: "Watch", fx: null, text: "" }], `dice${day}`) },
      { wt: 1, run: () => this.events.scene("<b>Fever in the forecastle</b>", "Two of the crew are down with it, and the passengers sleep close.",
        [{ label: `Pay the surgeon for a draught (🟡 ${AZ.Prices.heal(w, home)})`, disabled: s.purse < AZ.Prices.heal(w, home), fx: { coin: -AZ.Prices.heal(w, home) }, text: "It tastes of iron and you stay well." },
         { label: "Take your chances", roll: { p: 0.65, ok: "You stay well.", okFx: null, bad: "By the next port you are fevered.", badFx: { cond: "fever" } } }], `fever${day}`) },
      { wt: flag ? 1.5 : 0, run: async () => {
        const friendly = /Ally|Friendly/.test(stance), hostile = /Enemy|Rival|Suspicion/.test(stance);
        const text = friendly ? `${U.esc(v.captain)} learns where you are from and asks you to his table: your people and ${U.esc(flag.name)} stand as “${stance}” ${T("data")}. Three days of his stores.` :
          hostile ? `${U.esc(v.captain)} learns where you are from and does not like it: your people and ${U.esc(flag.name)} stand as “${stance}” ${T("data")}. You are watched, and the cook forgets you.` :
          `${U.esc(v.captain)} drinks to ${U.esc(flag.fullName)} ${T("data")} and does not ask where you are from.`;
        if (friendly) s.sup.food += 3; else if (hostile) s.sup.food = Math.max(0, s.sup.food - 1);
        await this.ui.say(text);
      } },
      { wt: 1, run: async () => { const h = 3 + Math.round(rnd() * 5); s.clock += h; await this.ui.say(`A squall comes over the sea and the ship lies to for ${h} hours ${T("mixed")}.`); } },
      { wt: this.canCrew() && v.role === "passenger" ? 1.5 : 0, run: () => this.events.scene("<b>The mate is short-handed</b>", "He has seen you handle a line. Stand a watch for the rest of the voyage, and draw a hand's pay?",
        [{ label: "Stand a watch", fx: null, text: "You sleep less and are paid for it." }, { label: "You paid for your passage", fx: null, text: "" }], `mate${day}`).then(k => { if (k === 0) v.role = "crew"; }) },
    ];
    let roll = rnd() * kinds.reduce((a, k) => a + k.wt, 0);
    for (const k of kinds) if ((roll -= k.wt) <= 0) { await k.run(); break; }
    this.dirty = true;
  },
});

// R: rest, wait, fish or forage
AZ.Game.prototype.rest = async function () {
  const s = this.s, U = AZ.U, w = this.w;
  if (this.riding()) return this.shipTalk();
  const sick = s.cond.fever || s.cond.gravely || s.cond.hurt;
  const atSea = s.aboard && !w.isLand(s.c, s.r);
  const fy = this.fishYield(s.c, s.r), fo = !s.aboard ? this.forageYield(s.c, s.r) : { why: "aboard" };
  const opts = [
    { id: "dawn", label: atSea ? "Anchor until dawn" : "Camp until dawn" },
    { id: "fish", label: fy.why ? `Fish (${fy.why})` : `Fish for six hours (${fy.fishers > 1 ? `${fy.fishers} of you, ` : ""}${fy.where})`, disabled: !!fy.why },
    { id: "forage", label: fo.why ? "Forage (only on land)" : `Forage and hunt for six hours (${fo.where})`, disabled: !!fo.why },
    { id: 1, label: "Wait 1 hour" }, { id: 3, label: "Wait 3 hours" }, { id: 6, label: "Wait 6 hours" },
    { id: "two", label: "Two days, to recover", disabled: !sick }, { id: "no", label: "Never mind" }];
  const k = await this.ui.choose(atSea ? "Heave to, anchor, or put lines over?" : "Make camp, wait, or look for food?", opts, { cancel: opts.length - 1 });
  const o = opts[k];
  if (o.id === "no") return;
  if (o.id === "fish" || o.id === "forage") return this.provide(o.id);
  const t0 = s.clock;
  if (o.id === "two") { this.events.fx({ time: 48, cure: ["fever", "gravely", "hurt"] }, "Rested two days."); this.slept(); this.ui.toast("Two days' rest. You feel yourself again."); return; }
  if (o.id === "dawn" && !s.aboard) return this.campNight();
  if (o.id === "dawn") {
    s.clock = AZ.Clock.nextDawn(s.clock, this.lat());
    this.slept();
    if (s.vessel) { s.vessel.anchored = true; s.vessel.morale = Math.min(100, (s.vessel.morale || 70) + 4); s.vessel.nightKey = Math.floor((s.clock + 12) / 24); }
    const act = this.doAct("anchor");
    if (act) this.ui.toast(`<span class="hook">★ ${U.esc(act.label)}</span>`, "gold");
  } else { s.clock += o.id; if (o.id >= 6) this.slept(); }
  this.ui.toast(`${AZ.Clock.span(s.clock - t0)} pass. ${AZ.Clock.fmt(s.clock)}.`);
  this.dirty = true;
};

// ---------------------------------------------------------------------------------------------
// The moving world (alpha 2). One seeded simulation, advanced day by day with the game clock.
// The map is the starting point and the momentum: production and trade flows (deals) drive the
// markets; the flows and the sea lanes become shipping lines; roads between friendly towns become
// coach lines; disease zones spread along the lines and burn out; famine follows empty granaries;
// the wars already under way in the map move their regiments, fight and occupy. Everything that
// happens is news, and news travels: the player learns of it in towns, when it has had time to
// arrive (60 miles a day). Fully seeded from the world seed: the same choices give the same world.
// ---------------------------------------------------------------------------------------------
AZ.SIM = { newsMilesPerDay: 60, armyTilesPerDay: 2, lineHorizonDays: 12 };

AZ.Sim = class {
  constructor(w, jr) {
    this.w = w; this.jr = jr;
    this.seed = AZ.U.strSeed(String(w.P.world.seed));
    this.day = 0;
    const P = w.P, U = AZ.U;
    this.food = new Set(P.goods.filter(g => (g.tags || []).includes("food")).map(g => g.i));
    // ---- markets: supply from production (burgs) and rural output (cells), per day
    this.mk = new Map();
    for (const m of P.markets) this.mk.set(m.i, { i: m.i, centre: m.centerBurgId, supply: {}, demand: {}, stock: {}, base: {}, target: {}, members: [] });
    for (const b of P.burgs) if (b && this.mk.has(b.market)) { const M = this.mk.get(b.market); M.members.push(b.i); for (const [g, u] of Object.entries(b.production || {})) M.supply[g] = (M.supply[g] || 0) + u / 30; }
    for (const [c, prod] of Object.entries(w.C.prod)) { const M = this.mk.get(w.C.market[+c]); if (!M) continue; for (const [g, u] of Object.entries(prod)) M.supply[g] = (M.supply[g] || 0) + u / 30; }
    for (const [key, goods] of Object.entries(P.trade.flows)) {
      const [a, b] = key.split(">").map(Number), A = this.mk.get(a), B = this.mk.get(b);
      if (!A || !B) continue;
      for (const [g, [u]] of Object.entries(goods)) { A.demand[g] = (A.demand[g] || 0) + u / 30; B.supply[g] = (B.supply[g] || 0) + u / 30; }
    }
    for (const M of this.mk.values()) {
      const m = P.markets.find(x => x.i === M.i);
      for (const g of new Set([...Object.keys(M.supply), ...Object.keys(m.goods)])) {
        // local equilibrium: over a year the market neither fills nor empties; the seasons swing it
        const s0 = M.supply[g] || 0, d0 = Math.max(0.01, s0 * (this.food.has(+g) ? 0.99 : 1));
        M.demand[g] = d0;
        M.target[g] = d0 * 20;
        M.stock[g] = d0 * 20;
        M.base[g] = m.goods[g] ? m.goods[g][1] : P.goods.find(x => x.i === +g)?.value || 1;
      }
    }
    this.flows = Object.entries(P.trade.flows).map(([k, goods]) => { const [a, b] = k.split(">").map(Number); return { a, b, goods: Object.entries(goods).map(([g, [u, v]]) => ({ g: +g, u: u / 30, v })) }; });
    // ---- wars already under way in the map
    this.wars = [];
    for (const s of P.states) if (s && s.campaigns) for (const c of s.campaigns) if (c.end == null && c.attacker === s.i && !this.wars.some(x => x.name === c.name)) this.wars.push({ name: c.name, a: c.attacker, d: c.defender, start: c.start, over: false });
    const atWar = new Set(this.wars.flatMap(x => [x.a, x.d]));
    this.regs = P.military.filter(u => !u.naval && atWar.has(u.state)).map(u => ({ id: `${u.state}:${u.i}`, state: u.state, name: u.name, t: u.t.slice(), base: u.t.slice(), a: u.a, a0: u.a, u: { ...u.u }, status: "hold", target: null, path: null, pos: 0, wait: 0 }));
    this.occupied = {};   // burg id -> occupying state
    // ---- zones (copies, so they can change)
    this.zones = new Map(P.zones.map(z => [z.i, { i: z.i, name: z.name, type: z.type, color: z.color, cells: new Set(z.cells), orig: new Set(z.cells), dyn: false, over: false }]));
    this.rebuildCellZones();
    this.news = [];
    this.lines = this.buildLines();
  }
  // ---------------------------------------------------------------- helpers
  rnd(...k) { return AZ.U.rnd2(AZ.U.strSeed(k.join(":")) & 0xffffff, this.day, this.seed); }
  rebuildCellZones() { this.cellZones = new Map(); for (const z of this.zones.values()) if (!z.over) for (const c of z.cells) { const a = this.cellZones.get(c); if (a) a.push(z.i); else this.cellZones.set(c, [z.i]); } }
  zonesOfCell(cell) { return (this.cellZones.get(cell) || []).map(i => this.zones.get(i)).filter(z => z && !z.over); }
  cellsAround(t, rad) { const w = this.w, out = new Set(); for (let dr = -rad; dr <= rad; dr += 2) for (let dc = -rad; dc <= rad; dc += 2) { if (dc * dc + dr * dr > rad * rad) continue; const c = t[0] + dc, r = t[1] + dr; if (w.inb(c, r) && w.isLand(c, r)) out.add(w.cell(c, r)); } return out; }
  burgZones(b) { return this.zonesOfCell(b.cell); }
  stateOf(b) { return this.occupied[b.i] ?? b.state; }
  atWar(a, b) { return this.wars.some(x => !x.over && ((x.a === a && x.d === b) || (x.a === b && x.d === a))); }
  rel(a, b) { if (a === b) return "Self"; if (this.atWar(a, b)) return "Enemy"; return this.w.P.states[a]?.diplomacy?.[b] || "Unknown"; }
  report(t, tile, text, kind) { this.news.push({ id: this.news.length, t, tile, text, kind }); }
  season(b) { return AZ.Clock.season(this.w.latlon(...b.t)[0], this.day * 24); }
  // ---------------------------------------------------------------- lines (the passenger network)
  buildLines() {
    const w = this.w, P = w.P, U = AZ.U, out = [], have = new Set();
    const port = b => b && b.port && w.harbour(b, "ship");
    const add = (L) => { const k = `${L.mode}:${L.from}>${L.to}`; if (have.has(k)) return; have.add(k); L.id = out.length; L.key = k; out.push(L); };
    const mkName = (k, cul) => `the ${U.cap(w.names.get(P.cultures[cul]?.base ?? 0, U.rng(`line:${k}`), 4, 9))}`;
    const shipLine = (A, B, period, why, cargo, fixed) => {
      if (!port(A) || !port(B) || !w.sameWater(w.harbour(A, "ship").t, w.harbour(B, "ship").t, "ship")) return;
      const k = `${A.i}>${B.i}`, rnd = U.rng(`${this.seed}:line:${k}`);
      add({ mode: "sea", from: A.i, to: B.i, period, phase: fixed ?? Math.floor(rnd() * period * 24) + 6, hour: 0, why, cargo,
        ship: mkName(k, A.culture), captain: null, flag: A.state, transport: "Sailing Ship", speed: 10, hpd: 24, cul: A.culture });
    };
    // trade runs between market centres, from the deals
    for (const f of this.flows) {
      const A = P.burgs[this.mk.get(f.a)?.centre], B = P.burgs[this.mk.get(f.b)?.centre];
      const v = f.goods.reduce((s, g) => s + g.v, 0), top = f.goods.sort((x, y) => y.v - x.v)[0];
      const per = U.clamp(Math.round(30 / Math.sqrt(1 + v / 5)), 5, 21);
      shipLine(A, B, per, `the ${P.goods.find(g => g.i === top?.g)?.name.toLowerCase() || "goods"} trade between the ${A?.name} and ${B?.name} markets`, top?.g, null);
      shipLine(B, A, per, `the return run of the same trade`, null, null);
    }
    // the plan's own ships: a packet whose timetable has a sailing at the plan's time
    if (this.jr) for (const cp of this.jr.cps) {
      const seg = cp.legOut; if (!seg || AZ.vesselClass(seg.transport) !== "ship" || !seg.place.burg) continue;
      shipLine(cp.place.burg, seg.place.burg, 7, `the packet between ${cp.place.burg.name} and ${seg.place.burg.name}, which pilgrims use`, null, Math.round(cp.parLeave));
    }
    // coastal packets: every port to its two nearest ports on the same water
    const ports = P.burgs.filter(port);
    for (const A of ports) {
      const near = ports.filter(B => B !== A && w.sameWater(w.harbour(A, "ship").t, w.harbour(B, "ship").t, "ship")).map(B => ({ B, d: Math.hypot(B.t[0] - A.t[0], B.t[1] - A.t[1]) })).filter(o => o.d < 140).sort((x, y) => x.d - y.d).slice(0, 2);
      for (const { B } of near) shipLine(A, B, 6 + Math.floor(U.rnd2(A.i, B.i, 5) * 6), `the coastal packet`, null, null);
    }
    // long-haul lines along each named sea lane, calling at the ports that lie on it
    const lanePorts = new Map();
    for (const A of ports) {
      const h = w.harbour(A, "ship").t;
      for (let dr = -3; dr <= 3; dr++) for (let dc = -3; dc <= 3; dc++) {
        if (!w.inb(h[0] + dc, h[1] + dr)) continue;
        const id = w.R.route[w.idx(h[0] + dc, h[1] + dr)];
        const rt = id && P.routes[id - 1];
        if (!rt || rt.group !== "searoutes") continue;
        const set = lanePorts.get(id) || new Set(); set.add(A); lanePorts.set(id, set);
      }
    }
    for (const [id, set] of lanePorts) {
      const list = [...set].filter(A => w.sameWater(w.harbour(A, "ship").t, w.harbour([...set][0], "ship").t, "ship"));
      if (list.length < 3) continue;
      const cx = list.reduce((a, A) => a + A.t[0], 0) / list.length, cy = list.reduce((a, A) => a + A.t[1], 0) / list.length;
      let cur = list.sort((x, y) => Math.hypot(y.t[0] - cx, y.t[1] - cy) - Math.hypot(x.t[0] - cx, x.t[1] - cy))[0];
      const order = [cur], left = new Set(list.filter(x => x !== cur));

// Alpha 2.1
//   Journeys by archetype (the map's journey type: Quest, Caravan, Pilgrimage ...): the framing,
//   the travellers and the companions met at a Gathering follow it; new stop types (Gathering,
//   Rumours, Waiting for a ship, Resupply, Camp) are things to do, with people to do them with.

AZ.archOf = jr => {
  if (!jr) return "Wandering";

// "Culzan and the road through the forest": a name that is no place, state or culture is the leader
AZ.journeyLeader = (w, jr) => {
