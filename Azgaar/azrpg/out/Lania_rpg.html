<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The revenant of Kaharlale · azrpg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c18; --win-a: rgba(34, 50, 116, 0.94); --win-b: rgba(14, 20, 60, 0.95); --edge: #e8ecff; --ink: #f4f6ff;
  --dim: #a9b2d8; --gold: #f5c542; --teal: #4fd1c5; --late: #ff8a7a; --early: #9be59b;
  --font: "DotGothic16", "MS Gothic", "Courier New", monospace;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0a0c18; } }
:root[data-theme="dark"] { --bg: #0a0c18; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); }
*, *::before, *::after { box-sizing: border-box; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.win { background: linear-gradient(180deg, var(--win-a), var(--win-b)); border: 2px solid var(--edge); border-radius: 6px;
  box-shadow: 0 0 0 2px #121633, 0 6px 18px rgba(0,0,0,.55); color: var(--ink); }
#hud-loc { position: fixed; left: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); padding: 6px 10px; font-size: 14px; max-width: 46vw; }
#hud-trip { position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); padding: 6px 10px; font-size: 14px; max-width: 40vw; text-align: right; }
#hud-loc .big { font-size: 18px; }
.hook { color: var(--gold); } .side { color: var(--teal); } .dim { color: var(--dim); } .late { color: var(--late); } .early { color: var(--early); }
.arrow { color: var(--gold); font-size: 18px; }
#legend { position: fixed; left: 10px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); padding: 6px 10px; font-size: 13px; display: none; max-width: 40vw; }
#miniwrap { position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 3px; line-height: 0; }
#mini { width: 220px; height: 110px; image-rendering: pixelated; }
#banner { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .6s; pointer-events: none;
  text-shadow: 0 2px 0 #000, 0 0 8px #000; }
#banner.on { opacity: 1; }
#banner .t { font-size: 26px; } #banner .s { font-size: 14px; color: var(--dim); }
#toasts { position: fixed; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column-reverse; gap: 6px; max-width: min(460px, 60vw); pointer-events: none; }
.toast { padding: 5px 9px; font-size: 13px; transition: opacity 1s; }
.toast.fade { opacity: 0; } .toast.gold { border-color: var(--gold); } .toast.teal { border-color: var(--teal); }
#msg { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(820px, calc(100vw - 20px));
  max-height: 46vh; overflow-y: auto; padding: 12px 16px 18px; font-size: 16px; line-height: 1.5; display: none; z-index: 20; }
#msg.on { display: block; }
#msg .who { color: var(--gold); margin-bottom: 4px; }
#msg .more { position: absolute; right: 12px; bottom: 4px; color: var(--edge); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.choices { list-style: none; margin: 8px 0 0; padding: 0; }
.choices li { padding: 3px 4px; cursor: pointer; border-radius: 3px; }
.choices li.sel { background: rgba(255,255,255,.12); }
.choices li.dis { color: #6b7399; }
.choices li.hook { color: var(--gold); }
#panel { position: fixed; right: 10px; top: 120px; bottom: 140px; width: min(380px, 44vw); overflow-y: auto; padding: 8px 10px; font-size: 12.5px; display: none; z-index: 10; }
#panel.on { display: block; }
#panel h4 { margin: 8px 0 2px; color: var(--gold); font-weight: normal; border-bottom: 1px solid rgba(255,255,255,.2); }
#panel table { width: 100%; border-collapse: collapse; }
#panel th { text-align: left; vertical-align: top; color: var(--dim); font-weight: normal; width: 34%; padding: 1px 6px 1px 0; }
#panel td { padding: 1px 0; }
.insp-head { font-size: 17px; }
.tag { font-size: 9.5px; padding: 0 3px; border-radius: 3px; vertical-align: 1px; opacity: .85; white-space: nowrap; }
.t-data { background: #2d5b8a; } .t-mixed { background: #8a6a1f; } .t-new { background: #8a2d6a; }
#modal { position: fixed; inset: 0; background: rgba(4,6,16,.82); display: none; z-index: 30; overflow: auto; }
#modal.on { display: flex; align-items: flex-start; justify-content: center; }
.sheet { margin: 30px auto; width: min(980px, calc(100vw - 24px)); padding: 16px 20px; background: linear-gradient(180deg, var(--win-a), var(--win-b)); border: 2px solid var(--edge); border-radius: 6px; }
.sheet h2 { margin: 0 0 6px; color: var(--gold); font-weight: normal; } .sheet h3 { margin: 14px 0 4px; font-weight: normal; color: var(--teal); }
.sheet table { border-collapse: collapse; width: 100%; font-size: 13px; }
.plan th, .plan td { border-bottom: 1px solid rgba(255,255,255,.12); padding: 3px 6px; text-align: left; }
.plan tr.cur td { color: var(--gold); }
.keys th { text-align: left; width: 28%; color: var(--gold); font-weight: normal; padding: 3px 8px 3px 0; vertical-align: top; }
.log { max-height: 40vh; overflow-y: auto; font-size: 13px; }
.mapwrap { margin: 16px auto; text-align: center; }
.maphead { margin-bottom: 6px; } #wmap { image-rendering: pixelated; border: 2px solid var(--edge); cursor: crosshair; max-width: calc(100vw - 30px); }
.title { margin: 8vh auto; width: min(640px, calc(100vw - 24px)); text-align: center; }
.title .logo { font-size: 34px; color: var(--gold); text-shadow: 0 3px 0 #000; }
.title .sub { color: var(--dim); margin: 6px 0 18px; }
.title .card { text-align: left; padding: 10px 14px; margin-bottom: 12px; line-height: 1.5; }
.title .card .who { color: var(--gold); }
.choices.big li { font-size: 18px; text-align: left; padding: 6px 10px; }
#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--dim); }
#touch { display: none; }
@media (pointer: coarse) {
  #touch { display: block; }
  #pad { position: fixed; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 132px; height: 132px; z-index: 15; }
  #pad button, #btns button { position: absolute; width: 44px; height: 44px; border-radius: 8px; border: 2px solid var(--edge); background: rgba(20,28,80,.7); color: #fff; font-family: var(--font); font-size: 15px; touch-action: none; }
  #pad [data-pad=up] { left: 44px; top: 0; } #pad [data-pad=down] { left: 44px; top: 88px; } #pad [data-pad=left] { left: 0; top: 44px; } #pad [data-pad=right] { left: 88px; top: 44px; }
  #btns { position: fixed; right: 14px; bottom: calc(130px + env(safe-area-inset-bottom, 0px)); width: 150px; height: 100px; z-index: 15; }
  #btns [data-key=" "] { right: 0; top: 0; width: 56px; height: 56px; } #btns [data-key=Escape] { right: 64px; top: 12px; }
  #btns [data-key=f] { right: 0; top: 62px; } #btns [data-key=i] { right: 50px; top: 62px; } #btns [data-key=m] { right: 100px; top: 62px; }
  #toasts { bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
  #hud-loc, #hud-trip { font-size: 12px; } #hud-loc .big { font-size: 15px; }
  #miniwrap { display: none; }
}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="status">Unfolding the map…</div>
<div id="hud-loc" class="win"></div>
<div id="hud-trip" class="win"></div>
<div id="legend" class="win"></div>
<div id="miniwrap" class="win"><canvas id="mini" width="220" height="110"></canvas></div>
<div id="banner"></div>
<div id="toasts"></div>
<div id="panel" class="win"></div>
<div id="msg" class="win"></div>
<div id="modal"></div>
<div id="touch">
  <div id="pad"><button data-pad="up">▲</button><button data-pad="left">◀</button><button data-pad="right">▶</button><button data-pad="down">▼</button></div>
  <div id="btns"><button data-key=" ">A</button><button data-key="Escape">☰</button><button data-key="f">F</button><button data-key="i">I</button><button data-key="m">M</button></div>
</div>

<script>
"use strict";
// ---------------------------------------------------------------------------------------------
// azrpg engine — utilities. Everything random in the world is seeded (by tile, cell, burg or
// stage), so the same place always looks and speaks the same way.
// ---------------------------------------------------------------------------------------------
const AZ = (typeof globalThis !== "undefined" ? globalThis : window).AZ = {};

AZ.U = (() => {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;

  function hash32(a, b = 0, c = 0) {
    let h = (Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x9e3779b1)) >>> 0;
    h = Math.imul(h ^ (h >>> 15), 0x85ebca6b) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35) >>> 0;
    return (h ^ (h >>> 16)) >>> 0;
  }
  const rnd2 = (x, y, s = 0) => hash32(x, y, s) / 4294967296;

  function strSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619) >>> 0;
    return h;
  }
  function rng(seed) {
    let a = (typeof seed === "string" ? strSeed(seed) : seed) >>> 0;
    const f = () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.pick = arr => arr[Math.floor(f() * arr.length)];
    f.int = (a, b) => a + Math.floor(f() * (b - a + 1));
    f.chance = p => f() < p;
    return f;
  }

  // smooth value noise on the tile lattice, used for decoration and ground variety
  function vnoise(x, y, scale, s) {
    const fx = x / scale, fy = y / scale;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = fx - x0, ty = fy - y0;
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const a = rnd2(x0, y0, s), b = rnd2(x0 + 1, y0, s), c = rnd2(x0, y0 + 1, s), d = rnd2(x0 + 1, y0 + 1, s);
    return lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
  }

  const rn = (v, d = 0) => { const p = 10 ** d; return Math.round(v * p) / p; };
  function si(n) {
    if (n >= 1e9) return rn(n / 1e9, 1) + "B";
    if (n >= 1e8) return rn(n / 1e6) + "M";
    if (n >= 1e6) return rn(n / 1e6, 1) + "M";
    if (n >= 1e4) return rn(n / 1e3) + "K";
    if (n >= 1e3) return rn(n / 1e3, 1) + "K";
    return String(rn(n));
  }
  const num = (n, d = 0) => Number(rn(n, d)).toLocaleString("en-US");

  function dms(coord, type) {
    const deg = Math.floor(Math.abs(coord));
    const mf = (Math.abs(coord) - deg) * 60;
    const min = Math.floor(mf);
    const card = type === "lat" ? (coord >= 0 ? "N" : "S") : coord >= 0 ? "E" : "W";
    return `${deg}°${String(min).padStart(2, "0")}′${card}`;
  }

  const COMPASS = ["east", "north-east", "north", "north-west", "west", "south-west", "south", "south-east"];
  function compass(dx, dy) {
    if (!dx && !dy) return "here";
    const a = Math.atan2(-dy, dx);
    return COMPASS[(Math.round(a / (Math.PI / 4)) + 8) % 8];
  }
  const ARROWS = ["→", "↗", "↑", "↖", "←", "↙", "↓", "↘"];
  function arrow(dx, dy) {
    if (!dx && !dy) return "•";
    return ARROWS[(Math.round(Math.atan2(-dy, dx) / (Math.PI / 4)) + 8) % 8];
  }

  function hex2rgb(h) {
    if (!h || h[0] !== "#") return [128, 128, 128];
    if (h.length === 4) h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  const rgb2hex = c => "#" + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, "0")).join("");
  const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const shade = (c, f) => (f >= 0 ? mix(c, [255, 255, 255], f) : mix(c, [0, 0, 0], -f));
  const css = c => `rgb(${c.map(v => clamp(Math.round(v), 0, 255)).join(",")})`;

  const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const cap = s => (s ? s[0].toUpperCase() + s.slice(1) : s);
  const plural = (n, w, p) => `${n} ${n === 1 ? w : p || w + "s"}`;
  const article = w => (/^[aeiou]/i.test(w) ? "an " : "a ") + w;

  function ramp(stops, t) {
    // stops: [[t, [r,g,b]], ...] ascending
    if (t <= stops[0][0]) return stops[0][1];
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
        return mix(c0, c1, (t - t0) / (t1 - t0));
      }
    }
    return stops[stops.length - 1][1];
  }

  return { clamp, lerp, hash32, rnd2, strSeed, rng, vnoise, rn, si, num, dms, compass, arrow, hex2rgb, rgb2hex,
           mix, shade, css, esc, cap, plural, article, ramp };
})();

// ---------------------------------------------------------------------------------------------
// Pack decoding, names and the World: every question about a tile goes through here.
// ---------------------------------------------------------------------------------------------
AZ.loadPack = async function (src) {
  let bin = src;
  if (typeof src === "string") {
    const s = atob(src.replace(/\s+/g, ""));
    bin = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) bin[i] = s.charCodeAt(i);
  }
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  if (String.fromCharCode(buf[0], buf[1], buf[2], buf[3]) !== "AZRP") throw new Error("Not an azrpg world pack");
  const n = (buf[4] | (buf[5] << 8) | (buf[6] << 16) | (buf[7] << 24)) >>> 0;
  const P = JSON.parse(new TextDecoder().decode(buf.subarray(8, 8 + n)));
  const base = 8 + n;
  P.R = {};
  for (const [name, r] of Object.entries(P.rasters)) {
    const bytes = buf.slice(base + r.offset, base + r.offset + r.length);
    let arr = r.type === "u16" ? new Uint16Array(bytes.buffer, 0, r.length / 2) : bytes;
    if (r.encoding === "rowdelta") {
      const { cols, rows } = P.grid;
      for (let y = 0; y < rows; y++) {
        const o = y * cols;
        for (let x = 1; x < cols; x++) arr[o + x] = (arr[o + x - 1] + arr[o + x]) & 255;
      }
    }
    P.R[name] = arr;
  }
  return P;
};

    const data = this.chain(this.bases[base] ? base : Object.keys(this.bases)[0]);

      if (r.slice(-1) === " " || r.slice(-1) === "-") return r + c.toUpperCase();

};

AZ.GROUNDS = {
  sand: [228, 206, 146], gravel: [180, 174, 140], dry: [198, 190, 116], meadow: [140, 186, 88],
  grass: [106, 164, 78], lush: [74, 146, 60], needle: [86, 120, 70], tundra: [154, 140, 100],

AZ.World = class {
  constructor(P) {

    // biome look: ground class from the name, colour pulled towards the biome's own colour (data)

      const n = (b.name || "").toLowerCase();

      if (/marine/.test(n)) k = "water";

      else if (/hot desert/.test(n)) k = "sand";
      else if (/cold desert/.test(n)) k = "gravel";
      else if (/desert/.test(n)) k = "sand";
      else if (/savann/.test(n)) k = "dry";
      else if (/tundra/.test(n)) k = "tundra";
      else if (/taiga|boreal/.test(n)) k = "needle";
      else if (/wetland|swamp|marsh|bog/.test(n)) k = "marsh";
      else if (/rainforest|jungle/.test(n)) k = "lush";
      else if (/forest|wood/.test(n)) k = "grass";
      else if (/grass|steppe|prairie|meadow/.test(n)) k = "meadow";
      const base = AZ.GROUNDS[k] || AZ.GROUNDS.grass;
      const col = k === "water" ? U.hex2rgb(b.color) : U.mix(base, U.hex2rgb(b.color), k === "snow" ? 0.15 : 0.28);

      return { kind: k, col, icons, density: b.iconsDensity || 0 };
    });
    this.relief = P.world.relief || [
      { name: "Snowy mountains", height: { min: 71, max: 100 }, temperature: { min: null, max: -1 }, icons: { mountSnow: { weight: 1 } } },
      { name: "Mountains", height: { min: 71, max: 100 }, temperature: { min: null, max: null }, icons: { mount: { weight: 1 } } },
      { name: "Hills", height: { min: 50, max: 70 }, temperature: { min: null, max: null }, icons: { hill: { weight: 1 } } },
    ];
    // lookups by tile
    this.burgAt = new Map();
    for (const b of P.burgs) if (b) this.burgAt.set(this.idx(b.t[0], b.t[1]), b);
    this.markersAt = new Map();
    for (const m of P.markers) this.push(this.markersAt, this.idx(m.t[0], m.t[1]), m);
    this.unitsAt = new Map();
    for (const u of P.military) this.push(this.unitsAt, this.idx(u.t[0], u.t[1]), u);
    this.bucket = new Map();
    const put = (kind, o) => this.push(this.bucket, ((o.t[1] >> 4) << 16) | (o.t[0] >> 4), [kind, o]);

  tileAt(x, y) {

  gridCell(x, y) { // Azgaar's findGridCell

  }

// ---------------------------------------------------------------------------------------------
// Art. Everything is drawn in code on a 16-pixel tile, RPG Maker 2000 style. Colours come from
// the data where the data has them: ground from biome colours, roofs from culture colours,
// flags and sails from state colours.
// ---------------------------------------------------------------------------------------------
AZ.Art = class {
  constructor(world, mk) {
    this.w = world;

  get(key, w, h, draw) {

      rows.forEach((row, y) => [...row].forEach((ch, X) => { if (pal[ch]) AZ.Art.px(x, X, y, 1, 1, pal[ch]); }));
    });
  }

  // ------------------------------------------------------------------ vegetation (biome icons)
  plant(type, v = 0) {
    const dark = v ? 0.85 : 1;
    const g = (r, gg, b) => `rgb(${Math.round(r * dark)},${Math.round(gg * dark)},${Math.round(b * dark)})`;
    const P = {
      conifer: [["...k...", "..kgk..", "..kGk..", ".kgggk.", ".kgGgk.", "kgggggk", ".kgGgk.", "kgggggk", "kkgggkk", "...t...", "...t..."],
        { k: g(24, 54, 34), g: g(44, 100, 56), G: g(74, 136, 70), t: "#5a3a24" }],
      coniferSnow: [["...w...", "..wgw..", "..kGk..", ".wwgww.", ".kgGgk.", "wwgggww", ".kgGgk.", "kgwggwk", "kkgggkk", "...t...", "...t..."],
        { k: g(24, 54, 40), g: g(44, 96, 62), G: g(70, 126, 80), t: "#5a3a24", w: "#f1f5f8" }],
      deciduous: [["..kkkk..", ".kgggGk.", "kggGGggk", "kgGgggGk", "kggggggk", ".kgggkk.", "..kkkk..", "...tt...", "...tt..."],
        { k: g(30, 70, 30), g: g(60, 125, 50), G: g(104, 168, 78), t: "#6a4428" }],
      palm: [["kk...kk", "kggkggk", "..kgk..", ".kgGgk.", "kg.t.gk", "...t...", "...t...", "..t....", "..t....", ".tt...."],
        { k: g(30, 80, 30), g: g(64, 140, 56), G: g(110, 180, 80), t: "#8a6238" }],
      acacia: [[".kkkkkkk.", "kgGGgggGk", ".kkggggk.", "...tt....", "....t....", "....t....", "...t....."],
        { k: g(60, 80, 30), g: g(104, 128, 52), G: g(140, 160, 72), t: "#6e4e30" }],
      deadTree: [["t.....t", ".t.t.t.", "..ttt..", "...t.t.", "...t...", "...t...", "..tt..."], { t: "#6b5137" }],
      cactus: [["..c..", "..c.c", "c.c.c", "c.ccc", "ccc..", "..c..", "..c.."], { c: g(62, 125, 58) }],
      grass: [["G...G", ".gGg.", "ggggg"], { g: g(84, 130, 52), G: g(128, 170, 76) }],
      dune: [["...dddd...", "..dDDDDd..", ".dDDDDDDd.", "dddddddddd"], { d: "#c7a86a", D: "#ecd59a" }],
      swamp: [[".r..r.r.", ".r.rr.r.", "rr.r..rr", ".bbbbbb.", "bBBBBBBb"], { r: g(70, 110, 50), b: "#3b6b7a", B: "#5a91a3" }],

AZ.LENSES = (() => {

    { id: "none", name: "No lens" },
    { id: "biome", name: "Biome", tile: false, color: (w, cell) => U.hex2rgb(w.P.biomes[w.C.biome[cell]]?.color), label: (w, cell) => w.P.biomes[w.C.biome[cell]]?.name },
    { id: "height", name: "Height", tile: true, color: (w, cell, c, r) => U.ramp(H, w.h(c, r) / 100), label: (w, cell, c, r) => (w.isLand(c, r) ? w.heightStr(w.h(c, r)) : "depth " + w.heightStr(w.h(c, r), true)) + " (tile, mixed)" },

    { id: "state", name: "State", color: cat("state", "states"), label: (w, cell) => { const s = w.P.states[w.C.state[cell]]; return w.C.state[cell] ? s.fullName || s.name : "neutral lands"; } },
    { id: "province", name: "Province", color: cat("province", "provinces"), label: name("province", "provinces", "fullName") },
    { id: "culture", name: "Culture", color: cat("culture", "cultures"), label: name("culture", "cultures") },
    { id: "religion", name: "Religion", color: cat("religion", "religions"), label: name("religion", "religions") },
    { id: "population", name: "Population", color: (w, cell) => (w.C.type[cell] ? null : U.ramp([[0, [250, 245, 220]], [2, [240, 180, 90]], [8, [200, 60, 40]], [20, [90, 0, 30]]], w.C.pop[cell])), label: (w, cell) => U.si(w.population(cell)[0]) + " rural in this cell" },

    { id: "resource", name: "Resource", color: (w, cell) => { const g = w.P.goods.find(x => x.i === w.C.good[cell]); return g ? U.hex2rgb(g.color) : null; }, label: (w, cell) => w.P.goods.find(x => x.i === w.C.good[cell])?.name || "none" },
    { id: "zones", name: "Zones", color: (w, cell) => { const z = w.zonesOfCell(cell)[0]; return z ? U.hex2rgb(z.color || "#ff0000") : null; }, label: (w, cell) => w.zonesOfCell(cell).map(z => `${z.name} (${z.type})`).join(", ") || "none" },
  ];
})();

AZ.Renderer = class {

    this.w = world; this.art = art; this.cv = canvas; this.mk = mk;

      const dl = [land(c - 1, r - 1), land(c + 1, r - 1), land(c + 1, r + 1), land(c - 1, r + 1)];
      const anyLandNb = nl[0] || nl[1] || nl[2] || nl[3] || dl[0] || dl[1] || dl[2] || dl[3];

// ---------------------------------------------------------------------------------------------
// Story: the plan clock, the journey (plan versus record), the traveller generated for each
// playthrough, and every piece of text the world speaks. Text is assembled from data and tagged:
// (data) read from the files, (mixed) a stated rule applied to data, (new) invented here.
// ---------------------------------------------------------------------------------------------
AZ.T = k => `<span class="tag t-${k}">${k}</span>`;

AZ.Clock = {
  doy0: 80, // spring equinox by default
  dayLength(lat, doy) {
    const decl = (23.44 * Math.sin((2 * Math.PI * (284 + doy)) / 365) * Math.PI) / 180;
    const x = -Math.tan((lat * Math.PI) / 180) * Math.tan(decl);

    if (x <= -1) return 24;

  },
  sun(t, lat) {

    return { day, hour, dl, rise: 12 - dl / 2, set: 12 + dl / 2 };
  },
  light(t, lat) {
    const s = this.sun(t, lat);
    if (s.dl >= 24) return { a: 0, phase: "day" };
    if (s.dl <= 0) return { a: 0.55, rgb: [70, 84, 150], phase: "night" };
    const h = s.hour;
    const dist = h < s.rise ? s.rise - h : h > s.set ? h - s.set : -Math.min(h - s.rise, s.set - h);
    if (dist <= -1) return { a: 0, phase: "day" };
    if (dist <= 0) return { a: 0.25 * (1 + dist), rgb: [255, 190, 140], phase: h < 12 ? "dawn" : "dusk" };
    if (dist <= 1) return { a: 0.25 + 0.3 * dist, rgb: AZ.U.mix([255, 190, 140], [70, 84, 150], dist).map(Math.round), phase: h < 12 ? "dawn" : "dusk" };

  },
  nextDawn(t, lat) {
    const s = this.sun(t, lat);
    let dawn = s.day * 24 + Math.max(0, s.rise);
    if (dawn <= t) dawn = (s.day + 1) * 24 + Math.max(0, this.sun((s.day + 1) * 24, lat).rise);

  },

    const day = Math.floor(t / 24), h = t - day * 24, hh = Math.floor(h), mm = Math.floor((h - hh) * 60);

  },

      }
    }
    const near = w.near(tile[0], tile[1], 30).find(n => n.kind === "burg");
    if (near) return { burg: near.o, name: `near ${near.o.name}`, tile, at: false };
    return { burg: null, name: w.isLand(...tile) ? "the wilds" : w.waterName(...tile), tile, at: false };
  }
  // where is (c, r) along a moving stage? returns {pos, frac, off}
  progress(seg, c, r) {
    if (!seg.moving) return null;
    const k = seg.chainPos.get(this.w.idx(c, r));
    if (k !== undefined) return { pos: k, frac: k / Math.max(1, seg.chain.length - 1), off: 0 };
    let best = 0, bd = 1e9;
    seg.chain.forEach(([a, b], i) => { const d = Math.hypot(a - c, b - r); if (d < bd) { bd = d; best = i; } });
    return { pos: best, frac: best / Math.max(1, seg.chain.length - 1), off: bd };
  }
  planTimeAt(seg, frac) { return seg.planStart + (seg.planEnd - seg.planStart) * (frac ?? 0); }
};

// ---------------------------------------------------------------------------------------------
// The traveller: generated for each playthrough from the journey's own places and faiths.
// ---------------------------------------------------------------------------------------------
AZ.makeTraveller = function (w, jr, seed) {
  const U = AZ.U, rnd = U.rng(seed), P = w.P, C = w.C;
  const first = jr.segs[0], last = jr.segs[jr.segs.length - 1];
  const oCell = first.from, dCell = last.to;
  const oBurg = jr.origin.burg, dBurg = jr.dest.burg;
  const oCul = C.culture[oCell], dCul = C.culture[dCell], oRel = C.religion[oCell], dRel = C.religion[dCell];
  const dState = C.state[dCell];
  const mids = jr.segs.filter(s => s.place.burg && s.place.at && s.place.burg !== oBurg && s.place.burg !== dBurg)
    .map(s => s.place.burg).filter((b, i, a) => a.indexOf(b) === i);
  const kinds = [];
  const homeIn = (state, cul) => P.burgs.filter(b => b && b.state === state && b.culture === cul);
  kinds.push({ id: "returning", wt: 4, culture: dCul, faith: dRel,
    home: rnd.pick(homeIn(dState, dCul).length ? homeIn(dState, dCul) : [dBurg]) });
  if (dRel !== oRel) kinds.push({ id: "convert", wt: 3.5, culture: oCul, faith: dRel, home: oBurg, family: oRel });
  for (const b of mids) {
    const rel = C.religion[b.cell];
    if (rel !== dRel || C.culture[b.cell] !== dCul) kinds.push({ id: "other", wt: 2.5 / mids.length, culture: C.culture[b.cell], faith: rel, home: b });
  }
  let roll = rnd() * kinds.reduce((a, k) => a + k.wt, 0), K = kinds[0];
  for (const k of kinds) if ((roll -= k.wt) <= 0) { K = k; break; }
  const cul = P.cultures[K.culture], rel = P.religions[K.faith], destRel = P.religions[dRel];
  const name = w.names.get(cul.base, rnd);
  const age = 18 + Math.floor(rnd() * 44);
  const deity = ((rel && rel.deity) || destRel?.deity || "").split(",")[0];
  const trades = {
    returning: ["deckhand", "clerk of a trading house", "released hostage of an old treaty", "journeyman scribe", "widowed net-mender"],
    convert: ["chandler", "harbour clerk", "schoolmaster", "cooper", "temple sweeper"],
    other: ["envoy's secretary", "travelling physician", "apprentice cartographer", "former soldier", "copyist"],
  };
  const why = {
    returning: `born to the ${destRel?.name} among the ${cul.name} of ${P.states[K.home.state]?.name || "the south"}, you are going home to make the pilgrimage you were promised as a child`,
    convert: `raised in the ${P.religions[K.family || oRel]?.name} of ${oBurg?.name}, you took the ${destRel?.name} as an adult; your family has not forgiven it`,
    other: `you keep the ${rel?.name || "old ways"} of ${K.home?.name}, and you have been sent to Chelhazpo for reasons of your own`,
  };
  if (K.id === "other") why.other = `you keep the ${rel?.name || "old ways"} of ${K.home?.name}, and you travel to ${jr.dest.name} on an errand you have told no one`;
  const skin = rnd.pick(["rgb(240,204,170)", "rgb(214,170,130)", "rgb(176,124,88)", "rgb(124,84,58)"]);
  const cloak = U.shade(U.hex2rgb(cul.color || "#806040"), -0.35);
  return {
    seed, kind: K.id, name, age, culture: K.culture, faith: K.faith, home: K.home?.i, homeState: K.home?.state ?? C.state[oCell],
    trade: rnd.pick(trades[K.id]), why: why[K.id], token: deity ? `a small icon of ${deity}` : "a pilgrim's token",
    pal: { cloak: U.css(cloak), cloakDark: U.css(U.shade(cloak, -0.35)), skin, belt: "rgb(150,110,60)" },
  };
};

// ---------------------------------------------------------------------------------------------
// Knowledge: the text layer
// ---------------------------------------------------------------------------------------------
AZ.Know = class {
  constructor(w, jr, tv) {
    this.w = w; this.jr = jr; this.tv = tv;
    this.C = AZ.CONTENT || {};
    this.facts = this.buildFacts();
  }
  get P() { return this.w.P; }
  year() { return this.w.W.calendar?.year || 0; }
  era() { return this.w.W.calendar?.eraShort || ""; }
  st(i) { return this.P.states[i]; }
  rel(a, b) { const s = this.st(a); return a === b ? "Self" : s?.diplomacy?.[b] || "Unknown"; }
  sightTiles(c, r, aboard) { if (aboard || !this.w.isLand(c, r)) return 4; return Math.min(10, 4 + Math.floor(Math.max(0, this.w.heightVal(this.w.h(c, r))) / 1500)); }
  dirDist(c, r, t) {
    const U = AZ.U, mi = Math.hypot(t[0] - c, t[1] - r) * this.w.miles;
    return { dir: U.compass(t[0] - c, t[1] - r), mi, txt: `${U.num(Math.round(mi / 5) * 5)} mi ${U.compass(t[0] - c, t[1] - r)}` };
  }
  person(seedKey, cultureId) {
    const rnd = AZ.U.rng(`${this.w.P.world.seed}:${seedKey}`);
    const cul = this.P.cultures[cultureId] || this.P.cultures[1];
    return this.w.names.get(cul.base, rnd);
  }
  heightBand(ft) {
    const bands = this.C.height || [[0, "low ground"], [300, "rolling country"], [1200, "hills"], [3000, "highlands"], [6000, "mountains"]];
    let b = bands[0][1];
    for (const [v, n] of bands) if (ft >= v) b = n;
    return b;
  }
  feel(tc) { return tc < -10 ? "bitter" : tc < 0 ? "freezing" : tc < 8 ? "cold" : tc < 15 ? "cool" : tc < 22 ? "mild" : tc < 28 ? "warm" : "hot"; }
  wet(mm) { return mm < 250 ? "arid" : mm < 600 ? "dry" : mm < 1200 ? "moist" : mm < 2500 ? "wet" : "drenched"; }

  // ------------------------------------------------------------------ look
  describe(c, r, aboard) {
    const w = this.w, U = AZ.U, T = AZ.T, cell = w.cell(c, r), out = [];
    const rnd = U.rng(U.hash32(c, r, 99));
    if (w.isLand(c, r)) {
      const biome = this.P.biomes[w.C.biome[cell]];
      const bank = this.C.biomes?.[biome.name]?.phrases;
      if (bank) out.push(`${rnd.pick(bank)} ${T("new")}`);
      const ft = w.heightVal(w.h(c, r));
      const rel = w.reliefAt(c, r);
      out.push(`${biome.name}, ${this.heightBand(ft)} about ${U.num(ft < 1000 ? Math.round(ft / 10) * 10 : Math.round(ft / 50) * 50)} ${w.hunit} up${rel ? ` (${rel.rule.toLowerCase()})` : ""} ${T("mixed")}.`);
    } else {
      out.push(`${w.waterName(c, r)}, about ${w.heightStr(w.h(c, r), true)} deep ${T("data")}.`);
      const lat = w.latlon(c, r)[0], wd = w.wind(lat);
      if (wd != null) out.push(`The prevailing wind of this latitude blows towards the ${U.compass(Math.sin(wd * Math.PI / 180), -Math.cos(wd * Math.PI / 180))} ${T("mixed")}.`);
    }
    const tc = w.tempC(c, r);
    out.push(`The year here runs ${this.feel(tc)} (mean ${w.temp(tc)})${w.isLand(c, r) ? ` and ${this.wet(w.precMM(c, r))} (${U.num(w.precMM(c, r))} mm a year)` : ""} ${T("data")}.`);
    const rv = w.river(c, r);
    if (rv) out.push(`The ${rv.name} ${rv.type || "River"} runs through here ${T("data")}.`);
    const rt = w.route(c, r);
    if (rt) out.push(`${rt.group === "searoutes" ? "You are on a sea lane" : rt.group === "trails" ? "A trail passes" : "A road passes"}: the ${rt.name || "unnamed way"}, ${U.num(rt.length)} mi end to end ${T("data")}.`);
    if (w.isLand(c, r)) {
      const s = w.C.state[cell], pv = w.C.province[cell];
      const realm = s ? this.st(s).fullName : "neutral lands";
      out.push(`${pv ? this.P.provinces[pv].fullName + ", " : ""}${realm}; ${this.P.cultures[w.C.culture[cell]].name} country, keeping the ${this.P.religions[w.C.religion[cell]].name} ${T("data")}.`);
    }
    for (const z of w.zonesOfCell(cell)) out.push(`<b class="hook">${z.name}</b>: this ground lies in a ${z.type.toLowerCase()} zone ${T("data")}.`);
    const sight = this.sightTiles(c, r, aboard);
    const seen = w.near(c, r, sight).filter(n => n.d > 0.5).slice(0, 5);
    if (seen.length) {
      out.push("In sight: " + seen.map(n => `${n.o.name || n.o.type} (${this.dirDist(c, r, n.o.t).txt})`).join("; ") + ` ${T("data")}.`);
    }
    return out;
  }

  // ------------------------------------------------------------------ inspector
  inspect(c, r, g) {
    const w = this.w, U = AZ.U, T = AZ.T, P = this.P, cell = w.cell(c, r), land = w.isLand(c, r);
    const row = (k, v, t = "data") => `<tr><th>${k}</th><td>${v} ${T(t)}</td></tr>`;
    const sec = (title, rows) => (rows.length ? `<h4>${title}</h4><table>${rows.join("")}</table>` : "");
    const [lat, lon] = w.latlon(c, r);
    const f = w.feature(cell);
    const here = [
      row("Tile", `${c}, ${r} · ${U.num(w.miles, 2)} mi square`, "mixed"),
      row("Cell", `${cell}${f ? ` · ${f.name || ""} ${f.subtype || f.type}` : ""}`),
      row("Position", `${U.dms(lat, "lat")} ${U.dms(lon, "lon")} · ${w.geozone(lat)}`),
    ];
    const land1 = [];
    if (land) {
      const b = P.biomes[w.C.biome[cell]];
      land1.push(row("Biome", `${b.name} · habitability ${b.habitability} · move cost ${b.cost}`));
      land1.push(row("Elevation", `${U.num(w.C.hft[cell])} ${w.hunit} (cell)`));
      land1.push(row("Here", `${w.heightStr(w.h(c, r))}${w.reliefAt(c, r) ? " · " + w.reliefAt(c, r).rule : ""}`, "mixed"));
      land1.push(row("Precipitation", `${U.num(w.precMM(c, r))} mm`));
    } else {
      land1.push(row("Water", w.waterName(c, r)));
      land1.push(row("Depth", w.heightStr(w.h(c, r), true), "mixed"));
      const wd = w.wind(lat);
      if (wd != null) land1.push(row("Wind band", `towards ${U.compass(Math.sin(wd * Math.PI / 180), -Math.cos(wd * Math.PI / 180))} (${wd}°)`));
    }
    land1.push(row("Temperature", `${w.temp(w.tempC(c, r))} mean`));
    const rv = w.river(c, r);
    if (rv) land1.push(row("River", `${rv.name} ${rv.type} · ${U.num(rv.length)} km · discharge ${U.num(rv.discharge)} m³/s`));
    const rt = w.route(c, r);
    if (rt) land1.push(row("Route", `${rt.name || "unnamed"} (${rt.group}) · ${U.num(rt.length)} mi`));
    const realm = [];
    if (land || w.C.state[cell]) {
      const s = this.st(w.C.state[cell]);
      realm.push(row("State", w.C.state[cell] ? `${s.fullName} · ${s.form} · taxes ${Math.round(s.salesTax * 100)}% sales, ${Math.round(s.pollTax * 100)}% poll · treasury ${U.num(s.treasury)}` : "neutral lands"));
      const pv = w.C.province[cell];
      if (pv) realm.push(row("Province", P.provinces[pv].fullName));
    }
    const cu = P.cultures[w.C.culture[cell]], re = P.religions[w.C.religion[cell]];
    if (w.C.culture[cell]) realm.push(row("Culture", `${cu.name} · ${cu.type}`));
    if (w.C.religion[cell]) realm.push(row("Religion", `${re.name} · ${re.type}${re.form ? ", " + re.form : ""}${re.deity ? " · " + re.deity : ""}`));
    const [ru, ur] = w.population(cell);
    if (land) realm.push(row("Population", `${U.si(ru + ur)} (${U.si(ru)} rural, ${U.si(ur)} urban)`));
    const b = w.burgAt.get(w.idx(c, r));
    const burg = [];
    if (b) {
      const feats = ["capital", "port", "walls", "citadel", "plaza", "temple", "shanty"].filter(k => b[k]).join(", ");
      burg.push(row("Burg", `${b.name} · ${b.group}, ${b.type} · ${U.si(b.population * (w.W.units.population?.scale || 1000))}`));
      if (feats) burg.push(row("Has", feats));
      burg.push(row("Treasury", `${U.num(b.treasury, 2)} · product ${U.num(b.product, 2)}`));
      const goods = Object.entries(b.production || {}).sort((a, bb) => bb[1] - a[1]).slice(0, 6).map(([g, u]) => `${this.good(g)} ${u}`).join(", ");
      if (goods) burg.push(row("Makes", goods));
      const sells = this.tradeList(P.trade.sell[b.i]), buys = this.tradeList(P.trade.buy[b.i]);
      if (sells) burg.push(row("Sells to market", sells));
      if (buys) burg.push(row("Buys from market", buys));
    }
    const eco = [];
    if (w.C.good[cell]) eco.push(row("Resource", this.good(w.C.good[cell])));
    const prod = w.C.prod[String(cell)];
    if (prod) eco.push(row("Rural output", Object.entries(prod).sort((a, bb) => bb[1] - a[1]).slice(0, 6).map(([g, u]) => `${this.good(g)} ${u}`).join(", "), "mixed"));
    const mk = P.markets.find(m => m.i === w.C.market[cell]);
    if (mk) {
      const local = Object.keys(prod || {}).slice(0, 4).map(g => mk.goods[g] ? `${this.good(g)} ${mk.goods[g][1]}` : null).filter(Boolean).join(", ");
      eco.push(row("Market", `${P.burgs[mk.centerBurgId]?.name} market${local ? " · prices: " + local : ""}`));
    }
    const lore = [];
    for (const z of w.zonesOfCell(cell)) lore.push(row("Zone", `<b class="hook">${z.name}</b> (${z.type})`));
    for (const n of w.near(c, r, 4)) {
      if (n.kind === "burg" && n.d < 0.5) continue;
      if (n.kind === "marker") lore.push(row(n.d < 0.5 ? "Here" : this.dirDist(c, r, n.o.t).txt, `<b class="side">${U.esc(n.o.name)}</b>: ${U.esc((n.o.note || "").slice(0, 160))}`));
      else if (n.kind === "unit") lore.push(row(n.d < 0.5 ? "Here" : this.dirDist(c, r, n.o.t).txt, `${U.esc(n.o.name)} of ${this.st(n.o.state).name}, ${U.num(n.o.a)} ${n.o.naval ? "crew" : "troops"}`));
      else if (n.kind === "burg") lore.push(row(this.dirDist(c, r, n.o.t).txt, `${n.o.name} (${n.o.group})`));
    }
    const jr = [];
    if (g) {
      const seg = g.seg();
      if (seg) {
        jr.push(row("Stage", `<b class="hook">${seg.k}. ${U.esc(seg.name)}</b> · ${seg.transport}`));
        const pr = this.jr.progress(seg, c, r);
        if (pr) jr.push(row("Course", `${Math.round(pr.frac * 100)}% of the stage${pr.off ? `, ${U.num(pr.off * w.miles)} mi off the plan's track` : ", on the plan's track"}`, "mixed"));
        jr.push(row("Plan vs record", g.deltaText()));
      }
    }
    return `<div class="insp-head">${U.esc(b ? b.name : land ? (w.C.province[cell] ? P.provinces[w.C.province[cell]].name : "Wilds") : w.waterName(c, r))}</div>` +
      sec("Here", here) + sec(land ? "Land" : "Water", land1) + sec("Realm", realm) + sec("Settlement", burg) + sec("Economy", eco) + sec("Nearby (4 tiles)", lore) + sec("Journey", jr);
  }
  good(id) { const g = this.P.goods.find(x => x.i === +id); return g ? g.name : `good ${id}`; }
  tradeList(t) { if (!t) return ""; return Object.entries(t).slice(0, 4).map(([g, [u]]) => `${this.good(g)} ${u}`).join(", "); }

  // ------------------------------------------------------------------ rumours of distant things
  buildFacts() {
    const w = this.w, P = this.P, out = [], yr = this.year();
    for (const z of P.zones) {
      if (!z.cells?.length) continue;
      let x = 0, y = 0;
      for (const cc of z.cells) { x += w.C.cx[cc]; y += w.C.cy[cc]; }
      const t = w.tileAt(x / z.cells.length, y / z.cells.length);
      out.push({ t, kind: "zone", name: z.name, type: z.type, region: this.regionName(z.cells[0]) });
    }
    for (const s of P.states) {
      if (!s || !s.campaigns) continue;
      for (const cp of s.campaigns) if (cp.end == null && cp.attacker === s.i && cp.start >= yr - 3) {
        const cap = P.burgs[s.capital];
        if (cap) out.push({ t: cap.t, kind: "war", name: cp.name, a: s.name, d: P.states[cp.defender]?.name, start: cp.start });
      }
    }
    for (const m of P.markers) if (/monster|volcano|dungeon|ruins|portal|rift|necrop|burial|pirate|brigand|circus|fair|joust|librar/.test(m.type)) out.push({ t: m.t, kind: "marker", name: m.name, type: m.type, region: this.regionName(m.cell) });
    return out;
  }
  regionName(cell) { const s = this.w.C.state[cell], pv = this.w.C.province[cell]; return pv ? this.P.provinces[pv].name : s ? this.P.states[s].name : "the wild lands"; }
  rumour(c, r, rnd) {
    const U = AZ.U, T = AZ.T, w = this.w;
    if (!this.facts.length) return null;
    const scored = this.facts.map(f => ({ f, d: Math.hypot(f.t[0] - c, f.t[1] - r) * w.miles })).map(o => ({ ...o, wt: 1 / (1 + o.d / 400) }));
    let roll = rnd() * scored.reduce((a, o) => a + o.wt, 0), pick = scored[0];
    for (const o of scored) if ((roll -= o.wt) <= 0) { pick = o; break; }
    const { f, d } = pick, dir = U.compass(f.t[0] - c, f.t[1] - r);
    const near = d < 300, mid = d < 1500;
    const where = near ? `${U.num(Math.round(d / 10) * 10)} miles ${dir}` : mid ? `somewhere ${dir}, ${U.num(Math.round(d / 250) * 250)} miles off or so` : `far to the ${dir}, past where anyone here has been`;
    let s;
    if (f.kind === "war") s = near || mid ? `${f.a} has been at war with ${f.d} since ${f.start}, ${where}.` : `There is a war ${where}; the names change with each sailor who tells it.`;
    else if (f.kind === "zone") {
      const what = { Disease: "a sickness", Invasion: "an invading army", Rebels: "rebels in arms", Proselytism: "missionaries working the villages", Crusade: "a crusade", Disaster: "a dearth, and hungry people", Eruption: "a mountain breathing fire", Avalanche: "an avalanche that buried a valley", Fault: "the ground splitting open", Flood: "a great flood", Tsunami: "a wave that came out of the sea" }[f.type] || `trouble (${f.type})`;
      s = near ? `${U.cap(what)} in ${f.region}: they call it the ${f.name}, ${where}.` : mid ? `${U.cap(what)}, ${where}, in ${f.region}.` : `${U.cap(what)}, ${where}.`;
    } else {
      const thing = f.type.replace(/s$/, "").replace(/-/g, " ");
      s = near ? `${f.name}: ${where}. Ask about it if you go that way.` : mid ? `People speak of ${U.article(thing)} ${where}, in ${f.region}.` : `There are stories of ${U.article(thing)} ${where}. Bigger with every telling.`;
    }
    return `${s} ${T("mixed")}`;
  }

  // ------------------------------------------------------------------ people in a town
  townPeople(b, g) {
    const w = this.w, P = this.P, U = AZ.U, T = AZ.T, tv = this.tv;
    const cell = b.cell, s = this.st(b.state), cu = P.cultures[b.culture], re = P.religions[w.C.religion[cell]];
    const kin = b.culture === tv.culture, faith = w.C.religion[cell] === tv.faith;
    const rel = b.state ? this.rel(tv.homeState, b.state) : "Unknown";
    const people = [];
    const nm = role => this.person(`${b.i}:${role}`, b.culture);
    const greet = kin ? `speaks to you in your own ${cu.name} tongue` : `takes you in: a ${P.cultures[tv.culture].name} stranger`;
    if (b.port) people.push({ role: "Harbourmaster", name: nm("harbour"), talk: () => {
      const lanes = new Set();
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
        const cc = b.t[0] + dc, rr = b.t[1] + dr;
        if (!w.inb(cc, rr)) continue;
        const rt = w.route(cc, rr);
        if (rt && rt.group === "searoutes" && rt.name) lanes.add(rt.name);
      }
      const fleets = P.military.filter(u => u.naval && u.state === b.state && Math.hypot(u.t[0] - b.t[0], u.t[1] - b.t[1]) < 6);
      const pir = w.near(b.t[0], b.t[1], 60).filter(n => n.kind === "marker" && /pirate|sea-monster/.test(n.o.type));
      const L = [`${nm("harbour")}, harbourmaster of ${b.name}, ${greet} ${T("new")}.`];
      L.push(lanes.size ? `Ships out of here keep to: ${[...lanes].slice(0, 3).join(", ")} ${T("data")}.` : `Few named sea lanes touch ${b.name} ${T("data")}.`);
      if (fleets.length) L.push(`The ${fleets.map(f => f.name).join(" and ")} ${fleets.length > 1 ? "lie" : "lies"} here: ${fleets.map(f => `${f.u?.fleet || "?"} ships`).join(", ")} ${T("data")}.`);
      if (pir.length) L.push(`“Mind the water ${pir[0].dir || U.compass(pir[0].dc, pir[0].dr)}: ${pir[0].o.name.toLowerCase().includes("pirate") ? "pirate sails have been seen" : pir[0].o.name + ", the old sailors say"}, ${U.num(Math.round(pir[0].d * w.miles / 10) * 10)} miles off.” ${T("data")}`);
      return L;
    } });
    people.push({ role: b.group === "hamlet" || b.group === "village" ? "Host at the hearth" : "Innkeeper", name: nm("inn"), talk: () => {
      const L = [`${nm("inn")} keeps the ${b.group === "hamlet" || b.group === "village" ? "only hearth that takes guests" : "inn"} ${T("new")}, and ${greet}.`];
      const inn = w.near(b.t[0], b.t[1], 8).find(n => n.kind === "marker" && n.o.type === "inns");
      if (inn) L.push(`${inn.o.name} is ${this.dirDist(b.t[0], b.t[1], inn.o.t).txt}: ${U.esc(inn.o.note)} ${T("data")}`);
      const food = Object.keys(b.production || {}).map(g => P.goods.find(x => x.i === +g)).filter(g => g && (g.tags || []).some(t => /food|drink/.test(t)));
      if (food.length) L.push(`On the table: ${food.slice(0, 3).map(g => g.name.toLowerCase()).join(", ")}, all made here ${T("data")}.`);
      const rnd = U.rng(`${b.i}:${Math.floor(g.clock / 24)}`);
      const rm = this.rumour(b.t[0], b.t[1], rnd);
      if (rm) L.push(`“${rm}`.replace(/ <span/, "” <span"));
      return L;
    } });
    if (Object.keys(b.production || {}).length) people.push({ role: "Merchant", name: nm("market"), talk: () => {
      const mk = P.markets.find(m => m.i === b.market);
      const top = Object.entries(b.production).sort((a, bb) => bb[1] - a[1]).slice(0, 4);
      const L = [`${nm("market")} trades in ${b.name}${mk ? `, which buys and sells through the ${P.burgs[mk.centerBurgId]?.name} market` : ""} ${T("data")}.`];
      L.push(`Made here: ${top.map(([g, u]) => `${this.good(g)} (${u} units)`).join(", ")} ${T("data")}.`);
      const sells = this.tradeList(P.trade.sell[b.i]), buys = this.tradeList(P.trade.buy[b.i]);
      if (sells) L.push(`Sold on: ${sells} ${T("data")}.`);
      if (buys) L.push(`Brought in: ${buys} ${T("data")}.`);
      if (mk) {
        const p = top.map(([g]) => mk.goods[g] ? `${this.good(g)} at ${mk.goods[g][1]}` : null).filter(Boolean);
        if (p.length) L.push(`Market prices: ${p.join(", ")} ${T("data")}.`);
      }
      L.push(`The town's treasury stands at ${U.num(b.treasury, 2)}; its trade earned ${U.num(b.product, 2)} ${T("data")}.`);
      return L;
    } });
    people.push({ role: b.temple ? "Priest" : "Shrine-keeper", name: nm("temple"), talk: () => {
      const L = [`${nm("temple")} keeps the ${b.temple ? "temple" : "shrine"} of the ${re.name}: ${re.type}${re.form ? ", " + re.form : ""}${re.deity ? `; they pray to ${re.deity}` : ""} ${T("data")}.`];
      if (re.center === cell) L.push(`<b class="hook">This is the seat of the ${re.name}.</b> ${T("data")}`);
      const destRel = w.C.religion[this.jr.segs[this.jr.segs.length - 1].to];
      if (faith) L.push(`You share the faith. ${nm("temple")} blesses ${tv.token} and asks you to carry a prayer to ${this.jr.dest.name} ${T("new")}.`);
      else if (w.C.religion[cell] === destRel) L.push(`You are not of this faith, but your road ends in ${this.jr.dest.name}, and that is enough to be welcome ${T("mixed")}.`);
      else L.push(`You are not of this faith. You are given water and courtesy, no more ${T("mixed")}.`);
      if (w.C.religion[cell] === destRel && re.center !== cell) {
        const seat = P.burgs.find(x => x && x.cell === re.center);
        if (seat) L.push(`The faith's seat is ${seat.name}, ${this.dirDist(b.t[0], b.t[1], seat.t).txt} ${T("data")}.`);
      }
      return L;
    } });
    people.push({ role: b.walls || b.citadel || b.capital ? "Captain of the watch" : "Elder", name: nm("watch"), talk: () => {
      const L = [];
      if (b.state) {
        L.push(`${nm("watch")} speaks for ${s.fullName}, a ${s.form.toLowerCase()} ${T("data")}. Your people stand to theirs as: <b>${rel}</b> ${T("data")}.`);
        if (rel === "Enemy") L.push(`You are held and questioned for six hours before they let you go ${T("mixed")}.`);
        else if (rel === "Suspicion" || rel === "Rival") L.push(`They ask your business twice and write your name down ${T("mixed")}.`);
        const wars = (s.campaigns || []).filter(cp => cp.end == null);
        if (wars.length) L.push(`At war: ${wars.map(cp => `${cp.name} (since ${cp.start})`).join("; ")} ${T("data")}.`);
        const allies = (s.diplomacy || []).map((d, i) => (d === "Ally" ? this.st(i)?.name : null)).filter(Boolean);
        if (allies.length) L.push(`Allies: ${allies.join(", ")} ${T("data")}.`);
        const regs = P.military.filter(u => u.state === b.state && !u.naval && Math.hypot(u.t[0] - b.t[0], u.t[1] - b.t[1]) < 8);
        if (regs.length) L.push(`Garrison nearby: ${regs.map(u => `${u.name} (${U.num(u.a)})`).join(", ")} ${T("data")}.`);
        L.push(`Taxes: ${Math.round(s.salesTax * 100)}% on sales, ${Math.round(s.pollTax * 100)}% poll ${T("data")}.`);
      } else L.push(`${nm("watch")} is the eldest here. No state claims ${b.name} ${T("data")}.`);
      return L;
    }, cost: () => (rel === "Enemy" ? 6 : rel === "Suspicion" || rel === "Rival" ? 1 : 0) });
    people.push({ role: "Townsfolk", name: nm("folk"), talk: () => {
      const feats = ["walls", "citadel", "plaza", "temple", "shanty", "port"].filter(k => b[k]);
      const L = [`${b.name}: ${U.article(b.group.replace("_", " "))} of ${U.num(b.population * (w.W.units.population?.scale || 1000))} ${cu.name} people (${b.type}) ${T("data")}${feats.length ? `, with ${feats.join(", ")}` : ""}.`];
      for (const z of w.zonesOfCell(cell)) L.push(`<b class="hook">${z.name}</b> is here: a ${z.type.toLowerCase()} ${T("data")}.`);
      const rnd = U.rng(`${b.i}:folk:${Math.floor(g.clock / 24)}`);
      const rm = this.rumour(b.t[0], b.t[1], rnd);
      if (rm) L.push(`Someone says: ${rm}`);
      return L;
    } });
    people.push({ role: "Notice board", name: "", talk: () => {
      const L = [];
      const near = w.near(b.t[0], b.t[1], 24).filter(n => n.kind === "marker");
      for (const n of near.slice(0, 4)) L.push(`<b class="side">${U.esc(n.o.name)}</b>, ${this.dirDist(b.t[0], b.t[1], n.o.t).txt}: ${U.esc((n.o.note || "").slice(0, 140))} ${T("data")}`);
      return L.length ? L : [`Nothing posted but tax notices ${T("new")}.`];
    } });
    return people;
  }

  // ------------------------------------------------------------------ the journey's scenes
  intro(g) {
    const U = AZ.U, T = AZ.T, P = this.P, w = this.w, tv = this.tv, jr = this.jr;
    const o = jr.origin.burg, d = jr.dest.burg;
    const L = [];
    L.push(`<b class="hook">${U.esc(jr.J.name)}</b> ${T("data")}`);
    L.push(`You are ${tv.name}, ${tv.age}, a ${tv.trade} ${T("new")}. ${U.cap(tv.why)} ${T("mixed")}.`);
    if (o) L.push(`You stand in ${o.name}, capital of ${this.st(o.state).fullName}: a ${o.type.toLowerCase()} port of ${U.si(o.population * 1000)} ${P.cultures[o.culture].name} people who keep the ${P.religions[w.C.religion[o.cell]].name} ${T("data")}.`);
    if (d) L.push(`Your goal is ${d.name}, a small capital of ${this.st(d.state).fullName}, ${U.num(jr.totalMiles)} miles away by sea ${T("data")}. The plan gives the voyage ${Math.round((jr.planEnd - 6) / 24)} days ${T("mixed")}.`);
    const destRel = w.C.religion[jr.segs[jr.segs.length - 1].to];
    const seat = P.burgs.find(b => b && b.cell === P.religions[destRel].center);
    if (seat && seat !== d) L.push(`The first port of call is ${seat.name}: the seat of the ${P.religions[destRel].name} itself ${T("data")}.`);
    for (const s of jr.segs) {
      const b = s.place.burg;
      if (b && s.place.at) {
        const r = P.religions.find(x => x && x.center === b.cell && x !== P.religions[destRel]);
        if (r) L.push(`The route also calls at ${b.name}, where the ${r.name} (${r.type.toLowerCase()}) has its seat ${T("data")}.`);
      }
    }
    L.push(`You carry ${tv.token} ${T("new")}. <b class="hook">First: book passage at the harbour of ${jr.origin.name}.</b> Press Space on the town to go in.`);
    void g;
    return [...new Set(L)];
  }
  stageScene(seg, g) {
    const U = AZ.U, T = AZ.T, w = this.w, P = this.P, jr = this.jr;
    const next = jr.segs[seg.k + 1], place = seg.place;
    const b = place.burg, cul = b ? b.culture : w.C.culture[seg.to];
    const L = [`<b class="hook">${U.esc(seg.name)}</b> ${T("data")} · ${seg.duration} h by the plan`];
    if (seg.verb === "booking" && next) {
      const who = this.person(`${b?.i}:harbour`, cul);
      const days = next.hoursPerDay >= 24 ? next.travelHours / 24 : next.travelHours / next.hoursPerDay;
      L.push(`${who}, harbourmaster, finds you a berth on a ${next.transport.toLowerCase()} bound for ${next.place.name}: ${U.num(next.miles)} miles, about ${Math.round(days)} days at ${next.speed} mph and ${next.hoursPerDay} hours' sailing a day ${T("mixed")}.`);
      L.push(`The master will not sail before the tide and the cargo are right. ${seg.duration} hours pass in waiting ${T("new")}.`);
    } else if (seg.verb === "rest") {
      const m = seg.name.match(/\bat (.+)$/i);
      const host = this.person(`${b?.i}:inn`, cul);
      if (m) L.push(`${m[1]} is ${U.article("inn")} in ${b?.name || place.name}; it appears in no record but this journey's ${T("new")}. ${host} keeps it.`);
      if (/alms/i.test(seg.name)) {
        const re = P.religions[w.C.religion[seg.to]];
        L.push(`You give alms at the ${re.center === seg.to ? "seat" : "temple"} of the ${re.name} ${T(re.center === seg.to ? "data" : "mixed")}.`);
      }
      if (/shelter/i.test(seg.name)) L.push(`Weather keeps you ashore; ${host} finds you a corner by the fire ${T("new")}.`);
      L.push(`${seg.duration} hours of rest ${T("data")}.`);
    } else if (seg.verb === "anchor") {
      L.push(`The crew drops anchor ${place.name} for ${seg.duration} hours ${T("data")}.`);
      if (place.burg) L.push(`${place.burg.name} shows as a few lights on the shore: ${U.article(place.burg.group)} of ${U.si(place.burg.population * 1000)} in ${this.st(place.burg.state)?.name || "unclaimed land"} ${T("data")}.`);
    } else L.push(`${seg.duration} hours pass ${T("data")}.`);
    if (next) L.push(`<b class="hook">Next: ${U.esc(next.name)}</b> → ${next.place.name}.`);
    void g;
    return L;
  }
};

// ---------------------------------------------------------------------------------------------
// UI: windows in the RPG Maker manner. say() and choose() return promises, so scenes can be
// written as straight-line scripts.
// ---------------------------------------------------------------------------------------------
AZ.UI = class {
  constructor() {
    const $ = id => document.getElementById(id);
    this.el = { msg: $("msg"), modal: $("modal"), toasts: $("toasts"), banner: $("banner"), panel: $("panel"),
                loc: $("hud-loc"), trip: $("hud-trip"), legend: $("legend"), mini: $("mini") };
    this.active = null; // {type, ...}
    this.modalKey = null;
  }
  busy() { return !!this.active || !!this.modalKey; }
  say(pages, who) {
    pages = (Array.isArray(pages) ? pages : [pages]).filter(Boolean);
    if (!pages.length) return Promise.resolve();
    return new Promise(res => {
      let i = 0;
      const show = () => {
        this.el.msg.innerHTML = `${who ? `<div class="who">${who}</div>` : ""}<div class="page">${pages[i]}</div><div class="more">${i < pages.length - 1 ? "▼" : "■"}</div>`;
        this.el.msg.classList.add("on");
        this.el.msg.scrollTop = 0;
      };
      const next = () => {
        i++;
        if (i >= pages.length) { this.close(); res(); } else show();
      };
      this.active = { type: "say", next };
      this.el.msg.onclick = next;
      show();
    });
  }
  choose(prompt, options, opts = {}) {
    return new Promise(res => {
      let sel = options.findIndex(o => !o.disabled);
      const render = () => {
        this.el.msg.innerHTML = `${opts.who ? `<div class="who">${opts.who}</div>` : ""}${prompt ? `<div class="page">${prompt}</div>` : ""}<ul class="choices">${options.map((o, k) =>
          `<li data-k="${k}" class="${k === sel ? "sel " : ""}${o.cls || ""}${o.disabled ? " dis" : ""}">${k === sel ? "▶ " : "&nbsp;&nbsp;"}${o.label}</li>`).join("")}</ul>`;
        this.el.msg.classList.add("on");
        this.el.msg.querySelectorAll("li").forEach(li => {
          li.onclick = e => { e.stopPropagation(); const k = +li.dataset.k; if (!options[k].disabled) { this.close(); res(k); } };
        });
        const s = this.el.msg.querySelector("li.sel");
        if (s && s.scrollIntoView) s.scrollIntoView({ block: "nearest" });
      };
      const move = d => {
        for (let t = 0; t < options.length; t++) { sel = (sel + d + options.length) % options.length; if (!options[sel].disabled) break; }
        render();
      };
      this.active = { type: "choose", move, pick: () => { this.close(); res(sel); }, cancel: () => { if (opts.cancel != null) { this.close(); res(opts.cancel); } } };
      this.el.msg.onclick = null;
      render();
    });
  }
  close() { this.el.msg.classList.remove("on"); this.el.msg.innerHTML = ""; this.active = null; }
  key(e) {
    const a = this.active, k = e.key;
    if (this.modalKey) { this.modalKey(e); return true; }
    if (!a) return false;
    if (a.type === "say") { if ([" ", "Enter", "z", "Z", "Escape", "x", "X"].includes(k)) a.next(); return true; }
    if (a.type === "choose") {
      if (k === "ArrowUp" || k === "w" || k === "W") a.move(-1);
      else if (k === "ArrowDown" || k === "s" || k === "S") a.move(1);
      else if (k === "Enter" || k === " " || k === "z" || k === "Z") a.pick();
      else if (k === "Escape" || k === "x" || k === "X") a.cancel();
      return true;
    }
    return false;
  }
  toast(html, cls = "") {
    const d = document.createElement("div");
    d.className = "toast win " + cls;
    d.innerHTML = html;
    this.el.toasts.prepend(d);
    while (this.el.toasts.children.length > 5) this.el.toasts.lastChild.remove();
    setTimeout(() => d.classList.add("fade"), 5200);
    setTimeout(() => d.remove(), 6200);
  }
  banner(title, sub) {
    const b = this.el.banner;
    b.innerHTML = `<div class="t">${title}</div>${sub ? `<div class="s">${sub}</div>` : ""}`;
    b.classList.remove("on"); void b.offsetWidth; b.classList.add("on");
    clearTimeout(this._bt); this._bt = setTimeout(() => b.classList.remove("on"), 3200);
  }
  modal(html, onKey) {
    this.el.modal.innerHTML = html;
    this.el.modal.classList.add("on");
    this.modalKey = onKey || (e => { if (["Escape", "x", "X", "Enter", " "].includes(e.key)) this.closeModal(); });
  }
  closeModal() { this.el.modal.classList.remove("on"); this.el.modal.innerHTML = ""; this.modalKey = null; if (this.onModalClose) { const f = this.onModalClose; this.onModalClose = null; f(); } }
};

// ---------------------------------------------------------------------------------------------
// The game: one traveller, one journey. The plan (the map's journey) is fixed; the record is
// what happens in play. Everything that costs time is counted against the plan.
// ---------------------------------------------------------------------------------------------
AZ.DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

AZ.Game = class {
  constructor(w, ren, ui, jr, store) {
    this.w = w; this.ren = ren; this.ui = ui; this.jr = jr; this.store = store;
    this.key = `azrpg:${w.P.world.seed}:${jr ? jr.J.name : "free"}`;
    this.held = []; this.anim = null; this.s = null; this.lensIdx = 0; this.inspectOn = false;
    this.walkSpeed = (w.W.transports.find(t => t.name === "On foot (light)") || { speed: 5 }).speed;
  }
  // ------------------------------------------------------------------ state
  fresh(seed) {
    const w = this.w, jr = this.jr;
    const start = jr ? jr.origin.tile : (w.P.burgs.find(b => b && b.capital) || {}).t || [0, 0];
    this.tv = AZ.makeTraveller(w, jr, seed);
    this.know = new AZ.Know(w, jr, this.tv);
    this.s = { seed, c: start[0], r: start[1], dir: "down", aboard: false, vessel: null, clock: 6, stage: 0,
               rec: [], log: [], seen: { m: [], u: [], b: [], z: [], st: [], cu: [], re: [], bi: [] },
               waypoint: null, auto: false, region: "", done: false };
    this.explored = new Uint8Array(Math.ceil((w.cols * w.rows) / 8));
    this.s.rec[0] = { start: 6 };
    this.reveal();
  }
  saveGame() {
    if (!this.s) return;
    const runs = [];
    for (let i = 0; i < this.explored.length;) { let j = i; while (j < this.explored.length && this.explored[j] === this.explored[i] && j - i < 65535) j++; runs.push(this.explored[i], j - i); i = j; }
    const data = { v: 1, s: this.s, ex: runs, lens: this.lensIdx };
    try { this.store.setItem(this.key, JSON.stringify(data)); return true; } catch (e) { return false; }
  }
  loadGame() {
    let data = null;
    try { data = JSON.parse(this.store.getItem(this.key) || "null"); } catch (e) { data = null; }
    if (!data || !data.s) return false;
    this.s = data.s;
    this.tv = AZ.makeTraveller(this.w, this.jr, this.s.seed);
    this.know = new AZ.Know(this.w, this.jr, this.tv);
    this.explored = new Uint8Array(Math.ceil((this.w.cols * this.w.rows) / 8));
    let o = 0;
    for (let k = 0; k < data.ex.length; k += 2) { this.explored.fill(data.ex[k], o, o + data.ex[k + 1]); o += data.ex[k + 1]; }
    this.lensIdx = data.lens || 0;
    return true;
  }
  hasSave() { try { return !!this.store.getItem(this.key); } catch (e) { return false; } }
  seg() { return this.jr && !this.s.done ? this.jr.segs[this.s.stage] || null : null; }
  get clock() { return this.s.clock; }
  log(html, cls = "") { this.s.log.push({ t: this.s.clock, html, cls }); if (this.s.log.length > 400) this.s.log.shift(); }
  lat() { return this.w.latlon(this.s.c, this.s.r)[0]; }
  // ------------------------------------------------------------------ plan versus record
  planNow() {
    const seg = this.seg();
    if (!seg) return this.jr ? this.jr.planEnd : this.s.clock;
    if (!seg.moving) return seg.planStart;
    const pr = this.jr.progress(seg, this.s.c, this.s.r);
    return this.jr.planTimeAt(seg, this.s.aboard ? pr.frac : 0);
  }
  delta() { return this.s.clock - this.planNow(); }
  deltaText() {
    const d = this.delta();
    if (Math.abs(d) < 1) return "on plan";
    return `${AZ.Clock.span(Math.abs(d))} ${d > 0 ? "behind" : "ahead of"} plan`;
  }
  goal() {
    const seg = this.seg();
    if (!seg) return null;
    return seg.moving ? seg.endTile : seg.place.tile;
  }
  // ------------------------------------------------------------------ movement
  passable(c, r) {
    const w = this.w;
    if (!w.inb(c, r)) return { ok: false, why: "The edge of the known world." };
    const id = w.idx(c, r), land = w.isLand(c, r);
    if (this.s.aboard) {
      if (!land) return { ok: true };
      const b = w.burgAt.get(id);
      if (b && b.port) return { ok: true, dock: b };
      if (this.jr && this.jr.course.has(id)) return { ok: true };
      return { ok: false, why: "Land ahead. Press Space to go ashore; the ship will wait." };
    }
    const v = this.s.vessel;
    if (v && v.c === c && v.r === r) return { ok: true, board: true };
    if (!land) return { ok: false, why: "Too deep to wade. You need a boat." };
    return { ok: true };
  }
  stepHours(c, r, dc, dr) {
    const w = this.w, U = AZ.U;
    if (this.s.aboard) {
      const v = this.s.vessel, lat = w.latlon(c, r)[0], wd = w.wind(lat);
      let f = 1;
      if (wd != null) { const hd = Math.atan2(dc, -dr), wr = (wd * Math.PI) / 180; f = 1 + 0.1 * Math.cos(hd - wr); }
      // on the plan's course a step is worth the course's own miles (the track is a polyline;
      // its tile chain zigzags), so following the course costs what the plan says it costs
      const seg = this.seg();
      let miles = w.miles;
      if (seg && seg.moving) {
        const a = seg.chainPos.get(w.idx(this.s.c, this.s.r)), b = seg.chainPos.get(w.idx(c, r));
        if (a !== undefined && b !== undefined && Math.abs(a - b) === 1) miles = seg.miles / Math.max(1, seg.chain.length - 1);
      }
      return miles / v.speed / f;
    }
    const cell = w.cell(c, r), b = w.P.biomes[w.C.biome[cell]], B = w.bits(c, r);
    let f = B.road ? 0.8 : B.trail ? 1 : U.clamp((b.cost || 50) / 50, 1, 4);
    const rel = w.reliefAt(c, r);
    if (rel && !B.road) f *= /mount/i.test(rel.icon) ? 1.6 : 1.2;
    let h = (w.miles / this.walkSpeed) * f;
    if (B.river && !B.road && !B.trail) h += 0.5;
    if (AZ.Clock.light(this.s.clock, lat).phase === "night") h *= 1.5;
    return h;
  }
  tryMove(dir) {
    if (this.anim || this.ui.busy() || !this.s) return false;
    const [dc, dr] = AZ.DIRS[dir], s = this.s;
    s.dir = dir;
    const c = s.c + dc, r = s.r + dr, p = this.passable(c, r);
    if (!p.ok) {
      if (this._lastWhy !== p.why || performance.now() - (this._whyT || 0) > 2500) { this.ui.toast(p.why); this._lastWhy = p.why; this._whyT = performance.now(); }
      if (s.auto) this.setAuto(false);
      return false;
    }
    const hours = this.stepHours(c, r, dc, dr);
    this.anim = { from: [s.c, s.r], to: [c, r], t0: performance.now(), dur: s.auto ? (this.fast ? 28 : 70) : s.aboard ? 110 : 140 };
    s.c = c; s.r = r; s.clock += hours;

      const rect = cv.getBoundingClientRect(), c = Math.floor(((e.clientX - rect.left) / rect.width) * w.cols), r = Math.floor(((e.clientY - rect.top) / rect.height) * w.rows);
      s.waypoint = [c, r];
      const cell = w.cell(c, r), b = w.near(c, r, 3).find(n => n.kind === "burg");
      document.getElementById("minfo").innerHTML = `Waypoint: ${w.isLand(c, r) ? U.esc(w.P.biomes[w.C.biome[cell]].name) + " in " + U.esc(this.know.regionName(cell)) : U.esc(w.waterName(c, r))}${b ? " · near " + U.esc(b.o.name) : ""} · ${this.know.dirDist(s.c, s.r, [c, r]).txt} of you`;
      draw(); this.dirty = true;
    };
    ui.modalKey = e => {
      if (e.key === "l" || e.key === "L") { this.lensIdx = (this.lensIdx + (e.shiftKey ? -1 : 1) + AZ.LENSES.length) % AZ.LENSES.length; document.getElementById("mlens").textContent = AZ.LENSES[this.lensIdx].name; draw(); this.dirty = true; }
      else if (["Escape", "m", "M", "x", "X"].includes(e.key)) ui.closeModal();
    };
  }
  journal() {
    const s = this.s, U = AZ.U, jr = this.jr, tv = this.tv, w = this.w;
    const rows = jr ? jr.segs.map((sg, k) => {
      const rec = s.rec[k] || {};
      const d = rec.end != null ? rec.end - sg.planEnd : null;
      return `<tr class="${k === s.stage && !s.done ? "cur" : ""}"><td>${k + 1}</td><td>${U.esc(sg.name)}</td><td>${U.esc(sg.transport)}</td><td>${sg.moving ? U.num(sg.miles) : sg.duration + " h"}</td><td>${AZ.Clock.fmt(sg.planEnd)}</td><td>${rec.end != null ? AZ.Clock.fmt(rec.end) : "—"}</td><td class="${d > 24 ? "late" : ""}">${d != null ? this.deltaTextAt(d) : ""}</td></tr>`;
    }).join("") : "";
    const cnt = (k, list) => `${s.seen[k].length} of ${w.P[list].filter(x => x && !x.removed).length - (list === "states" || list === "cultures" || list === "religions" ? 1 : 0)}`;
    this.ui.modal(`<div class="sheet"><h2>Journal</h2>
      <h3>The traveller ${AZ.T("new")}</h3><p><b>${U.esc(tv.name)}</b>, ${tv.age}, ${U.esc(tv.trade)}. ${U.cap(U.esc(tv.why))}. ${w.P.cultures[tv.culture].name}; faith: ${w.P.religions[tv.faith]?.name}. Carries ${U.esc(tv.token)}.</p>
      ${jr ? `<h3>Plan and record</h3><p class="dim">Plan: the map's journey ${AZ.T("data")}, timed from Day 1 06:00 with each mode's speed and hours per day ${AZ.T("mixed")}. Record: your play.</p>
      <table class="plan"><tr><th>#</th><th>Stage</th><th>Mode</th><th>Miles / hours</th><th>Plan done</th><th>Record</th><th>Slippage</th></tr>${rows}</table>` : ""}
      <h3>Seen so far</h3><p>States ${cnt("st", "states")} · cultures ${cnt("cu", "cultures")} · faiths ${cnt("re", "religions")} · biomes ${s.seen.bi.length} · towns ${s.seen.b.length} · marked places ${s.seen.m.length} of ${w.P.markers.length} · forces ${s.seen.u.length} · zones ${s.seen.z.length} of ${w.P.zones.length}</p>
      <h3>Log</h3><div class="log">${s.log.slice().reverse().map(e => `<div class="${e.cls}"><span class="dim">${AZ.Clock.fmt(e.t)}</span> ${e.html}</div>`).join("") || "<div class='dim'>Nothing yet.</div>"}</div>
      <p class="dim">J or Esc to close</p></div>`, e => { if (["Escape", "j", "J", "x", "X"].includes(e.key)) this.ui.closeModal(); });
  }
  help() {
    this.ui.modal(`<div class="sheet"><h2>How to play</h2><table class="keys">
      <tr><th>Arrows / WASD</th><td>Walk, or steer the ship</td></tr><tr><th>Space / Enter</th><td>Go into a town · read a marker · hail a unit · go ashore / board · look around</td></tr>
      <tr><th>F</th><td>Autopilot along the plan's course (Shift+F: fast). Any arrow takes the helm.</td></tr>
      <tr><th>R</th><td>Rest or wait; at a sea stop, carry out the stage</td></tr><tr><th>I</th><td>Inspector: every data layer for the tile you stand on</td></tr>
      <tr><th>L / Shift+L</th><td>Lens: tint the map by biome, height, temperature, rain, state, province, culture, religion, population, market, resource, zones</td></tr>
      <tr><th>M</th><td>World map (click to set a waypoint)</td></tr><tr><th>J</th><td>Journal: traveller, plan versus record, log</td></tr>
      <tr><th>+ / −</th><td>Zoom</td></tr><tr><th>Esc</th><td>Menu</td></tr></table>
      <p>Gold is the main journey, teal is everything else worth a detour. Tags: ${AZ.T("data")} read from the map files · ${AZ.T("mixed")} a stated rule applied to data · ${AZ.T("new")} invented for this playthrough.</p>
      <p>One tile is ${AZ.U.num(this.w.miles, 2)} miles, the square of your Azgaar grid overlay. Every step costs time: walking speed and the biome's move cost on land; the vessel's speed and the latitude's wind at sea. Boats that sail fewer than 24 hours a day anchor at night, as the plan does.</p>
      <p class="dim">Esc to close</p></div>`);
  }
  async menu() {
    const k = await this.ui.choose("<b>Menu</b>", [{ label: "Journal (J)" }, { label: "World map (M)" }, { label: "Inspector (I)" }, { label: "Lens (L)" }, { label: "Save now" }, { label: "How to play (H)" }, { label: "New journey" }, { label: "Back" }], { cancel: 7 });
    if (k === 0) this.journal(); else if (k === 1) this.worldMap(); else if (k === 2) this.toggleInspect(); else if (k === 3) this.cycleLens();
    else if (k === 4) this.ui.toast(this.saveGame() ? "Saved in this browser." : "Could not save here.");
    else if (k === 5) this.help(); else if (k === 6) this.title(true);
  }
  toggleInspect() { this.inspectOn = !this.inspectOn; this.ui.el.panel.classList.toggle("on", this.inspectOn); this.dirty = true; }
  title(fromMenu) {
    const U = AZ.U, w = this.w, jr = this.jr, can = this.hasSave() && !fromMenu;
    let seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
    const show = () => {
      const tv = AZ.makeTraveller(w, jr, seed);
      this.ui.modal(`<div class="title"><div class="logo">${U.esc(jr ? jr.J.name : w.P.world.name)}</div>
        <div class="sub">${U.esc(w.P.world.name)} (${U.esc(w.P.world.folder)}) · year ${w.W.calendar?.year || "?"} ${U.esc(w.W.calendar?.era || "")}</div>
        <div class="card win"><div class="who">Your traveller ${AZ.T("new")}</div><b>${U.esc(tv.name)}</b>, ${tv.age}, ${U.esc(tv.trade)} · ${U.esc(w.P.cultures[tv.culture].name)}<br>${U.cap(U.esc(tv.why))}.</div>
        <ul class="choices big"><li data-a="new">▶ Begin with this traveller</li><li data-a="roll">Another traveller</li>${can ? '<li data-a="cont">Continue saved journey</li>' : ""}<li data-a="help">How to play</li></ul>
        <div class="dim">${U.num(w.cols)} × ${U.num(w.rows)} tiles of ${U.num(w.miles, 2)} mi · ${U.esc(w.P.grid.source)}</div></div>`, e => {
        const items = [...this.ui.el.modal.querySelectorAll("li")];
        let i = items.findIndex(li => li.textContent.startsWith("▶"));
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          items[i].textContent = items[i].textContent.replace(/^▶ /, "");
          i = (i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
          items[i].textContent = "▶ " + items[i].textContent;
        } else if (e.key === "Enter" || e.key === " ") act(items[i].dataset.a);
      });
      this.ui.el.modal.querySelectorAll("li").forEach(li => (li.onclick = () => act(li.dataset.a)));
    };
    const act = a => {
      if (a === "roll") { seed = (seed * 1664525 + 1013904223) >>> 0; show(); }
      else if (a === "help") { this.help(); this.ui.onModalClose = () => show(); }
      else if (a === "cont") { this.ui.closeModal(); this.loadGame(); this.started(); this.ui.toast(`Welcome back, ${U.esc(this.tv.name)}.`); }
      else if (a === "new") { this.ui.closeModal(); this.fresh(seed); this.started(); this.saveGame(); if (jr) this.ui.say(this.know.intro(this)); }
    };
    show();
  }
  started() { this._steps = 0; this.dirty = true; this.s.region = ""; this.afterStep(); }
  // ------------------------------------------------------------------ loop
  frame(now) {
    if (!this.s) return;
    const s = this.s;
    if (this.anim && now - this.anim.t0 >= this.anim.dur) this.anim = null;
    if (!this.anim && !this.ui.busy()) {
      if (s.auto) { const d = this.autoDir(); if (d) this.tryMove(d); else this.setAuto(false); }
      else if (this.held.length) this.tryMove(this.held[this.held.length - 1]);
    }
    let cx = s.c, cy = s.r;
    if (this.anim) { const t = Math.min(1, (now - this.anim.t0) / this.anim.dur); cx = this.anim.from[0] + (this.anim.to[0] - this.anim.from[0]) * t; cy = this.anim.from[1] + (this.anim.to[1] - this.anim.from[1]) * t; }
    const frame = this.anim ? 1 + (Math.floor(now / 120) % 2) : 0;
    const sprites = [];
    if (s.vessel && !s.aboard) sprites.push({ img: this.ren.art.vessel(s.vessel.kind === "Sailing boat" ? "boat" : "ship", "left"), c: s.vessel.c, r: s.vessel.r });
    const me = s.aboard ? this.ren.art.vessel(/boat|row/i.test(s.vessel.kind) ? "boat" : "ship", s.dir === "left" ? "left" : "right")
      : this.ren.art.walker(s.dir, frame, this.tv.pal);
    sprites.push({ img: me, c: cx, r: cy });
    const seg = this.seg();
    this.ren.draw({ camX: cx + 0.5, camY: cy + 0.5, sprites, lens: AZ.LENSES[this.lensIdx], light: AZ.Clock.light(s.clock, this.lat()),
      course: seg && seg.moving ? seg.chain : null, goal: this.goal(), waypoint: s.waypoint, time: now });
    if (this.dirty) { this.dirty = false; this.hud(); }
    if (now - (this._pf || 0) > 60) { this._pf = now; this.ren.prefetch(cx + 0.5, cy + 0.5); }
  }
};

AZ.boot = async function (packText) {
  const status = document.getElementById("status");
  try {
    const P = await AZ.loadPack(packText);
    const w = new AZ.World(P);
    const mk = (W, H) => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
    const art = new AZ.Art(w, mk);
    const cv = document.getElementById("view");
    const ren = new AZ.Renderer(w, art, cv, mk);
    const jr = P.journeys.length ? new AZ.Journey(w, P.journeys[0]) : null;
    let store;
    try { store = window.localStorage; store.getItem("x"); } catch (e) { store = { getItem: () => null, setItem: () => { throw e; } }; }
    const ui = new AZ.UI();
    const g = new AZ.Game(w, ren, ui, jr, store);
    AZ.game = g;
    const fit = () => { cv.width = window.innerWidth; cv.height = window.innerHeight; g.dirty = true; };
    window.addEventListener("resize", fit); fit();
    status.remove();
    const DK = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
    window.addEventListener("keydown", e => {
      if (e.target && e.target.tagName === "INPUT") return;
      if (ui.key(e)) { e.preventDefault(); return; }
      if (!g.s) return;
      const k = e.key;
      if (DK[k]) { e.preventDefault(); if (g.s.auto) g.setAuto(false); if (!g.held.includes(DK[k])) g.held.push(DK[k]); return; }
      if (k === " " || k === "Enter" || k === "z" || k === "Z") { e.preventDefault(); g.interact(); }
      else if (k === "f" || k === "F") { if (e.shiftKey) { g.fast = true; g.setAuto(true); } else { g.fast = false; g.setAuto(!g.s.auto); } }
      else if (k === "r" || k === "R") g.rest();
      else if (k === "i" || k === "I") g.toggleInspect();
      else if (k === "l" || k === "L") g.cycleLens(e.shiftKey ? -1 : 1);
      else if (k === "m" || k === "M") g.worldMap();
      else if (k === "j" || k === "J") g.journal();
      else if (k === "h" || k === "H" || k === "?") g.help();
      else if (k === "+" || k === "=") { ren.zoom = Math.min(4, ren.zoom + 1); g.dirty = true; }
      else if (k === "-" || k === "_") { ren.zoom = Math.max(1, ren.zoom - 1); g.dirty = true; }
      else if (k === "Escape" || k === "x" || k === "X") g.menu();
    });
    window.addEventListener("keyup", e => { const d = DK[e.key]; if (d) g.held = g.held.filter(x => x !== d); });
    window.addEventListener("blur", () => (g.held = []));
    // touch controls
    document.querySelectorAll("[data-pad]").forEach(btn => {
      const d = btn.dataset.pad;
      const on = e => { e.preventDefault(); if (g.s?.auto) g.setAuto(false); if (!g.held.includes(d)) g.held.push(d); };
      const off = e => { e.preventDefault(); g.held = g.held.filter(x => x !== d); };
      btn.addEventListener("pointerdown", on); btn.addEventListener("pointerup", off); btn.addEventListener("pointerleave", off); btn.addEventListener("pointercancel", off);
    });
    document.querySelectorAll("[data-key]").forEach(btn => btn.addEventListener("click", e => {
      e.preventDefault();
      window.dispatchEvent(new KeyboardEvent("keydown", { key: btn.dataset.key }));
    }));
    g.title();
    const loop = now => { g.frame(now); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } catch (err) {
    status.textContent = "Could not load the world: " + err.message;
    console.error(err);
  }
};
